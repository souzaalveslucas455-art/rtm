<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Band Desenvolvedores</title>
<meta name="theme-color" content="#C8102E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Band Desenvolvedores">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--w:520px;--red:#E4002B;--red-dk:#C8102E;--red-lt:#FDE7EB;
 --ink:#16181D;--ink2:#5B6169;--ink3:#8E959D;--line:#E6E8EC;--bg:#F2F3F5;
 --blue:#1266C7;--blue-bg:#E8F1FC;--blue-sel:#1273DE;
 --teal:#0F7B6C;--teal-bg:#E6F4F1;--ok:#0B7A3B;--ok-bg:#E7F5EC;
 --wa:#9A6200;--wa-bg:#FFF4E0;--no:#93131F;--no-bg:#FDECEE;
 --sh:0 1px 2px rgba(22,24,29,.05),0 4px 14px rgba(22,24,29,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
/* A janela do app tem altura fixa. Sem isso o contêiner cresce com a lista,
   a página inteira passa a rolar e as barras de cima somem junto. */
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#2A2D33;
 overscroll-behavior-y:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
 color:var(--ink);font-size:15px;line-height:1.45;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
#tel{max-width:var(--w);margin:0 auto;height:100vh;height:100dvh;background:var(--bg);
 position:relative;display:flex;flex-direction:column;overflow:hidden;
 box-shadow:0 0 0 1px rgba(0,0,0,.25),0 18px 60px rgba(0,0,0,.45)}
@media(min-width:560px){#tel{height:calc(100dvh - 28px);margin:14px auto;border-radius:22px}}

/* ---------- login ---------- */
#login{position:absolute;inset:0;z-index:60;display:none;flex-direction:column;
 background:linear-gradient(165deg,#D0102C 0%,#A50C22 55%,#7E0819 100%);color:#fff;
 padding:calc(env(safe-area-inset-top) + 28px) 26px calc(env(safe-area-inset-bottom) + 20px);
 overflow-y:auto}
#login.on{display:flex}
#login::before{content:'';position:absolute;inset:0;pointer-events:none;
 background:radial-gradient(circle at 18% 78%,rgba(255,190,150,.20) 0 9px,transparent 10px),
 radial-gradient(circle at 74% 88%,rgba(255,190,150,.16) 0 14px,transparent 15px),
 radial-gradient(circle at 40% 94%,rgba(255,190,150,.13) 0 7px,transparent 8px),
 radial-gradient(circle at 88% 66%,rgba(255,190,150,.12) 0 5px,transparent 6px)}
.marca{text-align:center;margin:38px 0 auto;position:relative}
.marca .pts{display:flex;justify-content:center;gap:5px;margin-bottom:9px}
.marca .pts i{width:7px;height:7px;border-radius:50%;background:#fff;display:block;opacity:.9}
.marca .pts i:nth-child(2){opacity:.6}.marca .pts i:nth-child(4){opacity:.45}
.marca h1{margin:0;font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.marca p{margin:5px 0 0;font-size:14px;font-weight:700;letter-spacing:.22em;opacity:.95}
#login .campos{position:relative;margin-top:auto}
#login label{display:block;font-size:15px;font-weight:600;margin:0 0 7px}
#login input{width:100%;background:#fff;border:0;border-radius:11px;padding:15px 16px;
 font-size:16px;color:var(--ink);margin-bottom:16px;min-height:52px}
#login .olho{position:absolute;right:12px;top:38px;background:none;padding:8px;color:var(--ink3)}
#login .senha{position:relative}
#login .entrar{width:100%;background:#1C1E22;color:#fff;border-radius:11px;padding:16px;
 font-size:16px;font-weight:700;margin-top:6px;min-height:54px}
#login .aj{text-align:center;font-size:13px;margin-top:22px;opacity:.92}
#login .aj b{text-decoration:underline;cursor:pointer}
#login .ver{text-align:center;font-size:12px;opacity:.75;margin-top:8px}
#login .err{background:rgba(0,0,0,.28);border-radius:10px;padding:11px 13px;font-size:13.5px;
 margin-bottom:14px;display:none}
#login .err.on{display:block}

/* ---------- topo ---------- */
header{background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto;z-index:13;
 padding:calc(env(safe-area-inset-top) + 8px) 6px 8px;display:flex;align-items:center;gap:2px}
header .ic{padding:10px;color:var(--ink);display:flex}
header h2{flex:1;margin:0 0 0 4px;font-size:20px;font-weight:700;letter-spacing:-.01em}
header .ic.r{color:var(--ink2)}
header .ic svg{width:23px;height:23px}
header .ic.girando svg{animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
header .ic:disabled{opacity:.6}
.sino{position:relative}
.sino b{position:absolute;top:6px;right:6px;background:var(--red);color:#fff;font-size:9px;
 font-weight:800;border-radius:99px;padding:0 4px;min-width:14px;text-align:center;line-height:14px}

/* ---------- tira de dias ---------- */
.tira{background:#fff;border-bottom:1px solid var(--line);padding:6px 0 8px;flex:0 0 auto;z-index:11}
/* ---- faixas de aviso ---- */
#faixas{flex:0 0 auto;z-index:12}
.fx{display:flex;align-items:center;gap:11px;padding:10px 12px;cursor:pointer;
 border-bottom:1px solid rgba(0,0,0,.06)}
.fx.msg{background:#FDE7EB}
.fx.and{background:var(--wa-bg)}
.fx .mini{width:38px;height:38px;border-radius:9px;flex:0 0 auto;overflow:hidden;
 display:flex;align-items:center;justify-content:center;background:#fff}
.fx .mini img{width:100%;height:100%;object-fit:cover}
.fx .mini.ic{color:var(--red)}
.fx .mini.ic.and{color:var(--wa)}
.fx .mini svg{width:20px;height:20px}
.fx .tx{flex:1;min-width:0}
.fx .tx b{display:block;font-size:13.5px;font-weight:700;line-height:1.3}
.fx .tx span{display:block;font-size:12.5px;color:var(--ink2);line-height:1.35;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx .ver{flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--red);
 font-variant-numeric:tabular-nums}
.fx.and .ver{color:var(--wa)}
.fx .x{flex:0 0 auto;background:none;border:0;color:var(--ink3);font-size:20px;
 line-height:1;padding:0 2px}
.tira .rol{display:flex;gap:2px;overflow-x:auto;overflow-y:hidden;padding:0 10px 2px;
 scrollbar-width:none;scroll-snap-type:x proximity}
.tira .rol::-webkit-scrollbar{display:none}
.tira button{flex:0 0 auto;width:64px;text-align:center;padding:2px 0 0;scroll-snap-align:center;
 display:flex;flex-direction:column;align-items:center}
.tira .dw{font-size:12.5px;color:var(--ink2);margin-bottom:5px}
.tira .bola{width:44px;height:44px;border-radius:50%;background:#F1F2F4;
 display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;
 color:var(--ink);flex:0 0 auto}
.tira button.on .dw{color:var(--ink);font-weight:600}
.tira button.on .bola{background:var(--blue-sel);color:#fff}
/* o selo entra no fluxo normal, com recuo negativo, para não ser cortado pela rolagem */
.tira .cnt{display:block;background:var(--red);color:#fff;font-size:10px;font-weight:700;
 border-radius:99px;min-width:22px;padding:1px 6px;line-height:15px;margin-top:-8px;
 position:relative;border:2px solid #fff;box-sizing:content-box}
.tira .cnt.ok{background:var(--ok)}
.tira .leg{display:flex;gap:8px;justify-content:center;font-size:12.5px;color:var(--ink2);
 margin-top:10px;flex-wrap:wrap;padding:0 12px}
.tira .leg i{font-style:normal}
.tira .leg .d{color:var(--red)}

/* ---------- busca e alternador ---------- */
.barra{display:flex;gap:9px;padding:11px 12px;flex:0 0 auto;align-items:center;
 background:var(--bg);z-index:10;box-shadow:0 6px 10px -8px rgba(22,24,29,.28)}
.busca{flex:1;position:relative}
.busca input{width:100%;background:#fff;border:1px solid var(--line);border-radius:11px;
 padding:12px 12px 12px 40px;font-size:15px;min-height:48px}
.busca svg{position:absolute;left:12px;top:13px;width:20px;height:20px;color:var(--ink3)}
.bfil{width:48px;height:48px;background:#fff;border:1px solid var(--line);border-radius:11px;
 display:flex;align-items:center;justify-content:center;color:var(--ink2);position:relative}
.bfil.on{color:var(--red);border-color:var(--red)}
.bfil b{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:9.5px;
 border-radius:99px;padding:1px 5px}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:11px;padding:3px;height:48px}
.seg button{width:46px;border-radius:9px;display:flex;align-items:center;justify-content:center;
 color:var(--ink2)}
.seg button.on{background:#fff;color:var(--red);box-shadow:var(--sh)}
.seg svg{width:21px;height:21px}

/* ---------- corpo ---------- */
/* min-height:0 é o que faz a lista rolar dentro da área e não empurrar a página inteira,
   mantendo a tira de datas e a busca sempre visíveis */
/* A folga extra no fim evita que o selo da hospedagem, fixado no canto inferior
   direito, encoste no último item da lista. */
main{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
 padding:8px 12px calc(env(safe-area-inset-bottom) + 34px);-webkit-overflow-scrolling:touch}
main.nopad{padding:0}
#mapa{width:100%;height:100%;min-height:340px;background:#e9edf0}
.card{background:#fff;border-radius:13px;box-shadow:var(--sh);margin-bottom:11px;
 border-left:4px solid var(--blue-sel);overflow:hidden}
.card.done{border-left-color:var(--ok)}
.card.nao{border-left-color:var(--no)}
.card .top{display:flex;gap:9px;padding:12px 13px 0;align-items:flex-start}
.card .tt{flex:1;min-width:0;font-size:14px;font-weight:700;line-height:1.35;
 word-break:break-word}
.card .tt .seq{color:var(--ink3);font-weight:700}
.card .chips{display:flex;flex-direction:column;gap:4px;align-items:stretch;flex:0 0 86px}
.chip{font-size:11px;font-weight:600;padding:3px 0;border-radius:7px;white-space:nowrap;
 display:block;text-align:center}
.chip.pri-a{background:var(--no-bg);color:var(--no)}
.chip.pri-m{background:var(--wa-bg);color:var(--wa)}
.chip.pri-b{background:var(--teal-bg);color:var(--teal)}
.chip.st-p{background:var(--blue-bg);color:var(--blue)}
.chip.st-a{background:var(--wa-bg);color:var(--wa)}
/* visita que caiu neste dia por um cancelamento anterior */
.chip.st-r{background:#FDE7EB;color:var(--red)}
.card.remarcada{border-left-color:var(--red);background:#FFFBFC}
/* visita finalizada fica verde, para o dia fechado ser visível de longe */
.card.done{border-left-color:var(--ok)}
.card.done .chip.st-o{background:#E7F5EC;color:#0B7A3B}
.card.done .pg i{background:var(--ok)}
.chip.st-x{background:#EDEFF2;color:#5B6169}
.card.canc{border-left-color:#8E959D}
.card.andando{border-left-color:var(--wa)}
.card .pe .cron{font-variant-numeric:tabular-nums;color:var(--wa);font-weight:700}
.chip.st-c{background:var(--ok-bg);color:var(--ok)}
.chip.st-n{background:var(--no-bg);color:var(--no)}
.card .hora{font-size:12px;color:var(--ink2);text-align:right;padding:4px 13px 0}
.card .end{font-size:12.5px;color:var(--ink2);padding:4px 13px 0;line-height:1.45}
.card .base{display:flex;align-items:center;gap:8px;padding:8px 13px 10px}
.card .base .nm{flex:1;min-width:0;font-size:12.5px;color:var(--ink2);line-height:1.35;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.acao{width:38px;height:38px;border-radius:50%;background:var(--red-lt);color:var(--red);
 display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.acao svg{width:18px;height:18px}
.card .pe{display:flex;align-items:center;gap:10px;padding:0 13px 12px}
.card .pe .pg{flex:1;height:6px;border-radius:4px;background:#EDEFF2;overflow:hidden}
.card .pe .pg i{display:block;height:100%;background:var(--ok)}
.card .pe span{font-size:12.5px;color:var(--ink2)}
.vazio{text-align:center;color:var(--ink3);font-size:14px;padding:40px 20px}
/* ---- visitas feitas ---- */
.fbusca{display:flex;gap:8px;align-items:stretch}
.fbt{background:#fff;border:1px solid var(--line);border-radius:11px;padding:0 13px;
 display:flex;align-items:center;gap:7px;font-size:14px;color:var(--ink2);font-weight:600;
 flex:0 0 auto;min-height:46px}
.fbt svg{width:19px;height:19px}
.fbt.on{border-color:var(--red);color:var(--red);background:#FDE7EB}
.fnota{font-size:12.5px;color:var(--ink3);padding:0 2px 10px;line-height:1.5}
.fnota b{color:var(--red);font-weight:700;cursor:pointer}
.ped{background:#fff;border-radius:14px;box-shadow:var(--sh);margin-bottom:14px;
 padding:14px 15px;cursor:pointer}
.ped:active{background:#FCFCFD}
.ped .ptop{display:flex;align-items:center;justify-content:space-between;gap:8px;
 margin-bottom:11px}
.ped .pbadge,.pv .pbadge{display:inline-flex;align-items:center;gap:6px;border-radius:8px;
 padding:6px 10px;font-size:13px;font-weight:700}
.ped .pbadge svg,.pv .pbadge svg{width:16px;height:16px}
.ped .pst,.pv .pst{display:inline-flex;align-items:center;gap:5px;font-size:13px;
 font-weight:700;flex:0 0 auto}
.ped .pst svg,.pv .pst svg{width:16px;height:16px}
.ped .pst.ok,.pv .pst.ok{color:var(--ok)}
.ped .pst.fila,.pv .pst.fila{color:var(--wa)}
.ped .plin{display:flex;align-items:flex-start;gap:9px;padding:3px 0;font-size:14.5px;
 color:var(--ink2);line-height:1.35}
.ped .plin svg{width:19px;height:19px;flex:0 0 auto;color:var(--ink3);margin-top:1px}
.ped .plin span{flex:1;min-width:0}
.ped .plin.forte span{font-weight:700;color:var(--ink);font-size:15px}
.ped .pbase{display:flex;align-items:center;gap:12px;margin-top:12px;
 border-top:1px solid var(--line);padding-top:12px}
.ped .pfoto{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:0 0 auto;
 background:#EDEFF2}
.ped .pfoto.vazia{display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.ped .pfoto.vazia svg{width:22px;height:22px}
.ped .pmet{flex:1;min-width:0;display:flex;gap:14px}
.ped .pmet>div{min-width:0}
.ped .pmet span{display:block;font-size:11.5px;color:var(--ink3)}
.ped .pmet b{display:block;font-size:13.5px;color:var(--ink);white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis}
.ped .pseta{width:44px;height:44px;border-radius:50%;background:#FDE7EB;color:var(--red);
 flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.ped .pseta svg{width:21px;height:21px}
.dlin{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:13.5px;
 color:var(--ink2);border-bottom:1px solid var(--line)}
.dlin:last-child{border-bottom:0}
.dlin b{color:var(--ink);text-align:right;max-width:60%}
/* ---- plano de visita ---- */
.pv{background:#fff;border-radius:13px;box-shadow:var(--sh);padding:14px 15px;margin:8px 0 0}
.pv .pvtopo{display:flex;align-items:center;gap:12px;cursor:pointer}
.pv .lj{width:44px;height:44px;border-radius:50%;background:#F1F2F4;flex:0 0 auto;
 display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.pv .lj svg{width:24px;height:24px}
.pv .pvtopo .tx{flex:1;min-width:0}
.pv .pvtopo .tx b{display:block;font-size:15.5px;font-weight:700;line-height:1.3}
.pv .pvtopo .tx span{display:block;font-size:13px;color:var(--ink2);line-height:1.4;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv .ch{flex:0 0 auto;color:var(--red);display:flex}
.pv .ch svg{width:20px;height:20px}
.pv .pvsep{border-top:1px solid var(--line);margin:13px 0}
.pv .pvlin{display:flex;align-items:flex-start;gap:10px}
.pv .pvlin .nm{flex:1;min-width:0;font-size:15px;font-weight:700;line-height:1.35}
.pv .pvlin .hr{flex:0 0 auto;display:flex;align-items:center;gap:6px;font-size:15px;
 color:var(--ink)}
.pv .pvlin .hr svg{width:17px;height:17px;color:var(--ink2)}
.pv .pvlin .hr{flex-wrap:wrap;justify-content:flex-end}
.pv .pvlin .hr .hrlab{font-size:11px;color:var(--ink3);width:100%;text-align:right;
 font-weight:400;line-height:1.2}
.pv .pvlin.sub2{margin-top:5px;font-size:12.5px;color:var(--ink2);justify-content:space-between}
.pv .pvlin .hist{display:flex;align-items:center;gap:6px;color:var(--red);font-weight:600}
.pv .pvlin .hist{cursor:pointer}
.pv .pvlin .hist i{background:var(--red);color:#fff;border-radius:99px;font-style:normal;
 font-size:10.5px;min-width:17px;text-align:center;padding:1px 5px}
.pv .pvlin .hist svg{width:15px;height:15px}
.pv .pvlin .hist:active{opacity:.6}
.pv .pvbt{display:flex;gap:10px;margin-top:14px}
.pv .pvbt button{flex:1;border-radius:11px;padding:14px 8px;font-size:15.5px;font-weight:700;
 display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px}
.pv .pvbt svg{width:19px;height:19px}
.pv .pvcancel{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.pv .pvgo{background:var(--red);color:#fff;border:0}
.pv .pvgo:disabled{opacity:.6}
.gl2{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;
 font-weight:700;margin:18px 0 0}
.pvgps .glin{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13.5px;
 color:var(--ink2)}
.pvgps .glin b{color:var(--ink);font-variant-numeric:tabular-nums}
/* ---- notificações ---- */
.nt{display:flex;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);
 align-items:flex-start}
.nt .ic{width:46px;height:46px;border-radius:9px;flex:0 0 auto;display:flex;
 align-items:center;justify-content:center}
.nt .ic svg{width:24px;height:24px}
.nt .ic img{width:100%;height:100%;object-fit:cover;border-radius:9px;display:block}
.nt .tx{flex:1;min-width:0}
.nt .tx b{display:block;font-size:15px;font-weight:700;line-height:1.3;margin-bottom:2px}
.nt .tx span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
 overflow:hidden;font-size:13.5px;color:var(--ink2);line-height:1.45}
.nt .dt{flex:0 0 auto;font-size:12.5px;color:var(--ink3);padding-top:2px}
.nt.clic{cursor:pointer}
.nt.clic:active{background:#F7F8FA}
.nt .ch{flex:0 0 auto;color:var(--ink3);display:flex;align-items:center;padding-top:2px}
.nt .ch svg{width:16px;height:16px}
/* ---- ficha de cliente ---- */
.cli{background:#fff;border-radius:13px;box-shadow:var(--sh);margin-bottom:11px;padding:13px 14px}
.cli .ct{display:flex;align-items:center;gap:9px}
.cli .lj{width:26px;height:26px;flex:0 0 auto;color:var(--ink2);display:flex}
.cli .lj svg{width:24px;height:24px}
.cli .nm{flex:1;min-width:0;font-size:15px;font-weight:700;line-height:1.3;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cli .cod{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:600;
 color:var(--ink);flex:0 0 auto}
.cli .cod svg{width:17px;height:17px;color:#E8B10A}
.cli .sep{border-top:1px dashed var(--line);margin:11px 0}
.cli .cb{display:flex;align-items:center;gap:9px}
.cli .ag{flex:1;min-width:0;font-size:13.5px;color:var(--ink2);line-height:1.5}

/* ---------- gaveta ---------- */
#gav{position:absolute;inset:0;z-index:50;display:none}
#gav.on{display:block}
#gav .fundo{position:absolute;inset:0;background:rgba(22,24,29,.45)}
#gav .painel{position:absolute;top:0;left:0;bottom:0;width:84%;max-width:330px;background:#fff;
 display:flex;flex-direction:column;overflow:hidden}
#gav .cabeca{padding:calc(env(safe-area-inset-top) + 18px) 18px 0;flex:0 0 auto}
#gav .meio{flex:1;min-height:0;overflow-y:auto;padding:0 12px;overscroll-behavior:contain}
#gav .rodape{flex:0 0 auto;padding:0 12px calc(env(safe-area-inset-bottom) + 12px)}
#gav .quem{display:flex;align-items:center;gap:12px;margin-bottom:14px}

<script>
/* ===========================================================================
   Band Desenvolvedores — app de campo
   A base vem embutida e funciona sem internet. As respostas ficam no aparelho
   e sobem para a planilha assim que houver sinal.

const VERSAO='2.2.0';
const M=JSON.parse(document.getElementById('M').textContent);
const DEVS=M.devs,CNAES=M.cnaes,BAIRROS=M.bairros,ROTAS=M.rotas,SVS=M.svs,CONS=M.cons;

/* O acesso agora é pelo servidor: usuário e senha de cada desenvolvedor no
   Supabase, e um PIN de 4 números no aparelho para o dia a dia. */

const PRION=['Alta','Média','Baixa'];
/* A faixa vem do canal do PDV, conforme a atividade principal registrada na Receita:
   é o que melhor indica quanto de bebida o ponto vende. */
const EXPRIO=['bebidas, bar, mercearia e conveniência',
              'restaurante, lanchonete e padaria',
              'demais canais de alimentação'];
const PRIOK=['pri-a','pri-m','pri-b'];
const PORTEN={1:'Micro empresa',3:'Pequeno porte',5:'Demais'};
const PRECN=['CEP exato','quadra do CEP','rua conhecida','setor do CEP',
             'faixa do CEP','centro do bairro','centro da cidade'];
const BASE=[];
/* A carteira NAO vem mais embutida no app (o arquivo fica publico no GitHub e
   trazia nome, telefone e endereco de todos os PDVs). Ela chega pelo login,
   so a de cada desenvolvedor, e fica guardada no aparelho. */
if(document.getElementById('B')){
  const L=document.getElementById('B').textContent.split('\n');
  for(const l of L){
    if(!l)continue;
    const p=l.split('|');
    BASE.push({cnpj:p[0],dev:+p[1],dia:+p[2],seq:+p[3],
      lat:(+p[4])/100000-20,lon:(+p[5])/100000-55,rt:+p[6],sv:+p[7],cons:+p[8],
      ba:+p[9],cn:+p[10],porte:+p[11],pr:+p[12],prec:+p[13],
      cep:p[14],tel:p[15],nome:p[16],end:p[17]});
  }
}
document.getElementById('M').remove();

/* O roteiro embutido é o ponto de partida. Quando o coordenador publica um novo
   pelo painel, o app baixa e passa a usar aquele — sem precisar reinstalar nada. */
let PLANO=null;
try{const g=localStorage.getItem('rtm_plano');if(g)PLANO=JSON.parse(g)}catch(e){}
/* Clientes ativos perto do roteiro de cada dia, enviados pelo painel. */
let VIZ={};
function vizinhosDoDia(dia){
  const k=S.dev+'|'+(dia==null?fDia:dia);
  return (VIZ&&VIZ[k])?VIZ[k]:[];
}
function aplicaPlano(p){
  if(!p||!Array.isArray(p.clientes))return false;
  if(!p.clientes.length&&!p.versao)return false;
  const iCn={},iBa={},iRt={},iSv={},iCo={};
  const idx=(m,arr,v)=>{if(v==null||v==='')v='—';
    if(m[v]===undefined){m[v]=arr.length;arr.push(v)}return m[v]};
  const cn=[],ba=[],rt=[],sv=[],co=[];
  const novo=p.clientes.map(c=>({
    cnpj:String(c.cnpj),dev:+c.dev||0,dia:+c.dia||1,seq:+c.seq||1,
    lat:+c.lat,lon:+c.lon,
    rt:idx(iRt,rt,c.rota),sv:idx(iSv,sv,c.sv),cons:idx(iCo,co,c.consultor),
    ba:idx(iBa,ba,c.bairro),cn:idx(iCn,cn,c.cnae),
    porte:1,pr:+c.prioridade||0,prec:+c.precisao||0,
    cep:'',tel:c.tel||'',nome:c.nome||'',
    /* o roteiro publicado não traz o logradouro; sem isso o card fica com uma
       linha vazia, então usamos bairro e cidade como endereço de referência */
    end:c.endereco||[c.bairro,c.cidade].filter(Boolean).join(', '),
    dataPlan:c.data||''}));
  BASE.length=0;Array.prototype.push.apply(BASE,novo);
  CNAES.length=0;Array.prototype.push.apply(CNAES,cn);
  BAIRROS.length=0;Array.prototype.push.apply(BAIRROS,ba);
  ROTAS.length=0;Array.prototype.push.apply(ROTAS,rt);
  SVS.length=0;Array.prototype.push.apply(SVS,sv);
  CONS.length=0;Array.prototype.push.apply(CONS,co);
  DEVS.length=0;Array.prototype.push.apply(DEVS,p.devs&&p.devs.length?p.devs:
    [...new Set(novo.map(c=>'Desenvolvedor '+(c.dev+1)))]);
  if(p.porDia)S.metas.porDia=+p.porDia;
  for(const k in _amostraDia)delete _amostraDia[k];
  const cidades=[...new Set(p.clientes.map(c=>c.cidade).filter(Boolean))];
  VIZ=p.vizinhos||{};
  PLANO={versao:String(p.versao||''),inicio:p.inicio||'',porDia:p.porDia||30,
         devs:DEVS.slice(),total:novo.length,baixadoEm:new Date().toISOString(),
         escopo:p.escopo||(cidades.length===1?cidades[0]
                 :cidades.length>1?cidades.length+' municípios':'')};
  try{localStorage.setItem('rtm_plano',JSON.stringify(PLANO));
      localStorage.setItem('rtm_plano_dados',JSON.stringify(p))}catch(e){}
  montaCal();
  return true;
}
/* o roteiro guardado é aplicado mais abaixo, depois de o estado (S) existir:
   antes ele rodava aqui, dava erro em S.metas e os clientes próximos sumiam
   a cada vez que o app era reaberto */

/* ---------------- calendário de dias úteis, a partir de setembro ---------------- */
const INICIO=[2026,9,1];
const FERIADOS=['2026-09-07','2026-10-12','2026-11-02','2026-11-15','2026-11-20','2026-12-25',
 '2027-01-01','2027-02-15','2027-02-16','2027-04-02','2027-04-21','2027-05-01','2027-05-27',
 '2027-09-07','2027-10-12','2027-11-02','2027-11-15','2027-11-20','2027-12-25'];
const SEMANA=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const p2=n=>('0'+n).slice(-2);
let CAL=[];
function montaCal(){CAL=(function(){
  const total=Math.max.apply(null,BASE.map(c=>c.dia))+1,out=[];
  const d=new Date(Date.UTC(INICIO[0],INICIO[1]-1,INICIO[2]));
  while(out.length<total){
    const w=d.getUTCDay(),iso=d.toISOString().slice(0,10);
    if(w>=1&&w<=5&&FERIADOS.indexOf(iso)<0)
      out.push({iso,dia:d.getUTCDate(),mes:d.getUTCMonth(),ano:d.getUTCFullYear(),dow:w});
    d.setUTCDate(d.getUTCDate()+1);
  }
  return out;
})()}
montaCal();
/* aceita aaaa-mm-dd ou dd/mm/aaaa e devolve sempre uma data utilizável */
function isoDe(t){
  const s=String(t||'');
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m)return m[1]+'-'+m[2]+'-'+m[3];
  m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})/); if(m)return m[3]+'-'+m[2]+'-'+m[1];
  return '';
}
const _amostraDia={};
function amostraDoDia(n){
  if(_amostraDia[n]!==undefined)return _amostraDia[n];
  const doDia=BASE.filter(x=>x.dia===n);
  /* prefere um cliente que sempre foi deste dia: um remarcado pode ter vindo
     com a data do dia de origem */
  const r=S.reagendados||{};
  const proprio=doDia.filter(x=>!r[x.cnpj])[0];
  return _amostraDia[n]=proprio||doDia[0]||null;
}
/* O calendário embutido cobre só o roteiro que veio no app. Um roteiro publicado
   pode ser mais longo, e aí o número do dia tem que sair da data do próprio plano. */
function numeroDoDia(n){
  const t=dataDo(n);
  if(t)return t.slice(0,2);
  const c=CAL[n-1];
  return c?p2(c.dia):String(n);
}
function dataDo(n){
  if(PLANO){
    const c=amostraDoDia(n),iso=c?isoDe(c.dataPlan):'';
    if(iso)return iso.slice(8,10)+'/'+iso.slice(5,7);
  }
  const c=CAL[n-1];return c?p2(c.dia)+'/'+p2(c.mes+1):'';
}
/* Se o roteiro for maior que o calendário, seguimos contando dias úteis
   a partir do início do plano, em vez de ficar sem data. */
function isoDoDia(n){
  const c=BASE.filter(x=>x.dia===n)[0];
  if(c&&c.dataPlan)return isoDe(c.dataPlan);
  const k=CAL[n-1];
  return k?k.iso:'';
}
function dowDo(n){
  if(PLANO){
    const c=amostraDoDia(n),iso=c?isoDe(c.dataPlan):'';
    if(iso){
      const d=new Date(iso+'T12:00:00Z');
      if(!isNaN(d.getTime()))return SEMANA[d.getUTCDay()]||'';
    }
  }
  const c=CAL[n-1];return c?SEMANA[c.dow]:'';
}
function mesDo(n){
  if(PLANO){
    const c=amostraDoDia(n),iso=c?isoDe(c.dataPlan):'';
    if(iso){const m=MESES[+iso.slice(5,7)-1];if(m)return m+'/'+iso.slice(2,4)}
  }
  const c=CAL[n-1];return c?MESES[c.mes]+'/'+String(c.ano).slice(2):'';
}
function diaDeHoje(){
  const h=new Date(),iso=h.getFullYear()+'-'+p2(h.getMonth()+1)+'-'+p2(h.getDate());
  if(PLANO){const c=BASE.filter(x=>isoDe(x.dataPlan)===iso)[0];return c?c.dia:null}
  for(let i=0;i<CAL.length;i++) if(CAL[i].iso===iso) return i+1;
  return null;
}
/* janela sugerida de atendimento: 15 min por visita, com uma hora de almoço */
function janela(seq){
  const i=seq-1, min=8*60+i*15+(i>=16?60:0);
  const f=m=>p2(Math.floor(m/60))+':'+p2(m%60);
  return f(min)+' – '+f(min+14);
}

/* ---------------- estado ---------------- */
const GUARDA=(function(){try{localStorage.setItem('rtm__t','1');
  const ok=localStorage.getItem('rtm__t')==='1';localStorage.removeItem('rtm__t');return ok?'ok':'falha'}
  catch(e){return 'bloqueado'}})();
const LOCAL=location.protocol==='file:';
const METAS_PADRAO={porDia:M.porDia,diasMes:M.diasUteis};
const CHAVE='rtm_campo';
let S={dev:null,email:'',vis:{},metas:Object.assign({},METAS_PADRAO),sync:{},
  /* visita começada e ainda não salva: sobrevive a sair do módulo e a fechar o app */
  andamento:null};
try{const g=localStorage.getItem(CHAVE);if(g)S=Object.assign(S,JSON.parse(g))}catch(e){}
if(!S.sync)S.sync={};
delete S.sync.url;delete S.sync.segredo;
try{
  const d=localStorage.getItem('rtm_plano_dados');
  if(d)aplicaPlano(JSON.parse(d));
}catch(e){}

function save(){
  try{localStorage.setItem(CHAVE,JSON.stringify(S))}
  catch(e){ if(!avisouSave){avisouSave=true;
      alert('ATENÇÃO: o navegador não está gravando as visitas neste aparelho.\n\n'+
        'Abra o app pelo endereço https que o gestor enviou, não pelo arquivo baixado.');}
    toast('Não foi possível salvar no aparelho'); }
}

let tela_='visitas',cur=null,tmp=null,fDia=null,fQ='',fQc='',modoLista=true,ultimo=null;
/* histórico de avisos do próprio app, guardado no aparelho */
function anota(tipo,titulo,texto){
  if(!S.avisos)S.avisos=[];
  const t=agora();
  S.avisos.unshift({tipo,titulo,texto,data:t.data,hora:t.hora,novo:true});

  save();
  const b=$('sinob'); if(b){const n=naoLidos();b.style.display=n?'block':'none';
    b.textContent=n>99?'99+':n}
}
const naoLidos=()=>((S.avisos||[]).filter(a=>a.novo).length)+(MSGS.novas||0);
let MSGS={lista:[],novas:0};
const F={st:'todos', pr:new Set(), aprox:false};   /* filtros do módulo de visitas */
const nFiltros=()=>(F.st!=='todos'?1:0)+(F.pr.size?1:0)+(F.aprox?1:0);
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Math.round(n||0).toLocaleString('pt-BR');
let toastT;
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2600)}
function agora(){const d=new Date();
  return {data:p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear(),
    hora:p2(d.getHours())+':'+p2(d.getMinutes()),iso:d.toISOString(),dow:SEMANA[d.getDay()]}}
function hav(a,b,c,e){const R=6371,p=Math.PI/180;
  const x=Math.sin((c-a)*p/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin((e-b)*p/2)**2;
  return 2*R*Math.asin(Math.sqrt(x))}
const fmtKm=k=>{const n=Number(k);
  if(!isFinite(n))return '—';
  return n<1?Math.round(n*1000)+' m':n.toFixed(1)+' km'};
/* Coordenada que vale: número de verdade. Vazio, nulo ou texto viram nada.
   Sem isto, um registro vindo da planilha sem GPS quebrava a tela. */
function coordOk(g){
  if(!g)return null;
  const la=Number(g.lat),lo=Number(g.lon);
  if(!isFinite(la)||!isFinite(lo)||g.lat===''||g.lat==null||g.lon===''||g.lon==null)
    return null;
  return {lat:la,lon:lo,acc:Number(g.acc)||0};
}
const coordTxt=g=>{const c=coordOk(g);
  return c?c.lat.toFixed(6)+', '+c.lon.toFixed(6):'não capturado'};
const minha=()=>BASE.filter(c=>c.dev===S.dev);
const reg=c=>S.vis[c.cnpj];
/* Visita cancelada e remarcada não conta como feita: ela volta a ser pendente

const feito=c=>{const v=S.vis[c.cnpj];return !!v&&!v.reagendada};
const remarcada=c=>{const v=S.vis[c.cnpj];return !!(v&&v.reagendada)};

   O app fala com o banco do RTM no Supabase do merch. A chave abaixo é a
   publicável, feita para ficar no app: o que protege os dados é o login de
   cada um e as regras do banco (cada desenvolvedor só alcança o que é dele). */
const SUPA={url:'https://kqpdledhaghuzuwjkvrf.supabase.co',chave:'sb_publishable_dMdB5b_G5X5TnXemexGIXQ_GWXS6cid'};
const K_SESSAO='rtm_sessao',K_PIN='rtm_pin';
let SESSAO=null;try{SESSAO=JSON.parse(localStorage.getItem(K_SESSAO)||'null')}catch(e){}
let DESBLOQ=false;
function guardaSessao(j){
  SESSAO=j?{access_token:j.access_token,refresh_token:j.refresh_token,
    expira:Date.now()+((+j.expires_in||3600)*1000)}:null;
  try{SESSAO?localStorage.setItem(K_SESSAO,JSON.stringify(SESSAO)):localStorage.removeItem(K_SESSAO)}
  catch(e){}
}
function erroDe(j,status){
  const m=String((j&&(j.message||j.msg||j.error_description||j.error))||('erro '+status));
  if(/Invalid login credentials|invalid_credentials|invalid_grant/i.test(m))
    return 'E-mail ou senha incorretos.';
  return m;
}
async function pede(caminho,opc){
  let r;
  try{ r=await fetch(SUPA.url+caminho,opc) }
  catch(e){ throw new Error('Sem conexão com o servidor.') }
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  return {ok:r.ok,status:r.status,j,t};
}
function semSessao(){
  const e=new Error('Sua sessão expirou. Entre de novo com a senha.');e.semSessao=true;return e;
}
async function autentica(email,senha){
  const r=await pede('/auth/v1/token?grant_type=password',{method:'POST',
    headers:{apikey:SUPA.chave,'Content-Type':'application/json'},
    body:JSON.stringify({email,password:senha})});
  if(!r.ok)throw new Error(erroDe(r.j,r.status));
  guardaSessao(r.j);
}
/* uma renovação por vez: o servidor só aceita cada chave de renovação uma vez */
let renovando=null;
function renova(){
  if(renovando)return renovando;
  if(!SESSAO||!SESSAO.refresh_token)return Promise.reject(semSessao());
  renovando=pede('/auth/v1/token?grant_type=refresh_token',{method:'POST',
      headers:{apikey:SUPA.chave,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:SESSAO.refresh_token})})
    .then(r=>{
      if(r.ok){guardaSessao(r.j);return}
      if(r.status>=400&&r.status<500){guardaSessao(null);throw semSessao()}
      throw new Error(erroDe(r.j,r.status));
    })
    .finally(()=>{renovando=null});
  return renovando;
}
async function token(){
  if(!SESSAO)throw semSessao();
  if(Date.now()>SESSAO.expira-60000)await renova();
  return SESSAO.access_token;
}
/* chama uma função do banco do RTM */
async function rpc(nome,args,tentou){
  const tk=await token();
  const r=await pede('/rest/v1/rpc/'+nome,{method:'POST',headers:{apikey:SUPA.chave,
    Authorization:'Bearer '+tk,'Content-Type':'application/json',
    'Content-Profile':'rtm','Accept-Profile':'rtm'},body:JSON.stringify(args||{})});
  if(r.status===401&&!tentou){await renova();return rpc(nome,args,true)}
  if(r.status===401){guardaSessao(null);throw semSessao()}
  if(!r.ok)throw new Error(erroDe(r.j,r.status));
  return r.j;
}
const caminhoUrl=c=>String(c).split('/').map(encodeURIComponent).join('/');
/* sobe um arquivo para a pasta rtm-fotos. Se ele já tinha subido numa tentativa
   anterior (o servidor responde "já existe"), conta como enviado. */
async function sobeArquivo(caminho,blob,tipo,tentou){
  const tk=await token();
  const r=await pede('/storage/v1/object/rtm-fotos/'+caminhoUrl(caminho),{method:'POST',
    headers:{apikey:SUPA.chave,Authorization:'Bearer '+tk,'Content-Type':tipo||'image/jpeg',
      'x-upsert':'false'},body:blob});
  if(r.ok)return true;
  if(/Duplicate|already exists/i.test(r.t||''))return true;
  if(!tentou&&(r.status===401||/jwt|token/i.test(r.t||''))){
    await renova();return sobeArquivo(caminho,blob,tipo,true)}
  throw new Error(erroDe(r.j,r.status));
}
/* As fotos são privadas: para mostrar, o servidor dá um link que vale 1 hora. */
const ASSIN={};let assinT=null;
const PIXEL='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
function assina(cam){
  const a=ASSIN[cam]; if(a&&(a.pedindo||a.ate>Date.now()))return;
  ASSIN[cam]={pedindo:true,ate:0};
  token().then(tk=>pede('/storage/v1/object/sign/rtm-fotos/'+caminhoUrl(cam),{method:'POST',
      headers:{apikey:SUPA.chave,Authorization:'Bearer '+tk,'Content-Type':'application/json'},
      body:JSON.stringify({expiresIn:3600})}))
   .then(r=>{
     const u=r.ok&&r.j&&(r.j.signedURL||r.j.signedUrl);
     if(!u)throw new Error('sem link');
     ASSIN[cam]={url:/^https?:/.test(u)?u:SUPA.url+'/storage/v1'+u,ate:Date.now()+50*60000};
     clearTimeout(assinT);
     assinT=setTimeout(()=>atualizaTela(),150);
   })
   .catch(()=>{ASSIN[cam]={ate:Date.now()+60000,url:''}});
}

async function hashPin(pin,sal){
  const dados=new TextEncoder().encode(sal+'|'+pin);
  if(window.crypto&&crypto.subtle){
    const b=await crypto.subtle.digest('SHA-256',dados);
    return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
  }
  let h=0;for(const c of dados)h=(h*31+c)|0;return 'x'+h;
}

async function salvaPin(){
  const a=$('lpin').value,b=$('lpin2').value;
  if(!/^\d{4}$/.test(a))return pintaCriaPin('O PIN tem 4 números.');
  if(a!==b)return pintaCriaPin('Os dois PINs não são iguais.');
  if(/^(\d)\1{3}$/.test(a)||a==='1234')return pintaCriaPin('Escolha um PIN menos óbvio.');
  const sal=Math.random().toString(36).slice(2)+Date.now().toString(36);
  try{localStorage.setItem(K_PIN,JSON.stringify({login:S.login,sal,hash:await hashPin(a,sal),erros:0}))}
  catch(e){return pintaCriaPin('O navegador não deixou guardar o PIN.')}
  entraNoApp();
}

let conferindo=false;
async function confere(){
  const p=lePin(),v=$('lpin').value;
  if(!p)return pintaLogin();
  /* o PIN confere sozinho ao digitar o 4o número; tocar em Entrar logo depois
     não pode contar como uma segunda tentativa errada */
  if(conferindo)return;
  if(!/^\d{4}$/.test(v))return pintaPin('Digite os 4 números do PIN.');
  conferindo=true;
  try{ return await confere2(p,v) } finally { conferindo=false }
}
async function confere2(p,v){
  if(await hashPin(v,p.sal)===p.hash){
    p.erros=0;try{localStorage.setItem(K_PIN,JSON.stringify(p))}catch(e){}
    return entraNoApp();
  }
  p.erros=(p.erros||0)+1;
  if(p.erros>=5){
    try{localStorage.removeItem(K_PIN)}catch(e){}
    guardaSessao(null);
    return pintaLogin('PIN errado 5 vezes. Entre com a sua senha.');
  }
  try{localStorage.setItem(K_PIN,JSON.stringify(p))}catch(e){}
  pintaPin('PIN errado. Restam '+(5-p.erros)+' tentativa(s).');
}

function diaSugerido(){
  const m=minha(),max=Math.max.apply(null,m.map(c=>c.dia)),h=diaDeHoje();
  if(h&&h<=max)return h;
  for(let d=1;d<=max;d++) if(m.filter(c=>c.dia===d).some(c=>!feito(c)))return d;
  return 1;
}

/* Manda as visitas pendentes, até 200 por vez. Agora o servidor responde de
   verdade: só marca como enviada a que ele confirmou. A que ele recusar (CNPJ
   inválido) sai da fila com um aviso, em vez de ficar tentando para sempre. */
function enviar(silencioso){
  if(!SESSAO){if(!silencioso)toast('Entre com a sua senha para enviar');return}
  if(enviando){refazer=true;return}
  const ids=pendentes().slice(0,200);
  if(!ids.length){if(!silencioso)toast('Tudo já enviado');return}
  if(!navigator.onLine){if(!silencioso)toast('Sem conexão — sobe sozinho depois');return}
  enviando=true;
  if(!silencioso)toast('Enviando '+ids.length+'…');
  rpc('gravar_visitas',{p_visitas:pacote(ids)})
  .then(j=>{
    const rec={};(j.recusadas||[]).forEach(r=>rec[String(r.cnpj)]=r.motivo||'recusada');
    let ok=0;
    ids.forEach(k=>{const v=S.vis[k];if(!v)return;
      if(rec[k]){v.recusada=rec[k]}else{v.enviado=true;ok++}});
    const nr=Object.keys(rec).length;
    if(nr)anota('envio','Visita não aceita pelo servidor',
      nr+' visita(s) não entraram ('+Object.keys(rec).slice(0,3).map(k=>k+': '+rec[k]).join('; ')+
      '). Mostre este aviso ao coordenador.');
    if((j.avisos||[]).length)anota('envio','Campo não reconhecido',
      'Em '+j.avisos.length+' visita(s) algum campo não pôde ser lido ('+
      j.avisos.slice(0,3).map(a=>a.cnpj+': '+(a.campos||[]).join(', ')).join('; ')+').');
    S.sync.ultimo=agora().data+' '+agora().hora;save();enviando=false;
    if(ok>=5)anota('envio','Visitas enviadas',fmt(ok)+' visitas subiram para a base.');
    if(!silencioso)toast(ok+' visita(s) enviada(s)'+(nr?', '+nr+' recusada(s)':''));
    atualizaTela();
    if(refazer||pendentes().length){refazer=false;setTimeout(()=>enviar(silencioso),120)}
  })
  .catch(e=>{
    enviando=false;
    if(e.semSessao)return sessaoPerdida();
    if(!silencioso)toast('Falhou o envio: '+e.message+' — tentaremos de novo');
    clearTimeout(retentar);retentar=setTimeout(()=>enviar(true),15000);
  });
}

/* Links do Drive vêm em formatos que não carregam dentro de uma tag de imagem.
   Aqui qualquer variação é convertida para o formato que funciona. */
function linkImagem(u,largura){
  const t=String(u||'');
  if(!t)return '';
  /* foto ou imagem guardada na pasta privada do RTM */
  if(t.indexOf('rtm:')===0){
    const cam=t.slice(4),a=ASSIN[cam];
    if(a&&a.url&&a.ate>Date.now())return a.url;
    assina(cam);return PIXEL;
  }
  const m=t.match(/[-\w]{25,}/);
  if(/drive\.google\.com|googleusercontent/.test(t)&&m)
    return 'https://drive.google.com/thumbnail?id='+m[0]+'&sz=w'+(largura||1200);
  return t;
}

/* Avisa o desenvolvedor de verdade: notificação do sistema quando ele deu
   permissão, mais vibração e um aviso na tela. Sem serviço de push próprio,
   isso acontece quando o app está aberto ou volta a ficar em primeiro plano. */
function alertaMsg(m,quantas){
  try{ if(navigator.vibrate)navigator.vibrate([220,110,220]) }catch(e){}
  const titulo=quantas>1?quantas+' mensagens novas':(m.titulo||'Mensagem da coordenação');
  const corpo=quantas>1?(m.titulo||''):(m.texto||'');
  notificaSistema(titulo,corpo,/^https?:/.test(m.imagem||'')?m.imagem:'');
  toast(quantas>1?quantas+' mensagens novas':'Nova mensagem: '+(m.titulo||''));
}
function notificaSistema(titulo,corpo,img){
  if(typeof Notification==='undefined')return;
  const mostra=()=>{
    try{
      const opc={body:corpo,tag:'coordenacao',renotify:true,
        icon:img||undefined,badge:undefined,vibrate:[220,110,220]};
      if(navigator.serviceWorker&&navigator.serviceWorker.ready){
        navigator.serviceWorker.ready
         .then(r=>r.showNotification(titulo,opc))
         .catch(()=>{try{new Notification(titulo,opc)}catch(e){}});
      }else{ new Notification(titulo,opc) }
    }catch(e){}
  };
  if(Notification.permission==='granted')mostra();
  else if(Notification.permission!=='denied')
    Notification.requestPermission().then(p=>{if(p==='granted')mostra()});
}
function pedePermissaoAviso(){
  if(typeof Notification==='undefined')
    return toast('Este navegador não mostra alertas do sistema');
  if(Notification.permission==='granted')return toast('Alertas já estão liberados');
  Notification.requestPermission().then(p=>
    toast(p==='granted'?'Alertas liberados':'Você recusou os alertas'));
}
/* recibo: recebido agora, e lido quando ele abre a tela de notificações */
/* Os recibos são acumulados e vão num único envio, meio segundo depois.
   Antes cada mensagem custava uma ida ao servidor. */
let filaRecibo={recebidos:[],lidos:[]},reciboT=null;
function recibo(msgId,lido){
  if(!msgId)return;
  const l=lido?filaRecibo.lidos:filaRecibo.recebidos;
  if(l.indexOf(msgId)<0)l.push(msgId);
  clearTimeout(reciboT);
  reciboT=setTimeout(mandaRecibos,500);
}
function mandaRecibos(){
  if(!SESSAO||!navigator.onLine)return;
  [['recebidos',false],['lidos',true]].forEach(([campo,lido])=>{
    const ids=filaRecibo[campo];
    if(!ids.length)return;
    filaRecibo[campo]=[];
    rpc('registrar_recibos',{p_ids:ids,p_lido:lido})
      .catch(()=>{ids.forEach(i=>{if(filaRecibo[campo].indexOf(i)<0)filaRecibo[campo].push(i)})});
  });
}
/* Uma chamada só traz roteiro e mensagens. Antes eram três idas ao servidor,
   e cada ida ao Apps Script leva alguns segundos. */
let sincronizando=false;
function sincroniza(silencioso,restaurar){
  if(!SESSAO){if(!silencioso)toast('Entre com a sua senha para sincronizar');return}
  if(sincronizando){if(!silencioso)toast('Sincronizando…');return}
  if(!navigator.onLine){if(!silencioso)toast('Sem conexão — sincroniza quando voltar o sinal');return}
  sincronizando=true;
  if(!silencioso)girando(true);
  const t0=Date.now();
  /* Sem nenhuma visita guardada aqui, pedimos as que a base já tem deste
     desenvolvedor. É o que salva o dia quando troca de celular. */
  const precisaRestaurar=!!restaurar||!Object.keys(S.vis).length;
  rpc('sincronizar',{p_versao:PLANO?PLANO.versao:null,p_restaurar:precisaRestaurar})
   .then(j=>{
     const novidade=[];
     if(j.eu){S.nome=j.eu.nome||S.nome;S.login=j.eu.login||S.login}
     /* roteiro: o servidor manda só os meus clientes */
     if(j.plano&&Array.isArray(j.plano.clientes)){
       const p=j.plano;
       if(aplicaPlano(p)){
         S.dev=p.meuDev==null?-1:+p.meuDev;
         aplicaReagendados();
         fDia=diaSugerido();
         if(BASE.length){
           anota('roteiro','Roteiro atualizado',
             fmt(BASE.length)+' clientes na sua carteira, '+(p.porDia||S.metas.porDia)+
             ' por dia, começando em '+((p.inicio||'').split('-').reverse().join('/'))+'.');
           novidade.push('roteiro novo com '+fmt(BASE.length)+' clientes');
         }else{
           anota('roteiro','Você não está no roteiro publicado',
             'O roteiro '+(p.versao||'')+' não tem clientes para você. Fale com o coordenador.');
           novidade.push('roteiro novo sem clientes para você');
         }
       }
     }
     /* mensagens */
     if(j.mensagens){
       j.mensagens.forEach(m=>{if(!m.imagem&&m.imagemCaminho)m.imagem='rtm:'+m.imagemCaminho});
       MSGS.lista=j.mensagens;
       const vistas=S.msgVistas||[];
       const novas=j.mensagens.filter(m=>vistas.indexOf(chaveMsg(m))<0);
       MSGS.novas=novas.length;
       novas.forEach(m=>{if(m.id)recibo(m.id,false)});
       if(novas.length){
         alertaMsg(novas[0],novas.length);
         novidade.push(novas.length+(novas.length>1?' mensagens novas':' mensagem nova'));
       }
     }
     /* visitas que estão na base e não neste aparelho voltam para cá
        (o servidor só manda as deste desenvolvedor) */
     if(j.visitas&&j.visitas.length){
       let voltaram=0;
       j.visitas.forEach(v=>{
         const k=String(v.cnpj);
         if(S.vis[k])return;
         S.vis[k]=Object.assign({},v,{enviado:true,daBase:true,
           temFoto:!!(v.fotoCaminho||v.fotoUrl),fotoEnviada:true});
         delete S.vis[k].cnpj;
         voltaram++;
       });
       if(voltaram){
         novidade.push(voltaram+' visita(s) recuperada(s) da base');
         anota('envio','Visitas recuperadas',
           voltaram+' visita(s) que estavam na base voltaram para este aparelho.');
       }
     }
     S.sync.ultimaBusca=agora().hora; save();
     if(!silencioso)
       toast(novidade.length?novidade.join(' e '):'Tudo em dia ('+(Date.now()-t0)+' ms)');
     atualizaTela(!!novidade.length);
   })
   .catch(e=>{
     if(e.semSessao)return sessaoPerdida();
     if(!silencioso)toast('Não consegui sincronizar: '+(e.message||'sem conexão'));
   })
   .finally(()=>{sincronizando=false;girando(false)});
}

let pilha=[];
function tela(t,semHistorico){
  tela_=t;$('app').scrollTop=0;

  if($('folha').classList.contains('on')){fecharFolha();empilha();return}

    empilha();return;
  }
  /* do detalhe da mensagem, voltar leva à lista de notificações, não à raiz */
  if(tela_==='aviso'){tela_='avisos';render();empilha();return}
  if(tela_!=='visitas'){tela_='visitas';render();empilha();return}

function atualizaTela(forca){
  if(!DESBLOQ)return;

    tela_==='visitas'?(modoLista?vLista():'<div id="mapa"></div>'):
    tela_==='form'?vForm(): tela_==='ok'?vOk():
    tela_==='clientes'?vClientes(): tela_==='resultados'?vResultados():
    tela_==='feitas'?vFeitas(): tela_==='feita'?vFeitaDet():
    tela_==='perto'?vPerto():
    tela_==='plano'?vPlanoVisita(): tela_==='cancelar'?vCancelar():
    tela_==='avisos'?vAvisos(): tela_==='aviso'?vAviso():

function limparFiltros(){F.st='todos';F.pr.clear();F.aprox=false;abrirFiltros()}

/* ---------------- lista de visitas ---------------- */
function filtrados(){
  let l=minha().filter(c=>c.dia===fDia);
  if(F.st!=='todos')l=l.filter(c=>(F.st==='ok')===feito(c));
  if(F.pr.size)l=l.filter(c=>F.pr.has(c.pr));
  if(F.aprox)l=l.filter(c=>c.prec>=3);
  if(fQ)l=l.filter(c=>c.nome.toLowerCase().includes(fQ)||
    BAIRROS[c.ba].toLowerCase().includes(fQ)||c.end.toLowerCase().includes(fQ)||
    String(c.cnpj).includes(fQ));
  /* pendentes primeiro, da prioridade mais alta para a mais baixa;
     as concluídas vão para o fim, mantendo a sequência do roteiro */
  return l.slice().sort((a,b)=>
    (emAndamento(b)?1:0)-(emAndamento(a)?1:0) ||
    (feito(a)?1:0)-(feito(b)?1:0) || a.pr-b.pr || a.seq-b.seq);
}
const doDia=filtrados;
function vLista(){
  const l=doDia();
  if(!l.length)return '<div class="vazio">Nenhuma visita nesta seleção.</div>';
  return l.map(card).join('')+'<div style="height:6px"></div>';
}
/* rua e bairro em linhas separadas, sem repetir e sem deixar linha vazia
   quando o roteiro publicado não traz o logradouro */
function endereco(c){
  const bai=(BAIRROS[c.ba]||'').trim();
  const rua=(c.end||'').trim();
  if(!rua)return bai;
  if(bai&&rua.toUpperCase().indexOf(bai.toUpperCase())>=0)return rua;
  return bai?rua+'<br>'+bai:rua;
}

let mapa=null,camada=null;
function pintaMapa(){
  const el=$('mapa');if(!el)return;
  if(typeof L==='undefined'){
    el.outerHTML='<div class="vazio">O mapa precisa de internet na primeira vez.<br>'+
      'Volte para a lista pelo botão ao lado da busca.</div>';return}
  const l=doDia();if(!l.length){el.outerHTML='<div class="vazio">Nada para mostrar.</div>';return}
  if(mapa){mapa.remove();mapa=null}
  euMk=null;euAcc=null;
  mapa=L.map(el,{zoomControl:false}).setView([l[0].lat,l[0].lon],14);
  const Bts=L.Control.extend({options:{position:'topright'},onAdd(){
    const d=L.DomUtil.create('div','mapbts');
    d.innerHTML='<button id="monde" aria-label="Centralizar na minha posição">'+
      '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Onde estou</button>'+
      '<button id="mdia">Ver o dia</button>';
    L.DomEvent.disableClickPropagation(d);return d}});
  new Bts().addTo(mapa);
  L.control.zoom({position:'bottomright'}).addTo(mapa);
  L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
    {attribution:'Esri, HERE, Garmin',maxZoom:19}).addTo(mapa);
  camada=L.layerGroup().addTo(mapa);
  l.forEach(c=>{
    const v=reg(c);
    const cor=!v?'#1273DE':(['Encerrou as atividades','Endereço não localizado']
      .indexOf(v.existe)>=0?'#93131F':'#0B7A3B');
    L.marker([c.lat,c.lon],{icon:L.divIcon({className:'',iconSize:[30,30],iconAnchor:[15,15],
      html:'<div style="width:30px;height:30px;border-radius:50%;background:'+cor+
      ';border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.4);color:#fff;font-size:12px;'+
      'font-weight:700;display:flex;align-items:center;justify-content:center">'+c.seq+'</div>'})})
     .bindTooltip(c.seq+' · '+c.nome,{direction:'top'})
     .on('click',()=>abrir(c.cnpj)).addTo(camada);
  });
  const todos=L.latLngBounds(l.map(c=>[c.lat,c.lon])).pad(.15);
  /* volta ao enquadramento que o desenvolvedor deixou (mesmo dia); senão, o dia todo */
  if(VISTA&&VISTA.dia===fDia)mapa.setView(VISTA.c,VISTA.z,{animate:false});
  else mapa.fitBounds(todos);
  mapa.on('moveend',()=>{if(mapa)VISTA={dia:fDia,c:mapa.getCenter(),z:mapa.getZoom()}});
  $('monde').onclick=ondeEstou;
  $('mdia').onclick=()=>{VISTA=null;mapa.fitBounds(todos)};
  if(EU_POS&&Date.now()-EU_POS.t<120000)marcaEu(EU_POS);
  setTimeout(()=>mapa&&mapa.invalidateSize(),120);
}
let VISTA=null,EU_POS=null,euMk=null,euAcc=null;
function marcaEu(p){
  if(!mapa)return;
  const ll=[p.lat,p.lon];
  if(!euAcc)euAcc=L.circle(ll,{radius:p.acc||30,color:'#1A73E8',weight:1,fillColor:'#1A73E8',fillOpacity:.12,interactive:false}).addTo(mapa);
  else{euAcc.setLatLng(ll);euAcc.setRadius(p.acc||30)}
  if(!euMk)euMk=L.circleMarker(ll,{radius:8,color:'#fff',weight:3,fillColor:'#1A73E8',fillOpacity:1}).bindTooltip('Você está aqui').addTo(mapa);
  else euMk.setLatLng(ll);
}
function ondeEstou(){
  if(!navigator.geolocation)return toast('Este aparelho não informa a localização');
  const b=$('monde');if(b)b.classList.add('busca');
  navigator.geolocation.getCurrentPosition(p=>{
    if(b)b.classList.remove('busca');
    EU_POS={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()};
    if(!mapa)return;

    mapa.setView([EU_POS.lat,EU_POS.lon],Math.max(mapa.getZoom(),16));
  },e=>{if(b)b.classList.remove('busca');
    toast(e.code===1?'Libere a localização para o app nas configurações do celular':'Não consegui achar sua posição agora')},

const RAIO_PRESENCA_M=100;


/* Abrir um cliente cai primeiro no plano de visita: ali o desenvolvedor confere
   o endereço, toca em Iniciar, o app pega a localização e só então libera o
   formulário. Assim a coordenada é do momento da chegada, não do fim. */
function abrir(cnpj){
  cur=BASE.filter(c=>c.cnpj===cnpj)[0];
  if(!cur)return toast('Cliente não encontrado');
  tmp=reg(cur)?JSON.parse(JSON.stringify(reg(cur))):null;
  /* se esta visita já foi iniciada, o cronômetro continua de onde parou */
  const a=S.andamento;
  VISITA=(a&&a.cnpj===cnpj)
    ? {inicio:a.inicio,gps:a.gps,erroGps:a.erroGps||'',buscando:false,hora:a.hora}
    : {inicio:null,gps:null,erroGps:'',buscando:false};
  tela('plano');
}
function abreFormulario(){
  /* retoma exatamente onde parou: o rascunho tem prioridade sobre o registro salvo */
  const rasc=(S.andamento&&S.andamento.cnpj===cur.cnpj)?S.andamento.rascunho:null;
  tmp=rasc
    ? JSON.parse(JSON.stringify(rasc))
    : (reg(cur)?JSON.parse(JSON.stringify(reg(cur)))
      :{existe:'',dias:[],abre:'',fecha:'',nome:cur.nome,tel:cur.tel,canal:'',fornec:[],
        cadBand:'',vende:'',interesse:'',sac:'',sacProt:'',obs:'',gps:null});
  /* traz de volta a foto guardada, seja de um rascunho ou de uma visita salva */
  if(!tmp.foto)tmp.foto=leFoto(cur.cnpj)||null;
  if(tmp.foto&&!tmp.fotoHora)tmp.fotoHora=tmp.fotoHora||'';
  /* registro que voltou da planilha chega com os campos em outro formato */
  if(!Array.isArray(tmp.dias))
    tmp.dias=String(tmp.dias||'').split(',').filter(String).map(Number);
  if(!Array.isArray(tmp.fornec))
    tmp.fornec=tmp.fornec?String(tmp.fornec).split(';').map(x=>x.trim()).filter(Boolean):[];
  ['existe','abre','fecha','nome','tel','canal','cadBand','vende','interesse','sac',
   'sacProt','obs'].forEach(k=>{if(tmp[k]==null)tmp[k]=''});
  tmp.gps=coordOk(tmp.gps);
  /* a coordenada da chegada já vem do plano de visita */
  if(VISITA.gps&&!tmp.gps)tmp.gps=VISITA.gps;
  if(VISITA.inicio)tmp.inicioEm=VISITA.inicio;
  tela('form');
}

function setMotivo(t){
  const el=$('cobs'); if(el)CANC.obs=el.value;

/* Escolhe o próximo dia do roteiro cujo grupo de clientes está mais perto
   deste ponto, para a revisita não obrigar um deslocamento extra. */
function proximoDiaPerto(c){
  const m=minha(),hj=fDia||1;
  const dias={};
  m.forEach(x=>{
    if(x.dia<=hj||x.cnpj===c.cnpj)return;
    if(feito(x))return;
    (dias[x.dia]=dias[x.dia]||[]).push(x);
  });
  let melhor=null;
  Object.keys(dias).forEach(d=>{
    const l=dias[d];
    const la=l.reduce((a,x)=>a+x.lat,0)/l.length;
    const lo=l.reduce((a,x)=>a+x.lon,0)/l.length;
    const km=hav(c.lat,c.lon,la,lo);
    if(!melhor||km<melhor.km)melhor={dia:+d,km};
  });
  return melhor;
}

function confirmaCancelamento(){

  if(!CANC.motivo)return toast('Escolha o motivo do cancelamento');
  const t=agora(),c=cur;
  const g=CANC.gps;
  const gc=coordOk(g);
  const dist=gc?+hav(c.lat,c.lon,gc.lat,gc.lon).toFixed(3):null;
  const perto=esteveNoLocal();
  const prox=proximoDiaPerto(c);
  const reg={
    existe:'Visita cancelada',
    motivo:CANC.motivo, obs:CANC.obs||'',
    esteveNoLocal:perto?'Sim':'Não',
    cancelada:true,
    nome:c.nome, tel:c.tel,
    dias:[], abre:'', fecha:'', canal:'', cadBand:'', vende:'', fornec:'',
    interesse:'', sac:'', sacProt:'',
    data:t.data, hora:t.hora, iso:t.iso, dow:t.dow, dev:meuNome(),
    rota:ROTAS[c.rt], sv:SVS[c.sv], diaRoteiro:c.dia,
    dataPlan:dataDo(c.dia), dowPlan:dowDo(c.dia),
    noPrazo:t.data.slice(0,5)===dataDo(c.dia),
    latRef:c.lat, lonRef:c.lon, gps:g||null, dist,
    inicioHora:(S.andamento&&S.andamento.cnpj===c.cnpj)?S.andamento.hora:'',
    duracaoSeg:(S.andamento&&S.andamento.cnpj===c.cnpj&&S.andamento.inicio)
      ? Math.round((Date.now()-S.andamento.inicio)/1000):null,
    reagendadoPara:prox?prox.dia:null,
    enviado:false
  };
  S.vis[c.cnpj]=reg;
  /* o cliente volta para o dia mais próximo do trajeto futuro */
  if(prox){
    S.reagendados=S.reagendados||{};
    S.reagendados[c.cnpj]=prox.dia;
    if(S.vis[c.cnpj]){S.vis[c.cnpj].reagendada=true;S.vis[c.cnpj].diaOriginal=c.dia}
    /* aplica na hora, senão o dia novo só muda ao reabrir o app */
    aplicaReagendados();
    aplicaReagendados();
  }
  if(S.andamento&&S.andamento.cnpj===c.cnpj)S.andamento=null;
  save();
  ultimo=c.cnpj;
  anota('aviso','Visita cancelada',c.nome+' — '+CANC.motivo+
    (prox?'. Volta no dia '+prox.dia+', '+dowDo(prox.dia)+' '+dataDo(prox.dia)+'.':''));
  tela('ok');
  enviar(true);
}

/* Reagendamento é uma marca por cliente, guardada no aparelho, aplicada sobre
   o roteiro. Assim ela sobrevive a receber um roteiro novo do painel. */
function aplicaReagendados(){
  const r=S.reagendados||{};
  if(!Object.keys(r).length)return;
  /* A data de cada dia vem de um cliente daquele dia. Um remarcado carrega a
     data do dia de origem, e a tira passava a mostrar a mesma data duas vezes.
     Guardamos a data verdadeira de cada dia antes de mover ninguém. */
  const dataDoDia={};
  BASE.forEach(c=>{ if(!r[c.cnpj]&&c.dataPlan&&dataDoDia[c.dia]===undefined)
    dataDoDia[c.dia]=c.dataPlan });
  BASE.forEach(c=>{
    const novo=r[c.cnpj];
    if(!novo)return;
    c.dia=novo;
    if(dataDoDia[novo])c.dataPlan=dataDoDia[novo];
  });
  _amostraDia={};          /* a amostra por dia precisa ser recalculada */
}

function decorridoAndamento(){
  if(!S.andamento||!S.andamento.inicio)return '';
  const s=Math.max(0,Math.floor((Date.now()-S.andamento.inicio)/1000));
  const h=Math.floor(s/3600);
  return (h?h+'h ':'')+p2(Math.floor(s%3600/60))+':'+p2(s%60);
}

const mmss=s=>{const t=Math.max(0,Math.round(s));
  const h=Math.floor(t/3600);
  return (h?h+':'+p2(Math.floor(t%3600/60)):p2(Math.floor(t/60)))+':'+p2(t%60)};
/* Visita em andamento: conta para cima. Visita já registrada: mostra o tempo
   que ela levou. Antes ficava 00:00 nos dois casos. */
function cronometro(){
  if(VISITA.inicio)return mmss((Date.now()-VISITA.inicio)/1000);
  const v=cur?reg(cur):null;
  if(v){
    if(v.duracaoSeg!=null)return mmss(v.duracaoSeg);
    if(v.duracaoMin!=null)return mmss(v.duracaoMin*60);
    if(v.inicioHora&&v.hora){
      const m=x=>{const p=String(x).split(':');return (+p[0])*60+(+p[1])};
      const d=m(v.hora)-m(v.inicioHora);
      if(d>0)return mmss(d*60);
    }
    /* registro antigo, de antes de o app medir a duração */
    return '—';
  }
  return '00:00';
}
let cronT=null;
function ligaCronometro(){
  clearInterval(cronT);
  if(!VISITA.inicio)return;      /* valor fixo: nada a atualizar */
  const el=$('pvcron'); if(el)el.textContent=cronometro();
  if(!VISITA.inicio)return;
  cronT=setInterval(()=>{const el=$('pvcron');
    if(!el){clearInterval(cronT);return}
    el.textContent=cronometro()},1000);
}

function iniciaVisita(){
  if(!navigator.geolocation){
    VISITA.erroGps='Este aparelho não informa a localização.';
    VISITA.inicio=Date.now();marcaAndamento();render();return;
  }
  VISITA.buscando=true;VISITA.erroGps='';render();
  navigator.geolocation.getCurrentPosition(p=>{
    const t=agora();
    VISITA.gps={lat:+p.coords.latitude.toFixed(6),lon:+p.coords.longitude.toFixed(6),
      acc:Math.round(p.coords.accuracy||0)};
    VISITA.hora=t.hora;VISITA.inicio=Date.now();VISITA.buscando=false;
    marcaAndamento();
    render();
  },e=>{
    VISITA.buscando=false;
    VISITA.erroGps=(e&&e.code===1)
      ? 'Permissão de localização negada. Libere o acesso ao GPS para este site.'
      : 'Não consegui obter o sinal do GPS agora.';
    VISITA.inicio=Date.now();
    marcaAndamento();
    render();
  },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}

function setCampo(k,v){
  colhe();

function setEx(i){

  if(!EXISTE[i].ativo){tmp.dias=[];tmp.abre='';tmp.fecha='';tmp.canal='';tmp.vende='';
    tmp.fornec=[];tmp.interesse='';tmp.cadBand='';tmp.sac='';tmp.sacProt=''}
  /* já é cliente por outro documento: não há o que perguntar, só foto e observação */
  if(EXISTE[i].jaCliente)tmp.cadBand='Tem cadastro em outro CNPJ ou CPF';
  guardaRascunho();render();

function togFornec(f){
  colhe();
  if(!Array.isArray(tmp.fornec))tmp.fornec=tmp.fornec?[tmp.fornec]:[];
  const i=tmp.fornec.indexOf(f);
  if(i>=0)tmp.fornec.splice(i,1); else tmp.fornec.push(f);
  /* "ainda não compra bebidas" não convive com um fornecedor */
  const nenhum='Ainda não compra bebidas';
  if(f===nenhum&&tmp.fornec.indexOf(nenhum)>=0)tmp.fornec=[nenhum];
  else if(tmp.fornec.length>1)tmp.fornec=tmp.fornec.filter(x=>x!==nenhum);
  guardaRascunho();render();
}
function togDia(i){
  colhe();
  const k=tmp.dias.indexOf(i);
  if(k>=0)tmp.dias.splice(k,1); else tmp.dias.push(i);
  guardaRascunho();render();
}
/* Tudo que o desenvolvedor já respondeu fica guardado no aparelho enquanto a
   visita está em andamento. Assim ele pode sair para outro módulo e voltar. */
function guardaRascunho(){
  if(!cur||!tmp)return;
  if(!S.andamento||S.andamento.cnpj!==cur.cnpj)return;
  const r=Object.assign({},tmp);
  /* a foto é grande e tem armazenamento próprio; o rascunho guarda só a marca */
  if(r.foto){guardaFoto(cur.cnpj,r.foto);r.temFoto=true}
  delete r.foto;
  S.andamento.rascunho=r;
  save();
}
function colhe(){
  const g=id=>{const e=$(id);return e?e.value:undefined};
  const p=[['abre','abre'],['fecha','fecha'],['fnome','nome'],['ftel','tel'],
           ['fcanal','canal'],['fforn','fornec'],['fsacprot','sacProt'],['fobs','obs']];
  p.forEach(([id,k])=>{const v=g(id);if(v!==undefined)tmp[k]=v});
  guardaRascunho();
}
/* A foto tem que ser tirada na hora, pelo app. O atributo capture faz o celular
   abrir a câmera direto, mas alguns navegadores ignoram e abrem a galeria — por isso
   também conferimos a data do arquivo e recusamos imagem antiga. */
const FOTO_MAX_MIN=15;
/* A observação é guardada enquanto se digita, sem remontar a tela, para o texto
   não se perder nem o cursor sair do lugar. */
function ligaObs(){
  const el=$('fobs'); if(!el)return;
  let t;
  el.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{
    if(tmp){tmp.obs=el.value;guardaRascunho()}
  },400)};
  el.onblur=()=>{if(tmp){tmp.obs=el.value;guardaRascunho()}};
}
function ligaFoto(){
  const el=$('ffoto'); if(!el)return;
  el.onchange=ev=>{
    const f=(ev.target.files||[])[0]; ev.target.value='';
    if(!f)return;
    if(!/^image\//.test(f.type))return toast('Selecione uma imagem');
    const idade=(Date.now()-(f.lastModified||0))/60000;
    if(isFinite(idade)&&idade>FOTO_MAX_MIN)
      return toast('Essa foto não é de agora. Tire uma nova pela câmera.');
    toast('Preparando a foto…');
    const fr=new FileReader();
    fr.onload=()=>comprime(fr.result,f);
    fr.onerror=()=>toast('Não consegui ler a foto');
    fr.readAsDataURL(f);
  };
}
function comprime(dataUrl,arq){
  const img=new Image();
  img.onload=()=>{
    const lado=900;
    const esc=Math.min(1,lado/Math.max(img.width,img.height));
    const c=document.createElement('canvas');
    c.width=Math.round(img.width*esc);c.height=Math.round(img.height*esc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    let out=c.toDataURL('image/jpeg',0.55);
    /* se ainda ficar grande, aperta mais: o aparelho guarda tudo localmente */
    if(out.length>320000)out=c.toDataURL('image/jpeg',0.4);
    const t=agora();
    tmp.foto=out;tmp.fotoHora=t.hora;tmp.fotoIso=t.iso;
    tmp.fotoKB=Math.round(out.length/1365);
    tmp.fotoGps=tmp.gps?{lat:tmp.gps.lat,lon:tmp.gps.lon}:null;
    colhe();render();
    toast('Foto registrada · '+tmp.fotoKB+' KB');
  };
  img.onerror=()=>toast('Imagem inválida');
  img.src=dataUrl;
}
function marcar(){
  if(!navigator.geolocation)return toast('Aparelho sem GPS');
  toast('Buscando o sinal…');
  navigator.geolocation.getCurrentPosition(p=>{
    tmp.gps={lat:+p.coords.latitude.toFixed(6),lon:+p.coords.longitude.toFixed(6),
      acc:Math.round(p.coords.accuracy||0)};
    colhe();render();toast('Posição marcada');},
   e=>toast(e&&e.code===1?'Permissão de localização negada':'Sinal indisponível'),
   {enableHighAccuracy:true,timeout:12000,maximumAge:0});
}
function salvar(){
  colhe();
  if(!tmp.existe)return toast('Responda se o estabelecimento existe');
  const ex=EXISTE.filter(e=>e.t===tmp.existe)[0];
  if(ex.ativo){
    if(!tmp.dias.length)return toast('Marque os dias de atendimento');
    if(!tmp.abre||!tmp.fecha)return toast('Informe o horário de abertura e fechamento');
    if(!tmp.canal)return toast('Informe o canal do PDV');
    if(!tmp.cadBand)return toast('Responda se já tem cadastro na BAND');
    if(!tmp.vende)return toast('Informe se vende bebidas');
    if(tmp.vende==='Sim, vende'&&(!tmp.fornec||!tmp.fornec.length))
      return toast('Marque de quem ele compra hoje');
    if(!tmp.interesse)return toast('Informe o interesse em se cadastrar');
    if(!tmp.sac)return toast('Responda se passou as informações para o SAC');
  }
  /* a foto fica por último, na mesma ordem em que o formulário é preenchido */
  if(!tmp.foto&&!tmp.fotoCaminho)return toast('Tire a foto do local antes de salvar');
  const t=agora();
  const fim=()=>{
    /* a planilha guarda como texto separado por ponto e vírgula */
    if(Array.isArray(tmp.fornec))tmp.fornec=tmp.fornec.join('; ');
    Object.assign(tmp,{data:t.data,hora:t.hora,iso:t.iso,dow:t.dow,dev:meuNome(),
      rota:ROTAS[cur.rt],sv:SVS[cur.sv],diaRoteiro:cur.dia,
      dataPlan:dataDo(cur.dia),dowPlan:dowDo(cur.dia),
      noPrazo:t.data.slice(0,5)===dataDo(cur.dia),
      latRef:cur.lat,lonRef:cur.lon,
      email:S.email||'',
      dist:coordOk(tmp.gps)
        ?+hav(cur.lat,cur.lon,coordOk(tmp.gps).lat,coordOk(tmp.gps).lon).toFixed(3):null,
      /* quanto tempo a visita levou, do Iniciar até o Salvar */
      inicioHora:(S.andamento&&S.andamento.cnpj===cur.cnpj)?S.andamento.hora:'',
      duracaoMin:(S.andamento&&S.andamento.cnpj===cur.cnpj&&S.andamento.inicio)
        ? Math.max(1,Math.round((Date.now()-S.andamento.inicio)/60000)) : null,
      duracaoSeg:(S.andamento&&S.andamento.cnpj===cur.cnpj&&S.andamento.inicio)
        ? Math.round((Date.now()-S.andamento.inicio)/1000) : null,
      enviado:false});
    delete tmp.recusada;
    if(S.andamento&&S.andamento.cnpj===cur.cnpj)S.andamento=null;
    /* a imagem fica numa chave separada: o registro da visita continua leve */
    const foto=tmp.foto; delete tmp.foto;
    /* foto nova: sobe de novo; refazendo sem tirar outra, vale a que já subiu */
    const fotoNova=!!foto&&foto!==leFoto(cur.cnpj)||!!foto&&!tmp.fotoEnviada;
    if(fotoNova){delete tmp.fotoCaminho;tmp.fotoEnviada=false;delete tmp.fotoCaminhoPrevisto}
    tmp.temFoto=!!foto||!!tmp.fotoCaminho;
    S.vis[cur.cnpj]=tmp;
    if(foto)guardaFoto(cur.cnpj,foto);
    save();ultimo=cur.cnpj;tela('ok');
    /* a visita primeiro, a foto depois: as duas gravam na mesma linha da planilha
       e se saírem juntas podem se atropelar */
    enviar(true);
    if(foto&&fotoNova){const cn=cur.cnpj;enviaFoto(cn,foto,(ok,msg)=>{
      if(!ok)toast('Foto na fila: '+msg);
      if(tela_==='ok')render();
    })}
  };
  if(tmp.gps)return fim();
  if(!navigator.geolocation){tmp.gpsErro='Aparelho sem GPS';return fim()}
  toast('Marcando a localização…');
  navigator.geolocation.getCurrentPosition(p=>{
    tmp.gps={lat:+p.coords.latitude.toFixed(6),lon:+p.coords.longitude.toFixed(6),
      acc:Math.round(p.coords.accuracy||0)};fim();},
   e=>{tmp.gps=null;tmp.gpsErro=(e&&e.code===1)?'Permissão negada':'Sinal indisponível';fim()},
   {enableHighAccuracy:true,timeout:12000,maximumAge:0});
}
function guardaFoto(cnpj,dataUrl){
  try{localStorage.setItem('rtm_foto_'+cnpj,dataUrl)}
  catch(e){toast('Sem espaço para guardar a foto no aparelho')}
}
function leFoto(cnpj){try{return localStorage.getItem('rtm_foto_'+cnpj)}catch(e){return null}}
/* A foto sobe para a pasta privada rtm-fotos, em visitas/<login>/. O nome é
   fixo por foto: reenviar a mesma foto não cria cópia. Quando o servidor
   confirma, a visita é reenviada com o caminho da foto e a cópia do aparelho
   é apagada (antes elas se acumulavam até lotar o armazenamento). */
function caminhoFoto(cnpj,v){
  const st=String((v&&v.fotoIso)||new Date().toISOString()).replace(/[^0-9]/g,'').slice(0,14);
  return 'visitas/'+S.login+'/'+String(cnpj).replace(/[^0-9A-Za-z]/g,'')+'_'+st+'.jpg';
}
function enviaFoto(cnpj,dataUrl,aoTerminar){
  const fim=(ok,m)=>{if(aoTerminar)aoTerminar(ok,m);else if(!ok)toast('Foto não subiu: '+m)};
  if(!SESSAO||!S.login)return fim(false,'entre com a senha');
  if(!navigator.onLine)return fim(false,'sem conexão');
  const v0=S.vis[cnpj];
  const cam=(v0&&v0.fotoCaminhoPrevisto)||caminhoFoto(cnpj,v0);
  if(v0){v0.fotoCaminhoPrevisto=cam;save()}
  fetch(dataUrl).then(r=>r.blob())
   .then(b=>sobeArquivo(cam,b,'image/jpeg'))
   .then(()=>{
     const v=S.vis[cnpj];
     if(v){v.fotoEnviada=true;v.fotoCaminho=cam;v.enviado=false;delete v.fotoCaminhoPrevisto;
       delete v.recusada;save();
       try{localStorage.removeItem('rtm_foto_'+cnpj)}catch(e){}
       enviar(true)}
     fim(true,cam);
   })
   .catch(e=>{if(e.semSessao)sessaoPerdida();fim(false,e.message||'falhou')});
}

function duracaoTexto(v){
  const s=v.duracaoSeg;

  if(m==null)return '—';
  if(m<60)return m+' min';
  return Math.floor(m/60)+'h '+p2(m%60);
}

const PERTO={modo:'lista',raio:0,seg:'',q:''};

function rumo(la1,lo1,la2,lo2){
  const r=Math.PI/180,y=Math.sin((lo2-lo1)*r)*Math.cos(la2*r),
    x=Math.cos(la1*r)*Math.sin(la2*r)-Math.sin(la1*r)*Math.cos(la2*r)*Math.cos((lo2-lo1)*r);
  return (Math.atan2(y,x)/r+360)%360;
}
function kmAte(la1,lo1,la2,lo2){
  const dy=(la2-la1)*111.32;
  const dx=(lo2-lo1)*111.32*Math.cos((la1+la2)/2*Math.PI/180);
  return Math.sqrt(dy*dy+dx*dx);
}
const PONTOS=['N','NE','L','SE','S','SO','O','NO'];
function tempoAte(km){const m=km*1000*1.3;
  return m<=2500?'~'+Math.max(1,Math.round(m/70))+' min a pé':'~'+Math.max(1,Math.round(m/450))+' min de carro'}
function listaPerto(){
  let l=vizinhosDoDia().slice(),dia=fDia,outro=false;
  if(!l.length){
    const outros=Object.keys(VIZ||{}).filter(k=>k.indexOf(S.dev+'|')===0)
      .map(k=>+k.split('|')[1]).sort((a,b)=>Math.abs(a-fDia)-Math.abs(b-fDia));
    if(outros.length){dia=outros[0];l=(VIZ[S.dev+'|'+dia]||[]).slice();outro=true}
  }
  l.forEach(c=>{c.dGps=GPSPERTO?kmAte(GPSPERTO.lat,GPSPERTO.lon,c.lat,c.lon):null;
    c.rumo=GPSPERTO?rumo(GPSPERTO.lat,GPSPERTO.lon,c.lat,c.lon):null});
  l.sort((a,b)=>GPSPERTO?(a.dGps-b.dGps):(a.km-b.km));
  return {l,dia,outro};
}
function filtraPerto(l){
  const q=PERTO.q.trim().toLowerCase();
  return l.filter(c=>{
    if(PERTO.raio&&GPSPERTO&&c.dGps>PERTO.raio)return false;
    if(PERTO.seg&&(c.segmento||'Sem segmento')!==PERTO.seg)return false;
    if(q&&!((c.nome||'')+' '+c.cod+' '+(c.bairro||'')).toLowerCase().includes(q))return false;
    return true;

function pintaMapaPerto(focoCod){
  const el=$('mapaperto');if(!el)return;
  if(typeof L==='undefined'){el.outerHTML='<div class="vazio">O mapa precisa de internet na primeira vez.</div>';return}
  const {l}=listaPerto(),f=filtraPerto(l);
  const vista=mapaPerto&&mapaPerto._rtmVista;
  if(mapaPerto){try{mapaPerto.remove()}catch(e){}mapaPerto=null}
  ptMk=null;ptAcc=null;
  mapaPerto=L.map(el,{zoomControl:false});
  L.control.zoom({position:'bottomleft'}).addTo(mapaPerto);
  L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
    {attribution:'Esri, HERE, Garmin',maxZoom:19}).addTo(mapaPerto);
  /* os clientes do roteiro do dia, pequenos, para dar referência */
  doDia().forEach(c=>L.circleMarker([c.lat,c.lon],{radius:4,color:'#fff',weight:1,fillColor:'#C8102E',fillOpacity:.8,interactive:false}).addTo(mapaPerto));
  const pts=[];
  f.forEach(c=>{pts.push([c.lat,c.lon]);
    L.marker([c.lat,c.lon],{icon:L.divIcon({className:'',iconSize:[30,38],iconAnchor:[15,37],
      html:'<div class="ppin">'+svg('loja',2)+'</div>'})})
     .on('click',()=>mostraCartaoPerto(c)).addTo(mapaPerto);
  });
  if(GPSPERTO){pts.push([GPSPERTO.lat,GPSPERTO.lon]);marcaPerto()}
  if(vista)mapaPerto.setView(vista.c,vista.z,{animate:false});
  else if(pts.length)mapaPerto.fitBounds(L.latLngBounds(pts).pad(.12),{maxZoom:17});
  mapaPerto.on('moveend',()=>{if(mapaPerto)mapaPerto._rtmVista={c:mapaPerto.getCenter(),z:mapaPerto.getZoom()};VISTA_PERTO=mapaPerto._rtmVista});
  if(!vista&&VISTA_PERTO)mapaPerto.setView(VISTA_PERTO.c,VISTA_PERTO.z,{animate:false});
  if(focoCod){const c=f.find(x=>String(x.cod)===String(focoCod));if(c){mapaPerto.setView([c.lat,c.lon],17);mostraCartaoPerto(c)}}
  setTimeout(()=>mapaPerto&&mapaPerto.invalidateSize(),120);
}

    const iso=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
    const hj=iso(hoje);
    const ontem=new Date(hoje.getTime()-86400000);
    if(FEITAS.data==='hoje')l=l.filter(v=>isoDaVisita(v)===hj);
    else if(FEITAS.data==='ontem')l=l.filter(v=>isoDaVisita(v)===iso(ontem));
    else if(FEITAS.data==='semana'){
      const lim=iso(new Date(hoje.getTime()-6*86400000));
      l=l.filter(v=>isoDaVisita(v)>=lim);
    } else if(FEITAS.data.indexOf('-')>0)l=l.filter(v=>isoDaVisita(v)===FEITAS.data);
  }
  return l;
}
function ligaBuscaFeitas(){
  const el=$('qfeitas'); if(!el)return;
  let t; el.oninput=e=>{clearTimeout(t);t=setTimeout(()=>{
    FEITAS.q=e.target.value.trim();
    $('app').innerHTML=vFeitas();ligaBuscaFeitas();
    const n=$('qfeitas'); if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}
  },260)};
}
function folhaData(){
  const l=FEITAS.lista||[];
  const conta=f=>l.filter(f).length;
  const hoje=new Date(), z=n=>('0'+n).slice(-2);
  const iso=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
  const hj=iso(hoje), on=iso(new Date(hoje.getTime()-86400000));
  const lim=iso(new Date(hoje.getTime()-6*86400000));
  const op=[
    ['todas','Todas as datas',l.length],
    ['hoje','Hoje',conta(v=>isoDaVisita(v)===hj)],
    ['ontem','Ontem',conta(v=>isoDaVisita(v)===on)],
    ['semana','Últimos 7 dias',conta(v=>isoDaVisita(v)>=lim)]];
  abreFolha('Data da visita',
    '<div class="fl">Período</div>'+
    op.map(([k,t,n])=>'<button class="opt'+(FEITAS.data===k?' on':'')+'" '+
      'onclick="setFeitas(\'data\',\''+k+'\')"><span class="d"></span>'+
      '<span style="flex:1">'+t+'<br><span style="font-size:12px;color:var(--ink2);'+
      'font-weight:400">'+n+' visita(s)</span></span></button>').join('')+
    '<div class="fl">Ou um dia específico</div>'+
    '<input class="tx" type="date" id="fdatadia" value="'+
      (FEITAS.data.indexOf('-')>0?esc(FEITAS.data):'')+'" '+
      'onchange="setFeitas(\'data\',this.value)">',
    'Ver as visitas');
}
function folhaSitFeitas(){
  const l=FEITAS.lista||[];
  const sits=[...new Set(l.map(v=>v.existe).filter(Boolean))];
  const bt=(k,t,n)=>'<button class="opt'+(FEITAS.sit===k?' on':'')+'" '+
    'onclick="setFeitas(\'sit\','+JSON.stringify(k).replace(/"/g,'&quot;')+')">'+
    '<span class="d"></span><span style="flex:1">'+esc(t)+
    '<br><span style="font-size:12px;color:var(--ink2);font-weight:400">'+n+

}
function setFeitas(campo,valor){
  FEITAS[campo]=valor;
  /* fecharFolha já redesenha a tela */
  fecharFolha();
}
function abreFeita(i){
  FEITA=filtraFeitas()[i]||null;
  VOLTA_FEITA='feitas';
  if(FEITA)tela('feita');
}
