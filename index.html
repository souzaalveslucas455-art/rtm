function vResultados(){
  /* Conta o que está no aparelho mais o que a planilha já tem deste
     desenvolvedor. Sem isso, um celular novo mostrava tudo zerado mesmo
     com o trabalho registrado. */
  if(FEITAS.lista===null&&!FEITAS.carregando){
    FEITAS.carregando=true;
    setTimeout(()=>buscaFeitas(true),0);
  }
  const reg2={};
  Object.keys(S.vis||{}).forEach(k=>reg2[k]=S.vis[k]);
  (FEITAS.lista||[]).forEach(v=>{const k=String(v.cnpj);
    if(!reg2[k])reg2[k]=v});
  const m=minha();
  const naCarteira={};m.forEach(c2=>naCarteira[String(c2.cnpj)]=1);
  const meus=Object.keys(reg2).filter(k=>naCarteira[k]||reg2[k].daBase)
    .map(k=>({cnpj:k}));
  const V=x=>reg2[x.cnpj]||{};
  const c=t=>meus.filter(x=>V(x).existe===t).length;
  const existe=c('Sim, está funcionando');
  const morto=c('Encerrou as atividades')+c('Endereço não localizado');
  const quer=meus.filter(x=>V(x).interesse==='Quer se cadastrar agora').length;
  const vende=meus.filter(x=>V(x).vende==='Sim, vende').length;
  const gps=meus.filter(x=>V(x).gps).length;
  const comFoto=meus.filter(x=>V(x).temFoto).length;
  const canc=meus.filter(x=>V(x).cancelada).length;
  const cancNoLocal=meus.filter(x=>V(x).cancelada&&
    V(x).esteveNoLocal==='Sim').length;
  const fotoNaFila=meus.filter(x=>V(x).temFoto&&!V(x).fotoEnviada).length;
  const porDia={};meus.forEach(x=>{const d=V(x).dow;porDia[d]=(porDia[d]||0)+1});
  const porMes={};m.forEach(x=>{const k=mesDo(x.dia);
    if(!porMes[k])porMes[k]={pl:0,ok:0};porMes[k].pl++;if(feito(x))porMes[k].ok++});
  return '<h3 class="t">Indicadores</h3><p class="sub">'+esc(meuNome())+'</p>'+
   '<div class="kg">'+
   '<div class="k b"><b>'+fmt(meus.length)+'</b><span>visitas registradas</span>'+
     '<div class="prog"><i style="width:'+(m.length?100*meus.length/m.length:0)+'%"></i></div></div>'+
   '<div class="k g"><b>'+fmt(existe)+'</b><span>confirmados funcionando</span></div>'+
   '<div class="k r"><b>'+fmt(morto)+'</b><span>não existem mais</span></div>'+
   '<div class="k w"><b>'+fmt(quer)+'</b><span>querem cadastro agora</span></div>'+
   '<div class="k"><b>'+fmt(vende)+'</b><span>já vendem bebidas</span></div>'+
   '<div class="k"><b>'+fmt(gps)+'</b><span>com GPS capturado</span></div>'+
   (canc?'<div class="k w"><b>'+fmt(canc)+'</b><span>canceladas · '+cancNoLocal+
     ' com presença confirmada</span></div>':'')+
   '<div class="k'+(fotoNaFila?' w':'')+'"><b>'+fmt(comFoto)+'</b><span>com foto do local'+
     (fotoNaFila?' · '+fotoNaFila+' por enviar':'')+'</span></div>'+
   '<div class="k wide"><b>'+fmt(m.length-meus.length)+'</b><span>ainda por visitar na carteira'+
     '</span><div class="prog"><i style="width:'+(m.length?100*meus.length/m.length:0)+
     '%"></i></div></div></div>'+
   '<label class="f">Visitas por dia da semana</label>'+
   '<table class="tabela"><tbody>'+['Seg','Ter','Qua','Qui','Sex','Sáb']
     .map(d=>'<tr><td>'+d+'</td><td>'+(porDia[d]||0)+'</td></tr>').join('')+'</tbody></table>'+
   '<label class="f">Agenda por mês</label>'+
   '<table class="tabela"><thead><tr><th>Mês</th><th>Planejado</th><th>Feito</th></tr></thead><tbody>'+
     Object.keys(porMes).map(k=>'<tr><td>'+k+'</td><td style="text-align:right;font-weight:400">'+
       porMes[k].pl+'</td><td>'+porMes[k].ok+'</td></tr>').join('')+'</tbody></table>';
}
function vBase(){
  const fila=pendentes().length,env=Object.keys(S.vis).length-fila;
  const recus=Object.keys(S.vis).filter(k=>S.vis[k].recusada).length;
  const fotosFila=Object.keys(S.vis).filter(k=>S.vis[k].temFoto&&!S.vis[k].fotoEnviada).length;
  let h='';
  if(LOCAL||GUARDA!=='ok')h+='<div class="erro">'+
    (LOCAL?'<b>Este app foi aberto como arquivo do celular.</b><br>Assim o navegador não deixa '+
      'instalar na tela de início e pode não guardar as visitas. Peça ao gestor o endereço '+
      'que começa com <b>https://</b>.':'<b>O navegador está bloqueando o armazenamento.</b><br>'+
      'Saia da navegação anônima e libere os dados de site.')+'</div>';
  h+='<h3 class="t">Conta e envio</h3>'+
   '<p class="sub">Você entrou como <b>'+esc(meuNome())+'</b> ('+esc(S.email||S.login||'')+'). '+
   'Cada visita sobe sozinha quando há sinal; sem sinal, fica guardada neste aparelho.</p>'+
   (SESSAO?'':'<div class="aviso">Sua sessão expirou. Saia e entre de novo com a senha '+
     'para voltar a enviar.</div>')+
   '<div class="kg"><div class="k g"><b>'+fmt(env-recus)+'</b><span>já na base</span></div>'+
   '<div class="k '+(fila?'r':'')+'"><b>'+fmt(fila)+'</b><span>na fila do aparelho</span></div>'+
   (fotosFila?'<div class="k r"><b>'+fmt(fotosFila)+'</b><span>fotos na fila</span></div>':'')+
   (recus?'<div class="k r"><b>'+fmt(recus)+'</b><span>recusadas pelo servidor</span></div>':'')+
   '<div class="k wide"><b style="font-size:15px">'+esc(S.sync.ultimo||'nunca')+
     '</b><span>último envio</span></div></div>'+
   (fila?'<button class="cta g" onclick="enviar(false)">Enviar os '+fila+' pendentes</button>':'')+
   '<button class="cta o" onclick="reenviaFotos(false)">Reenviar fotos pendentes</button>'+
   '<button class="cta o" onclick="testaConexao()">Testar conexão</button>'+
   '<label class="f">Recuperar trabalho</label>'+
   '<div class="info">Se você trocou de celular ou limpou o navegador, as visitas já '+
     'enviadas continuam na base. Traga elas de volta.</div>'+
   '<button class="cta o" onclick="sincroniza(false,true)">Recuperar visitas da base</button>'+
   '<label class="f">Alertas no aparelho</label>'+
   '<div class="info">Libere os alertas para receber as mensagens da coordenação '+
     'com aviso e vibração.</div>'+
   '<button class="cta o" onclick="pedePermissaoAviso()">Liberar alertas</button>'+
   '<button class="cta o" onclick="reenviar()">Reenviar tudo</button>'+
   '<label class="f">Roteiro de campo</label>'+
   '<div class="'+(PLANO?'info':'aviso')+'">'+
     (PLANO?'Roteiro '+esc(PLANO.versao)+', recebido em <b>'+esc((PLANO.baixadoEm||'').slice(0,10)
        .split('-').reverse().join('/'))+'</b><br>'+fmt(minha().length)+' clientes seus · '+
        PLANO.porDia+' por dia · início '+esc((PLANO.inicio||'').split('-').reverse().join('/'))
      :'Nenhum roteiro recebido ainda. Ele chega ao sincronizar, depois que o coordenador publicar.')+
   '</div>'+
   '<button class="cta o" onclick="sincroniza(false)">Buscar agora</button>'+
   '<label class="f">Exportar em arquivo</label>'+
   '<button class="cta o" onclick="exportar(\'json\')">Baixar JSON</button>'+
   '<button class="cta o" onclick="exportar(\'csv\')">Baixar CSV</button>';
  return h;
}
function reenviar(){Object.keys(S.vis).forEach(k=>{delete S.vis[k].enviado;delete S.vis[k].recusada});save();enviar(false)}
function registros(){
  return Object.keys(S.vis).map(cnpj=>{
    const c=BASE.filter(x=>x.cnpj===cnpj)[0]||{},v=S.vis[cnpj];
    return Object.assign({cnpj,bairro:BAIRROS[c.ba],cidade:M.cidade,cep:c.cep,
      endereco:c.end,cnae:CNAES[c.cn],consultor:CONS[c.cons]},v);});
}
function baixar(nome,txt,tipo){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+txt],{type:tipo+';charset=utf-8'}));
  a.download=nome;a.click();
  setTimeout(()=>{try{URL.revokeObjectURL(a.href)}catch(e){}},4000);
}
function exportar(f){
  const r=registros();
  if(!r.length)return toast('Nenhuma visita registrada ainda');
  if(f==='json'){baixar('coleta-campo.json',JSON.stringify({origem:'Band Desenvolvedores',cidade:M.cidade,
    gerado:agora().iso,visitas:r}),'application/json');return toast(r.length+' visita(s)')}
  const cols=['cnpj','nome','existe','dias','abre','fecha','canal','vende','fornec','interesse',
    'tel','obs','dev','rota','sv','consultor','bairro','cep','endereco','cnae',
    'diaRoteiro','dataPlan','dowPlan','data','hora','dow','noPrazo','temFoto','fotoHora',
    'latRef','lonRef','gpsLat','gpsLon','gpsAcc','dist'];
  const linha=o=>cols.map(k=>{
    let v=k==='gpsLat'?(o.gps&&o.gps.lat):k==='gpsLon'?(o.gps&&o.gps.lon):
      k==='gpsAcc'?(o.gps&&o.gps.acc):k==='dias'?(o.dias||[]).map(i=>DIASSEM[i]).join(' '):o[k];
    return v==null?'':String(v).replace(/;/g,',').replace(/\n/g,' ')}).join(';');
  baixar('coleta-campo.csv',cols.join(';')+'\n'+r.map(linha).join('\n'),'text/csv');
  toast(r.length+' visita(s)');
}

/* ---------------- gaveta ---------------- */
/* O texto da gaveta precisa refletir o roteiro em uso, não o que veio embutido. */
function escopoAtual(){
  if(PLANO&&PLANO.escopo)return PLANO.escopo;
  if(PLANO){
    const c=[...new Set(minha().map(x=>typeof CIDADES!=='undefined'&&CIDADES?CIDADES[x.ci]:null).filter(Boolean))];
    if(c.length===1)return c[0];
    if(c.length>1)return c.length+' municípios';
  }
  return M.cidade;
}
function abrirGaveta(){
  empilha();
  const m=minha(),feitas=m.filter(feito).length;
  const item=(k,ic,t)=>'<button class="'+(tela_===k?'on':'')+'" onclick="irPara(\''+k+'\')">'+
    svg(ic)+t+'</button>';
  $('gavp').innerHTML=
   '<div class="cabeca">'+
     '<div class="quem"><div class="av">'+esc(String(S.login||'DC').toUpperCase())+'</div><div>'+
       '<b>'+esc(meuNome())+'</b><span>'+esc(escopoAtual())+' · '+
         fmt(m.length)+' clientes</span>'+
     '</div></div>'+
     '<button class="sinc" onclick="enviar(false)">'+svg('sinc',2)+'Sincronizar</button>'+
     '<div class="quando"><span>'+(S.sync.ultimo?'Enviado '+esc(S.sync.ultimo):'Nunca enviado')+
       '</span><b onclick="irPara(\'base\')" style="color:var(--red);flex:0 0 auto">Conta ›</b></div>'+
   '</div>'+
   '<div class="meio"><nav>'+
     item('visitas','alvo','Visitas')+
     item('feitas','conferido','Visitas feitas')+
     item('perto','rota','Na região de hoje'+
       (vizinhosDoDia().length?' · '+vizinhosDoDia().length:''))+
     item('clientes','loja','Clientes')+
     item('resultados','grafico','Indicadores')+'<hr>'+
     item('base','nuvem','Conta e envio')+'<hr>'+
     '<button class="sair" onclick="sair()">'+svg('sair')+'Sair</button>'+
   '</nav></div>'+
   '<div class="rodape">'+
     '<div class="ver">Versão '+VERSAO+'<br>'+feitas+' de '+fmt(m.length)+' visitados</div>'+
   '</div>';
  $('gav').classList.add('on');
}
function fecharGaveta(){$('gav').classList.remove('on')}
function irPara(k){fecharGaveta();tela(k)}
$('gavf').onclick=fecharGaveta;
$('folhaf').onclick=fecharFolha;

/* ---------------- instalação e início ---------------- */
/* O manifesto e os ícones agora são arquivos de verdade (manifest.json), o que o
   PWABuilder exige para gerar o APK. O sw.js guarda o app para abrir sem sinal. */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))
  navigator.serviceWorker.register('sw.js').catch(()=>{});
window.addEventListener('resize',()=>{if(mapa)mapa.invalidateSize()});
if(S.reagendados)aplicaReagendados();
abreEntrada();
empilha();empilha();
