<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Band Desenvolvedores</title>
<meta name="theme-color" content="#1F2023">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --verm:#E4002B; --verm-esc:#B80022; --verm-bg:#FDE7EC;
  --ink:#1A1D21; --ink2:#5B6270; --ink3:#9CA3AF; --linha:#E5E7EB; --papel:#FFF; --fundo:#F1F2F4;
  --lado:#1F2023; --lado2:#2B2C30; --lado-txt:#C9CBD1;
  --verde:#0F7A52; --verde-bg:#E6F4EE; --amb:#96620F; --amb-bg:#FDF2DC; --azul:#1E6FD9; --azul-bg:#E9F1FC;
  --teal:#2F7F86; --teal-bg:#DCEEF0; --roxo:#6D4BC4; --roxo-bg:#F0EBFB;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--fundo);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.esc{display:none!important}

/* ---------- entrada ---------- */
#entrada{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(360px,.9fr);background:var(--lado)}
#entrada .lado{position:relative;overflow:hidden;padding:56px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;
  background:radial-gradient(120% 90% at 0% 100%,#5a0a19 0%,rgba(90,10,25,0) 60%),linear-gradient(160deg,#1F2023 0%,#141518 100%)}
#entrada .lado .lg{width:46px;height:46px;border-radius:12px;background:var(--verm);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:17px}
#entrada .lado h1{font-size:46px;line-height:1.04;margin:0;letter-spacing:-.02em;max-width:12ch}
#entrada .lado h1 span{color:#ff5a6e}
#entrada .lado p{color:#b9bcc4;max-width:46ch;line-height:1.55;margin:18px 0 0}
#entrada .lado small{color:#7d818b}
#entrada .form{background:var(--papel);display:flex;flex-direction:column;justify-content:center;padding:56px}
#entrada .form h2{margin:0 0 6px;font-size:22px} #entrada .form .sub{color:var(--ink2);margin:0 0 26px}
#entrada label{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}
#entrada input{width:100%;border:1px solid var(--linha);border-radius:10px;padding:12px 13px;background:#fff}
#entrada .bt{width:100%;margin-top:22px;padding:12px}
#entrada .erro{background:var(--verm-bg);color:var(--verm-esc);border-radius:10px;padding:10px 12px;margin-bottom:6px;font-size:13px}
@media(max-width:820px){#entrada{grid-template-columns:1fr}#entrada .lado{display:none}}

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);height:100%}
aside{background:var(--lado);color:var(--lado-txt);display:flex;flex-direction:column;overflow-y:auto}
.marca{display:flex;gap:10px;align-items:center;padding:18px 16px;border-bottom:1px solid #303136}
.marca .lg{width:34px;height:34px;border-radius:9px;background:var(--verm);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.marca b{color:#fff;display:block;font-size:15px} .marca small{font-size:12px}
nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px}
nav .grupo{font-size:11px;color:#80838c;padding:12px 12px 4px;font-weight:600}
nav button{position:relative;display:flex;gap:11px;align-items:center;text-align:left;border:none;background:none;color:var(--lado-txt);padding:9px 12px;border-radius:9px;cursor:pointer;font-size:14px;line-height:1.25}
nav button:hover{background:var(--lado2)}
nav button[aria-current="page"]{background:var(--lado2);color:#fff;font-weight:600}
nav button[aria-current="page"]::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--verm)}
nav button.breve{opacity:.55}
nav button .tag{margin-left:auto;font-size:10.5px;border:1px solid #45474d;border-radius:8px;padding:0 6px;color:#9a9da5}
nav svg{flex:none;opacity:.85}
nav .n{margin-left:auto;background:var(--verm);color:#fff;font-size:11.5px;font-weight:700;border-radius:10px;padding:1px 7px}
.hoje{margin:auto 10px 12px;background:var(--verm);color:#fff;border-radius:14px;padding:14px}
.hoje .top{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.hoje .pill{background:rgba(255,255,255,.22);border-radius:12px;padding:2px 9px;font-weight:700}
.hoje h3{margin:8px 0 2px;font-size:14px;font-weight:600}
.hoje .big{font-size:30px;font-weight:800;line-height:1.05}
.hoje .big small{font-size:14px;font-weight:600;opacity:.9}
.hoje .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.hoje .mini div{background:rgba(0,0,0,.18);border-radius:9px;text-align:center;padding:7px 2px}
.hoje .mini b{display:block;font-size:17px} .hoje .mini span{font-size:11px;opacity:.9}
.quem{padding:10px 16px 16px;font-size:12px;color:#8d9099;display:flex;justify-content:space-between;gap:8px}
.quem button{background:none;border:none;color:#cfd1d6;cursor:pointer;padding:0;text-decoration:underline}

main{overflow-y:auto;min-width:0}
.cab{background:var(--papel);border-bottom:1px solid var(--linha);padding:16px 26px;display:flex;gap:16px;align-items:flex-start;position:sticky;top:0;z-index:5}
.cab h1{margin:0;font-size:19px} .cab p{margin:3px 0 0;color:var(--ink2);font-size:13px}
.cab .acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.bt{border:1px solid var(--linha);background:var(--papel);border-radius:9px;padding:8px 13px;font-weight:600;cursor:pointer;white-space:nowrap}
.bt.escuro{background:var(--ink);color:#fff;border-color:var(--ink)}
.bt.verm{background:var(--verm);color:#fff;border-color:var(--verm)}
.bt.peq{padding:5px 10px;font-size:13px}
.bt:disabled{opacity:.5;cursor:default}
.corpo{padding:22px 26px 40px;display:flex;flex-direction:column;gap:18px}

/* filtros */
.filtros{background:var(--papel);border-bottom:1px solid var(--linha);padding:12px 26px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.filtros label{display:flex;flex-direction:column;gap:5px;font-size:11.5px;font-weight:700;color:var(--ink2)}
.filtros select,.filtros input{border:1px solid var(--linha);border-radius:9px;padding:7px 10px;background:#fff;font-weight:500;color:var(--ink);min-width:150px}
.filtros input[type=search]{min-width:240px}

/* cartoes e numeros */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--papel);border:1px solid var(--linha);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font-size:26px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi span{color:var(--ink2);font-size:12.5px}
.kpi.v b{color:var(--verm)} .kpi.g b{color:var(--verde)} .kpi.a b{color:var(--azul)}
.cartao{background:var(--papel);border:1px solid var(--linha);border-radius:14px}
.cartao>.tt{padding:14px 18px;border-bottom:1px solid var(--linha);display:flex;gap:10px;align-items:center}
.cartao>.tt h2{margin:0;font-size:15px} .cartao>.tt span{color:var(--ink2);font-size:12.5px}
.cartao>.tt .acoes{margin-left:auto;display:flex;gap:8px}
.cartao>.cc{padding:16px 18px}
.vazio{color:var(--ink2);text-align:center;padding:36px 16px}
.aviso{background:var(--amb-bg);color:var(--amb);border-radius:10px;padding:10px 12px;font-size:13px}
.info{background:var(--azul-bg);color:#174f99;border-radius:10px;padding:10px 12px;font-size:13px}
.ok{background:var(--verde-bg);color:var(--verde);border-radius:10px;padding:10px 12px;font-size:13px}

/* tabela */
.tab{width:100%;border-collapse:collapse;font-size:13.5px}
.tab th{text-align:left;font-size:11.5px;color:var(--ink2);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--linha);background:#FAFAFB;position:sticky;top:0}
.tab td{padding:10px 12px;border-bottom:1px solid #F0F1F3;vertical-align:middle}
.tab tr.clic{cursor:pointer} .tab tr.clic:hover td{background:#FAFAFB}
.tab .num{text-align:right;font-variant-numeric:tabular-nums}
.tab small{color:var(--ink2);display:block}
.rolagem{overflow:auto;max-height:calc(100vh - 330px)}
.selo{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.selo.v{background:var(--verde-bg);color:var(--verde)} .selo.a{background:var(--amb-bg);color:var(--amb)}
.selo.r{background:var(--verm-bg);color:var(--verm-esc)} .selo.c{background:#EEF0F3;color:var(--ink2)} .selo.b{background:var(--azul-bg);color:var(--azul)}

/* desenvolvedores */
.devs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.dev{background:var(--papel);border:1px solid var(--linha);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.dev .top{display:flex;gap:12px;align-items:center}
.dev .av{width:46px;height:46px;border-radius:12px;background:var(--lado);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.dev.off .av{background:#9CA3AF}
.dev input{border:1px solid transparent;border-radius:8px;padding:4px 6px;margin-left:-6px;font-weight:700;font-size:16px;width:100%;background:transparent}
.dev input:hover{border-color:var(--linha)} .dev input:focus{border-color:var(--azul);background:#fff}
.dev .lin{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);border-top:1px dashed var(--linha);padding-top:8px}
.dev .lin b{color:var(--ink);font-weight:600}
.dev .bts{display:flex;gap:8px;flex-wrap:wrap}

/* mensagens */
.msgs{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:18px;align-items:start}
.campo{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.campo label{font-size:12.5px;font-weight:700;color:var(--ink2)}
.campo input,.campo textarea,.campo select{border:1px solid var(--linha);border-radius:9px;padding:9px 11px;background:#fff}
.campo textarea{min-height:110px;resize:vertical}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{display:flex;gap:14px;padding:14px 18px;border-bottom:1px solid #F0F1F3}
.msg:last-child{border-bottom:none}
.msg img{width:84px;height:84px;object-fit:cover;border-radius:10px;background:#EEF0F3;flex:none}
.msg h3{margin:0 0 3px;font-size:14.5px} .msg p{margin:0;color:var(--ink2);white-space:pre-wrap}
.msg .meta{font-size:12px;color:var(--ink3);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}
.msg .rec{margin-left:auto;text-align:right;flex:none;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.barra{height:6px;border-radius:6px;background:#EEF0F3;overflow:hidden;width:120px}
.barra span{display:block;height:100%;background:var(--verde)}
@media(max-width:1100px){.msgs{grid-template-columns:1fr}}

/* ficha da visita */
#dlg{position:fixed;inset:0;background:rgba(15,16,19,.55);display:none;align-items:stretch;justify-content:flex-end;z-index:20}
#dlg.on{display:flex}
#dlg .folha{width:min(560px,100%);background:var(--papel);overflow-y:auto;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
#dlg .folha .tt{position:sticky;top:0;background:var(--papel);padding:16px 20px;border-bottom:1px solid var(--linha);display:flex;gap:12px;align-items:flex-start}
#dlg .folha .tt h2{margin:0;font-size:17px} #dlg .folha .tt p{margin:3px 0 0;color:var(--ink2);font-size:13px}
#dlg .folha .tt button{margin-left:auto}
#dlg .foto{width:100%;max-height:360px;object-fit:cover;background:#EEF0F3;display:block}
#dlg dl{display:grid;grid-template-columns:150px 1fr;margin:0;padding:8px 20px 24px}
#dlg dt{color:var(--ink2);font-size:13px;padding:8px 0;border-bottom:1px solid #F0F1F3}
#dlg dd{margin:0;padding:8px 0;border-bottom:1px solid #F0F1F3;font-weight:500}

/* modulo em construcao */
.breve-c{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.breve-c .cartao{padding:18px}
.breve-c h3{margin:0 0 6px;font-size:15px} .breve-c p{margin:0;color:var(--ink2);line-height:1.5}

#moldura{position:fixed;left:240px;right:0;top:0;bottom:0;background:#fff;z-index:4}
#moldura iframe{border:0;width:100%;height:100%;display:block}
/* ---------- Ao vivo ---------- */
.av{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(340px,1fr);gap:18px;align-items:start}
.trilha{background:#0F1012;color:#E4E4E7;border-radius:18px;padding:18px 20px 16px}
.trilha .eixo{position:relative;height:22px;margin-left:150px;margin-right:106px;font-size:11.5px;color:#8E8E96}
.trilha .eixo span{position:absolute;transform:translateX(-50%)}
.faixa{display:grid;grid-template-columns:140px minmax(0,1fr) 96px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #1E1F23}
.faixa .qm b{display:block;color:#fff;font-size:14.5px} .faixa .qm small{color:#8E8E96;font-size:12px}
.faixa .nn{text-align:right;font-weight:800;font-size:22px;color:#fff;font-variant-numeric:tabular-nums}
.faixa .nn small{display:block;font-size:11px;color:#8E8E96;font-weight:600}
.pista{position:relative;height:46px;border-radius:10px;background:repeating-linear-gradient(90deg,#17181B 0,#17181B calc(100%/12 - 1px),#222327 calc(100%/12 - 1px),#222327 calc(100%/12))}
.pista .bl{position:absolute;top:7px;bottom:7px;border-radius:6px;min-width:7px;cursor:pointer;box-shadow:0 0 0 1px rgba(0,0,0,.35);transition:transform .12s}
.pista .bl:hover{transform:scaleY(1.18)}
.pista .bl.ult{box-shadow:0 0 0 2px #fff,0 0 14px 2px currentColor;animation:pulso 1.8s ease-in-out infinite}
@keyframes pulso{50%{box-shadow:0 0 0 2px #fff,0 0 2px 0 currentColor}}
.pista .par{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:11px;font-weight:700;color:#FBBF24;white-space:nowrap;background:#0F1012;padding:1px 6px;border:1px dashed #6B5310;border-radius:6px}
.pista .agora{position:absolute;top:-6px;bottom:-6px;width:2px;background:#E4002B}
.pista .agora::after{content:"agora";position:absolute;top:-14px;left:-14px;font-size:10px;color:#FF5A6E;font-weight:700}
.legav{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#A1A1AA;margin-top:12px}
.legav i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#avmapa{height:460px;border-radius:18px;overflow:hidden;background:#E9EAEC}
/* O mapa tem camadas próprias com números altos (até 1000). Sem isto elas disputavam com a tela toda
   e passavam por cima da ficha do cliente (#dlg), tampando as respostas. Com "isolate", as camadas do
   mapa valem só dentro do mapa. */
#avmapa,#pqmapa,.leaflet-container{isolation:isolate;z-index:0}
.pulsa{border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 0 currentColor;animation:radar 1.6s ease-out infinite}
@keyframes radar{0%{box-shadow:0 0 0 0 currentColor}100%{box-shadow:0 0 0 18px transparent}}
.diasel{display:flex;gap:6px;align-items:center}
/* Ao vivo com todas as frentes: a pesquisa tem uma faixa branca em cima do bloco e é quadrada no mapa */
.avfr{display:flex;gap:4px;align-items:center;margin-right:8px}
.avfr .bt[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.pista .bl.pq{border-radius:3px;box-shadow:inset 0 5px 0 rgba(255,255,255,.92),0 0 0 1px rgba(0,0,0,.35)}
.pista .bl.pq.ult{box-shadow:inset 0 5px 0 rgba(255,255,255,.92),0 0 0 2px #fff,0 0 14px 2px currentColor}
.legav b{color:#E4E4E7;font-weight:700;margin-right:2px}
.legav i.pq{border-radius:2px;box-shadow:inset 0 3px 0 rgba(255,255,255,.92)}
.avn{width:26px;height:26px;border-radius:50%;border:2px solid #fff;outline:2.5px solid transparent;display:flex;align-items:center;justify-content:center;
 font:800 11.5px/1 system-ui,sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.avn.pq{border-radius:6px}
.avleg{background:rgba(255,255,255,.94);border-radius:10px;padding:8px 10px;font:600 12px/1.6 system-ui,sans-serif;color:#1A1D21;box-shadow:0 2px 10px rgba(0,0,0,.18);display:flex;flex-direction:column}
.avleg i{display:inline-block;width:16px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.avleg .f{color:#5B6270;margin-top:3px}
.avleg .bo,.avleg .qd{display:inline-block;width:10px;height:10px;background:#9CA3AF;margin:0 4px 0 0;vertical-align:-1px}
.avleg .bo{border-radius:50%} .avleg .qd{border-radius:2px;margin-left:8px}
@media(max-width:1200px){.av{grid-template-columns:1fr}}
/* barras claras dos módulos */
.lb{display:grid;grid-template-columns:minmax(110px,180px) minmax(0,1fr) 70px;gap:10px;align-items:center;padding:6px 0;font-size:13.5px}
.lb .tr{height:16px;border-radius:5px;background:#EEF0F3;overflow:hidden;display:flex}
.lb .tr i{display:block;height:100%}
.lb .vl{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.funil{display:flex;flex-direction:column;gap:10px}
.fn{display:grid;grid-template-columns:200px minmax(0,1fr) 150px;gap:14px;align-items:center}
.fn .nm{font-weight:700} .fn .nm small{display:block;color:var(--ink2);font-weight:500;font-size:12px}
.fn .tr{height:44px;display:flex;justify-content:center}
.fn .tr i{display:flex;align-items:center;justify-content:center;height:100%;border-radius:10px;color:#fff;font-weight:800;font-size:16px;min-width:46px}
.fn .pc{font-size:13px;color:var(--ink2)} .fn .pc b{color:var(--ink);font-size:15px;display:block}
.grade2c{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media(max-width:1100px){.grade2c{grid-template-columns:1fr}}
.hist{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;align-items:end;height:150px;padding-top:6px}
.hist div{background:var(--azul);border-radius:4px 4px 0 0;position:relative;min-height:2px}
.hist div span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--ink2)}
.hist div b{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--ink2);font-weight:600}
/* ---------- Dashboards: visual escuro de apresentação ---------- */
.dk{background:#0B0B0C;color:#F4F4F5;border-radius:18px;padding:34px 38px 30px;position:relative;overflow:hidden}
.dk::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 70% at 100% 0%,rgba(228,0,43,.16),transparent 60%);pointer-events:none}
.dk>*{position:relative}
.dk .pill{display:inline-flex;align-items:baseline;gap:12px;background:#C8102E;border-radius:8px;padding:8px 16px}
.dk .pill b{font-weight:800;letter-spacing:.06em;font-size:17px}
.dk .pill span{font-size:14px;color:#FFE3E8}
.dk .topo{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin:16px 0 26px}
.dk h2{margin:0;font-size:46px;line-height:1.08;font-weight:800;letter-spacing:-.025em;max-width:20ch}
.dk h2 em{font-style:normal;color:#FF5A5F}
.dk .ks{display:flex;gap:12px}
.dk .k{background:#141416;border:1px solid #26262A;border-radius:14px;padding:14px 20px;text-align:right;min-width:150px}
.dk .k b{display:block;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.dk .k span{font-size:13px;color:#A1A1AA}
.dk .k.meta{border-color:#5B1220;background:#160A0D} .dk .k.meta b{color:#4ADE80}
.dk .tb{background:#111113;border:1px solid #232327;border-radius:16px;padding:6px 22px 10px}
.dk table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}

/* ---------------- servidor ---------------- */
let SESSAO=null;try{SESSAO=JSON.parse(localStorage.getItem(K_SESSAO)||'null')}catch(e){}
function guardaSessao(j){
  SESSAO=j?{access_token:j.access_token,refresh_token:j.refresh_token,expira:Date.now()+((+j.expires_in||3600)*1000)}:null;
  try{SESSAO?localStorage.setItem(K_SESSAO,JSON.stringify(SESSAO)):localStorage.removeItem(K_SESSAO)}catch(e){}
}
function erroDe(j,status){
  const m=String((j&&(j.message||j.msg||j.error_description||j.error))||('erro '+status));
  if(/Invalid login credentials|invalid_credentials|invalid_grant/i.test(m))return 'E-mail ou senha incorretos.';
  if(TESTE&&/schema must be one of|PGRST106/i.test(m+' '+((j&&j.code)||'')))
    return 'O ambiente de teste ainda não está ligado no Supabase: falta rodar o arquivo t01 ou marcar "rtm_teste" em Data API > Exposed schemas.';
  return m;
}
async function pede(caminho,opc){
  let r;try{r=await fetch(SUPA.url+caminho,opc)}catch(e){throw new Error('Sem conexão com o servidor.')}
  const t=r.headers.get('content-type')||'';
  if(opc&&opc.binario&&r.ok)return {ok:true,status:r.status,buf:await r.arrayBuffer()};
  const x=await r.text();let j=null;try{j=x?JSON.parse(x):null}catch(e){}
  return {ok:r.ok,status:r.status,j,t:x};
}
function semSessao(){const e=new Error('Sua sessão expirou. Entre de novo.');e.semSessao=true;return e}
async function autentica(email,senha){
  const r=await pede('/auth/v1/token?grant_type=password',{method:'POST',
    headers:{apikey:SUPA.chave,'Content-Type':'application/json'},body:JSON.stringify({email,password:senha})});
  if(!r.ok)throw new Error(erroDe(r.j,r.status));
  guardaSessao(r.j);
}
let renovando=null;
function renova(){
  if(renovando)return renovando;
  if(!SESSAO||!SESSAO.refresh_token)return Promise.reject(semSessao());
  renovando=pede('/auth/v1/token?grant_type=refresh_token',{method:'POST',
      headers:{apikey:SUPA.chave,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:SESSAO.refresh_token})})
    .then(r=>{if(r.ok){guardaSessao(r.j);return}
      const g=sessaoGuardada();if(g&&g.expira>Date.now()+60000){SESSAO=g;return}
      if(r.status>=400&&r.status<500){guardaSessao(null);throw semSessao()}
      throw new Error(erroDe(r.j,r.status))})
    .finally(()=>{renovando=null});
  return renovando;
}
function sessaoGuardada(){try{return JSON.parse(localStorage.getItem(K_SESSAO)||'null')}catch(e){return null}}
async function token(){
  /* o mapa, aberto dentro do painel, usa a mesma sessão e pode tê-la renovado antes */
  const g=sessaoGuardada();if(g&&(!SESSAO||g.expira>SESSAO.expira))SESSAO=g;
  if(!SESSAO)throw semSessao();if(Date.now()>SESSAO.expira-60000)await renova();return SESSAO.access_token}
async function rpc(nome,args,tentou){
  const tk=await token();
  const r=await pede('/rest/v1/rpc/'+nome,{method:'POST',headers:{apikey:SUPA.chave,Authorization:'Bearer '+tk,
    'Content-Type':'application/json','Content-Profile':PERFIL,'Accept-Profile':PERFIL},body:JSON.stringify(args||{})});
  if(r.status===401&&!tentou){await renova();return rpc(nome,args,true)}
  if(r.status===401){guardaSessao(null);throw semSessao()}
  if(!r.ok)throw new Error(erroDe(r.j,r.status));
  return r.j;
}
const caminhoUrl=c=>String(c).split('/').map(encodeURIComponent).join('/');
async function sobe(balde,caminho,corpo,tipo,trocar,tentou){
  const tk=await token();
  const r=await pede('/storage/v1/object/'+balde+'/'+caminhoUrl(caminho),{method:'POST',
    headers:{apikey:SUPA.chave,Authorization:'Bearer '+tk,'Content-Type':tipo,'x-upsert':trocar?'true':'false'},body:corpo});
  if(r.ok)return true;
  if(!tentou&&r.status===401){await renova();return sobe(balde,caminho,corpo,tipo,trocar,true)}
  throw new Error(erroDe(r.j,r.status));
}
async function baixa(balde,caminho){
  const tk=await token();
  const r=await pede('/storage/v1/object/authenticated/'+balde+'/'+caminhoUrl(caminho),
    {headers:{apikey:SUPA.chave,Authorization:'Bearer '+tk},binario:true});
  if(!r.ok){const e=new Error(r.status===400||r.status===404?'arquivo não encontrado':erroDe(r.j,r.status));e.status=r.status;throw e}
  return r.buf;
}
/* fotos privadas: link que vale 1 hora */
const ASSIN={};
async function linkFoto(cam){
  const a=ASSIN[cam];if(a&&a.ate>Date.now())return a.url;
  const tk=await token();
  const r=await pede('/storage/v1/object/sign/'+PASTA_FOTOS+'/'+caminhoUrl(cam),{method:'POST',
    headers:{apikey:SUPA.chave,Authorization:'Bearer '+tk,'Content-Type':'application/json'},body:JSON.stringify({expiresIn:3600})});
  const u=r.ok&&r.j&&(r.j.signedURL||r.j.signedUrl);
  if(!u)return '';
  const url=/^https?:/.test(u)?u:SUPA.url+'/storage/v1'+u;
  ASSIN[cam]={url,ate:Date.now()+50*60000};return url;
}
function fotoDaVisita(v){
  if(v.fotoCaminho)return linkFoto(v.fotoCaminho);
  const t=String(v.fotoUrl||''),m=t.match(/[-\w]{25,}/);
  if(/drive\.google\.com|googleusercontent/.test(t)&&m)return Promise.resolve('https://drive.google.com/thumbnail?id='+m[0]+'&sz=w1200');
  return Promise.resolve(t);
}

    const j=await rpc('visitas_todas',{p_desde:D.visDesde,p_cnpj:D.visCnpj});

/* ---------------- base (fica fora do arquivo, na pasta privada rtm-base) ---------------- */
const IDB_NOME='rtm_painel';
/* A cópia da base guardada no navegador é só um atalho para não baixar 3 MB a cada abertura. Nada
   aqui pode segurar o painel: se o navegador não responde (disco cheio, janela anônima, dados do
   site bloqueados, gravação recusada), as funções desistem depois de alguns segundos e o painel
   segue com a base baixada do servidor. Antes, uma gravação recusada deixava a tela para sempre em
   "Abrindo a base de clientes…". */
const comPrazo=(p,ms,padrao)=>Promise.race([Promise.resolve(p).catch(()=>padrao),new Promise(ok=>setTimeout(()=>ok(padrao),ms))]);
function idb(){return new Promise((ok,erro)=>{let r;try{r=indexedDB.open(IDB_NOME,1)}catch(e){return erro(e)}
  r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>erro(r.error);r.onblocked=()=>erro(new Error('ocupado'))})}
function idbLe(k){return comPrazo(idb().then(db=>new Promise(ok=>{const t=db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>ok(t.result);t.onerror=()=>ok(null)})),6000,null)}
function idbGrava(k,v){return comPrazo(idb().then(db=>new Promise(ok=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);
  t.oncomplete=()=>ok(true);t.onerror=()=>ok(false);t.onabort=()=>ok(false)})),20000,false)}
/* em que passo a abertura da base está: aparece ao lado do "Abrindo a base…", para dar para ver onde parou */
function basePasso(t){D.basePasso=t;try{document.querySelectorAll('.passobase').forEach(e=>e.textContent=t)}catch(e){}}
const abreComPrazo=buf=>Promise.race([abreGz(buf),new Promise((_,er)=>setTimeout(()=>er(new Error('o navegador demorou mais de 90 segundos para abrir o arquivo da base')),90000))]);
async function abreGz(buf){
  const u8=new Uint8Array(buf);
  if(u8[0]===0x1f&&u8[1]===0x8b){
    const s=new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
    return JSON.parse(await new Response(s).text());
  }
  return JSON.parse(new TextDecoder().decode(u8));
}
function resumoBase(b){
  const est=b.R?b.R.split('\n').filter(Boolean).length:0,cli=b.C?b.C.split('\n').filter(Boolean).length:0;
  return {versao:b.versao,descricao:b.descricao||'',estabelecimentos:est,clientes:cli,
    rotas:(b.D&&b.D.rotas||[]).length,municipiosPop:(b.populacao&&b.populacao.municipios||[]).length};
}
/* confere a versao no servidor (arquivo pequeno) e so baixa a base se mudou */
async function carregaBase(forcar){
  D.baseEstado='carregando';basePasso('conferindo a versão no servidor');pintaMainSe('base');
  try{
    let info=null;
    try{info=JSON.parse(new TextDecoder().decode(await baixa('rtm-base','versao.json')))}
    catch(e){if(e.semSessao)throw e;info=null}
    D.baseInfo=info;
    if(!info){D.base=null;D.baseEstado='sem';pintaLado();pintaMainSe('base');return}
    basePasso('procurando a cópia guardada neste navegador');
    const guardada=await idbLe('base');
    if(!forcar&&guardada&&guardada.versao===info.versao&&guardada.buf){
      basePasso('abrindo a cópia guardada');
      D.base=await abreComPrazo(guardada.buf);D.baseOrigem='guardada no navegador';D.baseGuardou=true;
    }else{
      basePasso('baixando do servidor (3 MB)');
      const buf=await baixa('rtm-base',info.arquivo||'base.json.gz');
      basePasso('abrindo o arquivo');
      D.base=await abreComPrazo(buf);D.baseOrigem='baixada agora';
      /* guardar no navegador não segura a tela: se não der, a base só é baixada de novo na próxima abertura */
      D.baseGuardou=null;
      idbGrava('base',{versao:info.versao,buf}).then(ok=>{D.baseGuardou=ok;pintaMainSe('base')});
    }
    D.baseResumo=resumoBase(D.base);D.baseEstado='ok';
  }catch(e){
    if(e.semSessao)return sessaoCaiu();
    D.baseEstado='erro';D.baseErro=e.message;
  }
  pintaLado();pintaMainSe('base');pintaMainSe('dash');
  if(MOD==='pesquisa'&&FPQ.aba==='camp')pintaMain();   /* a montagem da pesquisa usa a base */
  /* a "Nova frente" também: aberta antes de a base terminar de abrir, ela ficava parada em
     "Abrindo a base de clientes…" para sempre */
  if(MOD==='frentes'&&FRD.nova)pintaMain();
}
async function enviaBase(arq){
  if(!arq)return;
  /* a base é uma só, a de produção: o portal de teste só lê */
  if(TESTE)return toast('No portal de teste a base é só para leitura. Troque a base pelo portal de produção.');
  const buf=await arq.arrayBuffer();
  let b;try{b=await abreGz(buf)}catch(e){return toast('Este arquivo não é uma base válida.')}
  if(!b||!b.versao||!b.R||!b.C||!b.D)return toast('Arquivo sem versão, estabelecimentos, clientes ou rotas.');
  const r=resumoBase(b);
  if(!confirm('Enviar a base '+r.versao+'?\n\n'+fmt(r.estabelecimentos)+' estabelecimentos, '+fmt(r.clientes)+
     ' clientes BAND, '+fmt(r.rotas)+' rotas.\n\nEla passa a ser a base do painel.'))return;
  toast('Enviando a base…');
  try{
    const gz=new Uint8Array(buf)[0]===0x1f;
    const nome='base.json'+(gz?'.gz':'');
    await sobe('rtm-base',nome,new Blob([buf]),gz?'application/gzip':'application/json',true);
    const info={versao:b.versao,arquivo:nome,enviadaEm:new Date().toISOString(),enviadaPor:EU&&EU.email,
      bytes:buf.byteLength,estabelecimentos:r.estabelecimentos,clientes:r.clientes};
    await sobe('rtm-base','versao.json',new Blob([JSON.stringify(info)]),'application/json',true);
    toast('Base '+b.versao+' enviada');
    carregaBase(true);
  }catch(e){if(e.semSessao)return sessaoCaiu();toast('Não consegui enviar: '+e.message)}
}

/* ---------------- módulo: Frentes de trabalho ----------------
   Uma frente é um trabalho que o time faz em campo: a prospecção (pontos que ainda não são
   clientes BAND) e cada pesquisa ativa (clientes BAND). Aqui o coordenador põe as frentes em
   ordem e dá prazo. A PRIMEIRA da lista é o foco: o app mostra ela em destaque na tela inicial.
   O banco guarda só a ordem e as datas; o avanço sai do que o painel já lê. */
const FRD={cfg:{},estado:'',erro:'',lendo:null,salvando:false,nova:false};
function carregaFrentes(){
  if(FRD.lendo)return FRD.lendo;
  FRD.lendo=(async()=>{
    try{
      const j=await rpc('frentes');
      FRD.cfg={};(j.frentes||[]).forEach(f=>FRD.cfg[f.id]={inicio:f.inicio||'',prazo:f.prazo||'',ordem:f.ordem});
      FRD.estado='ok';FRD.erro='';
    }catch(e){
      if(e.semSessao)throw e;
      /* o banco ainda não tem as funções das frentes (falta rodar o r07) */
      FRD.estado=/Could not find the function|PGRST202/i.test(e.message)?'sembanco':'erro';FRD.erro=e.message;
    }finally{FRD.lendo=null}
  })();
  return FRD.lendo;
}
function frRecarrega(){return carregaFrentes().then(()=>pintaMainSe('frentes')).catch(e=>{if(e.semSessao)sessaoCaiu()})}
const frBR=iso=>iso?iso.slice(8,10)+'/'+iso.slice(5,7):'';
function frLista(){
  const emUso=D.roteiros.find(r=>r.emUso),ativos=D.devs.filter(d=>d.ativo);
  const l=[{id:'prospeccao',tipo:'pros',nome:'Prospecção',publico:'Não é cliente BAND',abre:'planejar',abreTxt:'Abrir o planejador',
    total:emUso?(+emUso.clientes||0):0,un:'pontos do roteiro',unFeito:'visitas',quem:ativos.map(d=>d.nome),semTotal:'Sem roteiro publicado'}];
  PQD.lista.filter(p=>p.status==='ativa').forEach(p=>{
    const meus=PQD.p&&PQD.p.id===p.id?[...new Set(PQD.cli.map(c=>c.dev).filter(Boolean))].map(pqNomeDev):[];
    l.push({id:p.id,tipo:'pesq',nome:p.nome,publico:'Cliente BAND',abre:'pesquisa',abreTxt:'Ver respostas',
      total:+p.clientes||0,feitos:+p.respostas||0,un:'clientes',unFeito:'respondidos',quem:meus,semTotal:'Sem clientes'})});
  l.forEach((f,i)=>{const c=FRD.cfg[f.id]||{};f.inicio=c.inicio||'';f.prazo=c.prazo||'';f.ordem=c.ordem!=null?+c.ordem:1000+i});
  /* na prospecção contam as visitas registradas dentro do período da frente */
  const pr=l[0],ini=pr.inicio?new Date(pr.inicio+'T00:00:00'):null,fim=pr.prazo?new Date(pr.prazo+'T23:59:59'):null;
  pr.feitos=D.visitas.filter(v=>{const d=dataDe(v);return (!ini||(d&&d>=ini))&&(!fim||(d&&d<=fim))}).length;
  return l.sort((a,b)=>a.ordem-b.ordem);
}
function frPrazo(f){
  const h=pqHoje();
  if(f.total&&f.feitos>=f.total)return ['concluída','v'];
  if(f.inicio&&f.inicio>h)return ['começa em '+frBR(f.inicio),'c'];
  if(!f.prazo)return ['sem prazo definido','c'];
  const dias=Math.round((new Date(f.prazo+'T12:00:00')-new Date(h+'T12:00:00'))/86400000);
  if(dias<0)return ['atrasada há '+(-dias)+(dias===-1?' dia':' dias'),'r'];
  if(dias===0)return ['o prazo é hoje','a'];
  return ['faltam '+dias+(dias===1?' dia':' dias'),dias<=2?'a':'v'];
}

  return cab('Frentes de trabalho',sub)+'<div class="corpo">'+aviso+

          nbCorpo(PQD.lista.find(x=>x.status==='ativa')||null,true)+'</div></div>'

          'As perguntas são montadas em <a href="#formularios" data-frabre="formularios">Formulários</a>.</div></div>')+

/* guarda a lista inteira (são poucas linhas): a ordem da tela vira a ordem no banco */
async function frSalva(l,msg){
  if(FRD.salvando)return;
  FRD.salvando=true;
  l.forEach((f,i)=>FRD.cfg[f.id]={inicio:f.inicio,prazo:f.prazo,ordem:i+1});
  pintaMainSe('frentes');
  try{
    await rpc('frentes_salvar',{p_frentes:l.map((f,i)=>({id:f.id,tipo:f.tipo==='pros'?'prospeccao':'pesquisa',inicio:f.inicio||null,prazo:f.prazo||null,ordem:i+1}))});
    toast(msg);
  }catch(e){
    if(e.semSessao)return sessaoCaiu();
    toast(/Could not find the function|PGRST202/i.test(e.message)?'Ainda não dá para guardar: falta rodar o arquivo r07 no banco.':'Não consegui guardar: '+e.message);
    FRD.estado='';
  }finally{FRD.salvando=false;pintaMainSe('frentes')}
}

/* ---------------- módulo: Formulários ----------------
   Um formulário é uma lista de perguntas montada pelo coordenador. Ao publicar uma pesquisa,
   ele escolhe o formulário; a pesquisa guarda uma cópia das perguntas e o app responde por elas.
   Toda pesquisa começa com a pergunta de chegada (falou com o responsável, ausente, fechado...),
   que é fixa: as perguntas do formulário aparecem quando o desenvolvedor fala com o responsável.
   Pergunta: {id, t (texto), tipo: uma|varias|nota|texto, ops: [[valor, texto]], opc (pode pular),
              alerta: [valores que abrem acompanhamento], se: {idDaPergunta: [valores]}}. */
const FMD={lista:[],estado:'',erro:'',lendo:null,sel:null,rasc:null,sujo:false,salvando:false};
const FM_TIPO={uma:'Uma opção',varias:'Várias opções',nota:'Nota de 0 a 10',texto:'Texto livre',numero:'Número',foto:'Foto'};
function carregaFormularios(){
  if(FMD.lendo)return FMD.lendo;
  FMD.lendo=(async()=>{
    try{FMD.lista=(await rpc('formularios')).formularios||[];FMD.estado='ok';FMD.erro=''}
    catch(e){
      if(e.semSessao)throw e;
      FMD.estado=/Could not find the function|PGRST202/i.test(e.message)?'sembanco':'erro';FMD.erro=e.message;
    }finally{FMD.lendo=null}
  })();
  return FMD.lendo;
}
function fmRecarrega(){return carregaFormularios().then(()=>{pintaMainSe('formularios');pintaMainSe('pesquisa')}).catch(e=>{if(e.semSessao)sessaoCaiu()})}
const fmNovoId=(lista,pre)=>{let n=1;lista.forEach(x=>{const m=new RegExp('^'+pre+'(\\d+)$').exec(String(Array.isArray(x)?x[0]:x.id));if(m)n=Math.max(n,+m[1]+1)});return pre+n};
function fmAbre(id){
  if(FMD.sujo&&!confirm('Sair deste formulário sem salvar o que mudou?'))return;
  const f=FMD.lista.find(x=>x.id===id);
  FMD.sel=id;FMD.sujo=false;
  FMD.rasc=f?JSON.parse(JSON.stringify({id:f.id,nome:f.nome,perguntas:f.perguntas||[]}))
            :{id:null,nome:'',perguntas:[{id:'p1',t:'',tipo:'uma',ops:[['o1','Sim'],['o2','Não']]}]};
  pintaMainSe('formularios');
}
/* o que impede salvar: devolve o texto do problema, ou vazio */
function fmConfere(r){
  if(String(r.nome||'').trim().length<3)return 'Dê um nome ao formulário (pelo menos 3 letras).';
  if(!r.perguntas.length)return 'O formulário precisa de pelo menos uma pergunta.';
  for(let i=0;i<r.perguntas.length;i++){const q=r.perguntas[i],n='Pergunta '+(i+1);
    if(String(q.t||'').trim().length<3)return n+': escreva a pergunta.';
    if(q.tipo==='uma'||q.tipo==='varias'){
      const ops=(q.ops||[]).filter(o=>String(o[1]||'').trim());
      if(ops.length<2)return n+': precisa de pelo menos duas opções escritas.';
      if(new Set(ops.map(o=>String(o[1]).trim().toLowerCase())).size<ops.length)return n+': há opções repetidas.';
    }
  }
  return '';
}
function fmLimpa(r){
  const ids=new Set(r.perguntas.map(q=>q.id));
  return {id:r.id,nome:String(r.nome).trim().replace(/\s+/g,' ').slice(0,80),perguntas:r.perguntas.map(q=>{
    const escolha=q.tipo==='uma'||q.tipo==='varias';
    const ops=escolha?(q.ops||[]).filter(o=>String(o[1]||'').trim()).map(o=>[o[0],String(o[1]).trim().slice(0,120)]):[];
    const val=new Set(ops.map(o=>o[0])),o={id:q.id,t:String(q.t).trim().slice(0,240),tipo:q.tipo};
    if(escolha){o.ops=ops;const al=(q.alerta||[]).filter(v=>val.has(v));if(al.length)o.alerta=al}
    if(q.opc)o.opc=true;
    /* número: a unidade é opcional (portas, caixas, R$...) */
    if(q.tipo==='numero'&&String(q.un||'').trim())o.un=String(q.un).trim().slice(0,12);
    /* a condição só vale se a pergunta de que ela depende ainda existe e vem antes */
    const k=Object.keys(q.se||{})[0],dep=k&&r.perguntas.find(x=>x.id===k);
    if(dep&&ids.has(k)&&r.perguntas.indexOf(dep)<r.perguntas.indexOf(q)){
      const v=(q.se[k]||[]).filter(x=>(dep.ops||[]).some(y=>y[0]===x&&String(y[1]||'').trim()));
      if(v.length)o.se={[k]:v};
    }
    return o})};
}

async function fmSalva(){
  const r=FMD.rasc;if(!r||FMD.salvando)return;
  const prob=fmConfere(r),msg=$('fmmsg');
  if(prob){if(msg){msg.textContent=prob;msg.classList.remove('esc')}return toast(prob)}
  FMD.salvando=true;const b=$('fmsalva');if(b){b.disabled=true;b.textContent='Salvando…'}
  try{
    const j=await rpc('formulario_salvar',{p_formulario:fmLimpa(r)});
    FMD.sujo=false;await carregaFormularios();FMD.sel=j.id||r.id;
    const f=FMD.lista.find(x=>x.id===FMD.sel);if(f)FMD.rasc=JSON.parse(JSON.stringify({id:f.id,nome:f.nome,perguntas:f.perguntas||[]}));
    toast('Formulário salvo');
  }catch(e){
    if(e.semSessao)return sessaoCaiu();
    toast(/Could not find the function|PGRST202/i.test(e.message)?'Ainda não dá para salvar: falta rodar o arquivo r07 no banco.':'Não consegui salvar: '+e.message);
  }finally{FMD.salvando=false;pintaMainSe('formularios')}
}
liga.formularios=()=>{
  const m=$('main'),r=FMD.rasc,muda=()=>{FMD.sujo=true},redesenha=()=>{FMD.sujo=true;const y=m.scrollTop;pintaMain();m.scrollTop=y};
  m.querySelectorAll('[data-fm]').forEach(c=>c.onclick=()=>fmAbre(c.dataset.fm));
  if($('fmnovo'))$('fmnovo').onclick=()=>fmAbre('novo');
  if(!r||FMD.sel==='padrao')return;
  const ij=s=>s.split('|').map(Number);
  $('fmnome').oninput=e=>{r.nome=e.target.value;muda()};
  m.querySelectorAll('[data-qt]').forEach(el=>el.oninput=()=>{r.perguntas[+el.dataset.qt].t=el.value;muda()});
  /* sem redesenhar a cada letra, para o cursor não sair do campo; as listas "respondida com"
     das perguntas seguintes pegam o texto novo no próximo redesenho (acrescentar, mover, trocar) */
  m.querySelectorAll('[data-qo]').forEach(el=>el.oninput=()=>{const [i,j]=ij(el.dataset.qo);r.perguntas[i].ops[j][1]=el.value;muda()});
  m.querySelectorAll('[data-qun]').forEach(el=>el.oninput=()=>{r.perguntas[+el.dataset.qun].un=el.value;muda()});
  m.querySelectorAll('[data-qtipo]').forEach(el=>el.onchange=()=>{const q=r.perguntas[+el.dataset.qtipo];q.tipo=el.value;
    if((q.tipo==='uma'||q.tipo==='varias')&&!(q.ops||[]).length)q.ops=[['o1',''],['o2','']];redesenha()});
  m.querySelectorAll('[data-qal]').forEach(el=>el.onchange=()=>{const [i,j]=ij(el.dataset.qal),q=r.perguntas[i],v=q.ops[j][0];
    q.alerta=(q.alerta||[]).filter(x=>x!==v);if(el.checked)q.alerta.push(v);muda()});
  m.querySelectorAll('[data-qopc]').forEach(el=>el.onchange=()=>{r.perguntas[+el.dataset.qopc].opc=el.checked;muda()});
  m.querySelectorAll('[data-qomais]').forEach(el=>el.onclick=()=>{const q=r.perguntas[+el.dataset.qomais];q.ops=q.ops||[];q.ops.push([fmNovoId(q.ops,'o'),'']);redesenha()});
  m.querySelectorAll('[data-qotira]').forEach(el=>el.onclick=()=>{const [i,j]=ij(el.dataset.qotira);r.perguntas[i].ops.splice(j,1);redesenha()});
  m.querySelectorAll('[data-qtira]').forEach(el=>el.onclick=()=>{if(r.perguntas.length<=1)return toast('O formulário precisa de pelo menos uma pergunta');
    r.perguntas.splice(+el.dataset.qtira,1);redesenha()});
  const troca=(i,para)=>{if(para<0||para>=r.perguntas.length)return;const [q]=r.perguntas.splice(i,1);r.perguntas.splice(para,0,q);redesenha()};
  m.querySelectorAll('[data-qsobe]').forEach(el=>el.onclick=()=>troca(+el.dataset.qsobe,+el.dataset.qsobe-1));
  m.querySelectorAll('[data-qdesce]').forEach(el=>el.onclick=()=>troca(+el.dataset.qdesce,+el.dataset.qdesce+1));
  m.querySelectorAll('[data-qse]').forEach(el=>el.onchange=()=>{const q=r.perguntas[+el.dataset.qse],dep=r.perguntas.find(x=>x.id===el.value);
    if(!dep)delete q.se;else{const o=(dep.ops||[]).find(y=>String(y[1]||'').trim());q.se={[dep.id]:o?[o[0]]:[]}}redesenha()});
  m.querySelectorAll('[data-qsev]').forEach(el=>el.onchange=()=>{const q=r.perguntas[+el.dataset.qsev],k=Object.keys(q.se||{})[0];if(k){q.se[k]=[el.value];muda()}});
  $('fmmais').onclick=()=>{r.perguntas.push({id:fmNovoId(r.perguntas,'p'),t:'',tipo:'uma',ops:[['o1',''],['o2','']]});redesenha();
    const c=m.querySelectorAll('[data-qt]');if(c.length)c[c.length-1].focus()};
  $('fmsalva').onclick=fmSalva;
};

function dataDe(v){const m=String(v.data||'').match(/^(\d{2})\/(\d{2})\/(\d{4})/);return m?new Date(+m[3],+m[2]-1,+m[1]):(v.iso?new Date(v.iso):null)}

const FV={dev:'',per:'30',sit:'',q:''};
/* as respostas do app ("O estabelecimento existe neste endereço?") viram situações */
function situacao(v){
  const e=v.existe||'';
  if(/cancelad/i.test(e)||v.cancelada)return ['Cancelada','c'];
  if(/^Já tem cadastro BAND/i.test(e))return ['Já é cliente','v'];
  if(/^Sim/i.test(e))return /agora/i.test(v.interesse||'')?['Quer cadastro','v']:['Funcionando','b'];
  if(/^Existe, mas estava fechado/i.test(e))return ['Fechado na hora','a'];
  if(/mudou de ramo/i.test(e))return ['Mudou de ramo','a'];
  if(/encerrou|não localizado|nao localizado|não existe|nao existe/i.test(e))return ['Não encontrado','r'];
  return [e||'Registrada','a'];
}
function visitasFiltradas(){
  const lim=FV.per==='tudo'?null:(()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(+FV.per-1));return d})();
  const q=FV.q.trim().toLowerCase();
  return D.visitas.filter(v=>{
    if(FV.dev&&v.devLogin!==FV.dev)return false;
    if(lim){const d=dataDe(v);if(!d||d<lim)return false}
    if(FV.sit&&situacao(v)[0]!==FV.sit)return false;
    if(q&&!((v.nome||'')+' '+v.cnpj+' '+(v.bairro||'')).toLowerCase().includes(q))return false;
    return true;
  }).sort((a,b)=>String(b.iso||'').localeCompare(String(a.iso||'')));
}

/* ---------------- tempo das visitas ---------------- */
const hm=t=>{const m=String(t||'').match(/^(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):null};
const hmTxt=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function janela(v){
  const fim=hm(v.hora);if(fim==null)return null;
  let ini=hm(v.inicioHora);
  if(ini==null||ini>fim)ini=v.duracaoMin?fim-v.duracaoMin:fim-8;
  return [ini,fim];

const COR_SIT={'Quer cadastro':'#22C55E','Funcionando':'#60A5FA','Já é cliente':'#14B8A6','Fechado na hora':'#A78BFA','Mudou de ramo':'#F472B6','Não encontrado':'#9CA3AF','Cancelada':'#F5A524'};
const corSit=v=>COR_SIT[situacao(v)[0]]||'#A78BFA';
const PAL_DEV=['#E4002B','#2563EB','#16A34A','#9333EA','#EA580C','#0891B2'];
const corDev=l=>{const i=D.devs.findIndex(d=>d.login===l);return PAL_DEV[(i<0?0:i)%PAL_DEV.length]};
const durMin=v=>v.duracaoMin||(v.duracaoSeg?Math.round(v.duracaoSeg/60):null);

/* ---------------- módulo: Ao vivo ---------------- */
const FA={dia:null,fr:''};
let avMapa=null;
/* Tudo o que o desenvolvedor registrou no dia, de QUALQUER frente: as visitas de prospecção e as
   respostas das pesquisas. Cada registro vira um "evento" com hora, lugar e cor; é com os eventos
   que a trilha do dia e o trajeto no mapa são desenhados. Frente nova que guardar hora e GPS entra aqui. */
const AV_FR={pros:'Prospecção',pesq:'Pesquisa'};
const COR_PQ={ok:'#38BDF8',voltar:'#FBBF24',nao:'#71717A'},AV_PQ_NOME={ok:'Pesquisa respondida',voltar:'Pesquisa: voltar depois',nao:'Pesquisa sem contato'};
/* As respostas do dia de TODAS as pesquisas, ativas ou encerradas (função pesquisa_respostas_do_dia,
   do arquivo r07). Enquanto ela não responde, ou se o banco ainda não tem a função, o Ao vivo usa as
   respostas da pesquisa que está carregada no painel, como sempre foi. */
const AVD={dia:'',pedido:'',resp:[],estado:'',lendo:null,quando:0};
function avEventos(dia){
  const ev=D.visitas.filter(v=>v.data===dia).map(v=>{const s=situacao(v)[0];
    return {fr:'pros',dev:v.devLogin,nome:v.nome||'',j:janela(v),hora:v.hora,gps:v.gps&&isFinite(v.gps.lat)?{lat:+v.gps.lat,lon:+v.gps.lon}:null,
      cor:corSit(v),sit:s,dur:durMin(v),km:+v.dist,quer:s==='Quer cadastro',id:v.cnpj}});
  const doDia=AVD.estado==='ok'&&AVD.dia===dia;
  (doDia?AVD.resp:Object.values(PQD.resp||{})).forEach(r=>{
    if(r.data!==dia)return;
    /* vindo do dia inteiro, o nome do cliente e o da pesquisa já estão na própria resposta */
    const c=doDia?r:(PQD.porCod[r.cod]||{}),fim=hm(r.hora),dur=r.duracao_seg?Math.max(1,Math.round(r.duracao_seg/60)):null;
    const tipo=r.situacao==='falou'?'ok':PQ_VOLTAR.includes(r.situacao)?'voltar':'nao';
    ev.push({fr:'pesq',pid:r.pesquisa||(PQD.p&&PQD.p.id)||'',pq:r.pesquisaNome||(PQD.p&&PQD.p.nome)||'',
      dev:r.devLogin,nome:c.nome||('Cliente '+r.cod),j:fim==null?null:[fim-(dur||6),fim],hora:r.hora,
      gps:r.gps_lat!=null&&isFinite(+r.gps_lat)?{lat:+r.gps_lat,lon:+r.gps_lon}:null,
      cor:COR_PQ[tipo],sit:AV_PQ_NOME[tipo],dur,km:r.dist==null?NaN:(+r.dist)/1000,quer:false,id:r.cod});
  });

}
/* o nome da frente de um registro: na pesquisa, com o nome da pesquisa (pode haver mais de uma em campo) */
const avFrente=e=>e.fr==='pesq'&&e.pq?'Pesquisa · '+e.pq:AV_FR[e.fr];
const avAssina=dia=>JSON.stringify(avEventos(dia).map(e=>[e.fr,e.dev,e.id,e.pid||'',e.hora,e.sit]));
function carregaAoVivo(dia){
  if(AVD.lendo)return AVD.lendo;
  AVD.pedido=dia;
  AVD.lendo=(async()=>{
    const antes=avAssina(dia);
    try{
      const j=await rpc('pesquisa_respostas_do_dia',{p_data:dia});
      AVD.resp=j.respostas||[];AVD.dia=dia;AVD.estado='ok';
    }catch(e){
      if(e.semSessao)throw e;
      /* banco ainda sem a função (falta rodar o r07): não pede de novo até recarregar o painel */
      AVD.estado=/Could not find the function|PGRST202/i.test(e.message)?'sembanco':'erro';
    }finally{AVD.quando=Date.now();AVD.lendo=null}
    /* o coordenador trocou de dia enquanto a resposta vinha: busca o dia que está na tela */
    const naTela=FA.dia||hojeBR();
    if(MOD==='aovivo'&&naTela!==dia&&AVD.estado!=='sembanco'){setTimeout(()=>carregaAoVivo(naTela),0);return}
    /* só refaz a tela se mudou alguma coisa e ninguém está com uma ficha aberta */
    if(MOD==='aovivo'&&!$('dlg').classList.contains('on')&&avAssina(dia)!==antes)pintaMain();
  })().catch(e=>{if(e&&e.semSessao)sessaoCaiu()});
  return AVD.lendo;
}
/* abre a ficha de uma resposta; se ela é de outra pesquisa, carrega antes essa pesquisa no painel */
async function avAbrePq(pid,cod){
  if(pid&&(!PQD.p||PQD.p.id!==pid)){
    if(PQD.lendo)await PQD.lendo.catch(()=>{});
    const at=PQD.lista.find(x=>x.status==='ativa');
    PQD.sel=at&&at.id===pid?null:pid;
    try{await carregaPesquisa(true);pintaLado()}catch(e){if(e.semSessao)return sessaoCaiu()}
    if(!PQD.p||PQD.p.id!==pid)return toast('Não consegui abrir a pesquisa desta resposta');
  }
  abrePq(cod);
}

/* O trajeto de cada desenvolvedor: uma linha na cor dele ligando as paradas na ordem em que

  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,attribution:'Esri, HERE, Garmin'}).addTo(avMapa);
  const dia=FA.dia||hojeBR(),ehHoje=dia===hojeBR(),ev=avEventos(dia),pts=[],leg=[];

      const mk=L.marker([e.gps.lat,e.gps.lon],{zIndexOffset:ult?500:i,icon:L.divIcon({className:'',iconSize:[26,26],iconAnchor:[13,13],
        html:'<div class="avn'+(e.fr==='pesq'?' pq':'')+(ult?' pulsa':'')+'" style="background:'+(ult?cor:e.cor)+';color:'+(ult?cor:'#0F1012')+';outline-color:'+cor+'"><span'+(ult?' style="color:#fff"':'')+'>'+(i+1)+'</span></div>'})});

  });
  if(leg.length){const C=L.control({position:'bottomleft'});
    C.onAdd=()=>{const dv=L.DomUtil.create('div','avleg');dv.innerHTML=leg.join('')+'<span class="f"><b class="bo"></b>prospecção <b class="qd"></b>pesquisa</span>';return dv};C.addTo(avMapa)}
  if(pts.length)avMapa.fitBounds(pts,{padding:[34,34],maxZoom:15});else avMapa.setView([-16.68,-49.26],10);

/* imagem da mensagem: reduzida para no máximo 1600 px antes de subir */
function reduzImagem(arq){return new Promise((ok,erro)=>{
  const img=new Image();img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):erro(new Error('imagem inválida')),'image/jpeg',.82)};
  img.onerror=()=>erro(new Error('imagem inválida'));img.src=URL.createObjectURL(arq)})}

/* Cria um desenvolvedor: primeiro o cadastro (função do banco), depois a conta de acesso, pelo
   cadastro oficial do Supabase. Se a conta falhar, repetir com os mesmos dados só refaz esse passo. */
async function criaDev(){
  const nome=$('ndnome').value.trim().replace(/\s+/g,' '),login=$('ndlogin').value.trim().toLowerCase(),senha=$('ndsenha').value;
  if(nome.length<3){$('ndnome').focus();return toast('Escreva o nome do desenvolvedor')}
  if(!/^[a-z0-9][a-z0-9._-]{1,29}$/.test(login)){$('ndlogin').focus();return toast('Login: de 2 a 30 letras minúsculas, números, ponto ou traço, sem espaço')}
  if(senha.length<6){$('ndsenha').focus();return toast('A senha provisória precisa de pelo menos 6 caracteres')}
  if(!confirm('Criar o desenvolvedor '+nome+'?\n\nEle entra no app com o e-mail '+login+'@band.com.br e a senha provisória.\n\nPassa a aparecer no planejamento do roteiro e na Pesquisa.'))return;
  const b=$('ndcria');b.disabled=true;b.textContent='Criando…';
  try{
    const j=await rpc('desenvolvedor_criar',{p_login:login,p_nome:nome});
    let aviso='';
    if(!j.contaCriada){
      /* a resposta traz uma sessão do usuário novo; o painel não guarda nem usa */
      const r=await pede('/auth/v1/signup',{method:'POST',headers:{apikey:SUPA.chave,'Content-Type':'application/json'},
        body:JSON.stringify({email:j.email,password:senha})});
      if(!r.ok){
        if(/already|registered|exists/i.test(JSON.stringify(r.j||'')))
          throw new Error('o cadastro foi feito, mas já havia uma conta com o e-mail '+j.email+'. Use "Voltar senha para a padrão" no cartão dele antes de passar a senha.');
        throw new Error('o cadastro foi feito, mas a conta não foi criada ('+erroDe(r.j,r.status)+'). Corrija e clique em Criar de novo, com o mesmo nome e login.');
      }
      if(!(r.j&&(r.j.access_token||(r.j.user&&r.j.user.confirmed_at)||r.j.confirmed_at||r.j.email_confirmed_at)))
        aviso=' Atenção: o Supabase pediu confirmação por e-mail para esta conta.';
    }
    await carregaDevs();pintaLado();pintaMain();
    toast(nome+' criado. E-mail de acesso: '+j.email+'.'+aviso);
  }catch(e){
    if(e.semSessao)return sessaoCaiu();
    /* o aviso fica na tela (o texto é longo para sumir em 3 segundos) e os campos continuam preenchidos */
    toast('Não consegui criar o desenvolvedor');
    if($('ndmsg')){$('ndmsg').textContent='Não consegui criar: '+e.message;$('ndmsg').classList.remove('esc')}
    carregaDevs().then(()=>{if($('ndcria')){$('ndcria').disabled=false;$('ndcria').textContent='Criar desenvolvedor'}}).catch(()=>{});
  }
}

/* ---------------- módulo: Dashboards ---------------- */
/* "Prospecção de clientes": clientes BAND por mil habitantes contra a meta.
   Meta por mil = referência do Brasil × meta (%). Gap = população/1000 × meta por mil − clientes (mínimo 0).
   Status: clientes por mil ÷ referência, nas faixas (padrão 40%, 60% e 80%). */
const K_DASH='rtm_painel_dash';
const SLIDE=['Aparecida de Goiânia','Bela Vista de Goiás','Goiânia','Goianira','Hidrolândia','Inhumas','Senador Canedo','Trindade'];
let DS=null;
function dashCfg(){
  if(DS)return DS;
  let g=null;try{g=JSON.parse(localStorage.getItem(K_DASH)||'null')}catch(e){}
  DS=Object.assign({ref:6.4,meta:80,f1:40,f2:60,f3:80,ordem:'nome',cidades:SLIDE.slice(),
    titulo:'PROSPECÇÃO DE CLIENTES',subtitulo:'por que o novo RTM precisa de vocês',lista:false},g||{});
  return DS;
}
function salvaDash(){try{localStorage.setItem(K_DASH,JSON.stringify(DS))}catch(e){}}
const semAcento=t=>String(t||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/['-]/g,' ').trim();
function dadosCidades(){
  const b=D.base;if(!b||!b.D||!b.populacao)return null;
  const pop={};(b.populacao.municipios||[]).forEach(m=>pop[m.chave]=m);
  const antigos=b.populacao.nomes_antigos||{};
  const out=[],sem=[];
  (b.D.cities||[]).forEach(c=>{
    const k=semAcento(c[0]),m=pop[k]||pop[antigos[k]];
    if(m)out.push({nome:m.nome,uf:m.uf,pop:m.pop,cli:+c[3]||0,nomeMapa:c[0]});
    else sem.push({nome:c[0],cli:+c[3]||0});
  });
  /* municípios com população e sem nenhum cliente também entram (gap cheio) */
  const tem=new Set(out.map(x=>semAcento(x.nome)));
  (b.populacao.municipios||[]).forEach(m=>{if(!tem.has(m.chave))out.push({nome:m.nome,uf:m.uf,pop:m.pop,cli:0,nomeMapa:m.nome})});
  return {cidades:out,sem};
}
function calcula(l,cfg){
  const metaMil=cfg.ref*cfg.meta/100;
  return l.map(c=>{
    const pm=c.pop?c.cli*1000/c.pop:0,pct=cfg.ref?pm/cfg.ref*100:0;
    const gap=Math.max(0,Math.round(c.pop/1000*metaMil-c.cli));

function prep(){

  const L=b.R.split('\n');let n=0;
  const cad=new Uint8Array(L.length),ex=new Uint8Array(L.length),cn=new Int16Array(L.length),ci=new Int16Array(L.length),po=new Uint8Array(L.length),rt=new Int16Array(L.length),cnpj=new Array(L.length);
  for(const l of L){if(!l)continue;const p=l.split('|');cnpj[n]=p[0];cad[n]=+p[3];cn[n]=+p[4];ci[n]=+p[5];po[n]=+p[8];rt[n]=+p[11];ex[n]=+p[13];n++}
  const pop={};(b.populacao&&b.populacao.municipios||[]).forEach(m=>pop[m.chave]=m);

function pqConta(rs,id){const n={};let base=0;rs.forEach(r=>{const v=r.r&&r.r[id];if(!pqTemV(v))return;base++;(Array.isArray(v)?v:[v]).forEach(x=>n[x]=(n[x]||0)+1)});return {n,base}}

/* Lê a pesquisa do servidor. Na primeira vez vem tudo; depois, só o que chegou ou mudou.
   Nunca derruba o resto do painel: o erro fica guardado e aparece só na tela da Pesquisa. */
function carregaPesquisa(tudo){
  if(PQD.lendo)return PQD.lendo;
  PQD.lendo=(async()=>{
    PQD.mudou=false;
    try{
      PQD.lista=(await rpc('pesquisas')).pesquisas||[];
      if(tudo){PQD.desde=null;PQD.versao=null;PQD.resp={};PQD.ac={};PQD.mudou=true}
      let j=await rpc('pesquisa_dados',{p_id:PQD.sel,p_versao:PQD.versao,p_desde:PQD.desde});
      if(j.pesquisa&&PQD.p&&PQD.p.id!==j.pesquisa.id&&PQD.desde){
        /* a pesquisa ativa mudou: o que estava na tela era de outra, lê do começo */
        PQD.resp={};PQD.ac={};j=await rpc('pesquisa_dados',{p_id:PQD.sel,p_versao:null,p_desde:null});
      }
      if((PQD.p&&PQD.p.id)!==(j.pesquisa&&j.pesquisa.id)||(PQD.p&&j.pesquisa&&PQD.p.status!==j.pesquisa.status))PQD.mudou=true;
      PQD.p=j.pesquisa||null;
      pqUsaPerguntas(PQD.p&&PQD.p.perguntas);
      if(!PQD.p){PQD.cli=[];PQD.porCod={};PQD.resp={};PQD.ac={};PQD.versao=null;PQD.desde=null}
      else{
        if(j.clientes){PQD.cli=j.clientes;PQD.porCod={};j.clientes.forEach(c=>PQD.porCod[c.cod]=c);PQD.versao=PQD.p.versao;PQD.mudou=true}
        (j.respostas||[]).forEach(r=>{const a=PQD.resp[r.cod];if(!a||a.recebidoEm!==r.recebidoEm)PQD.mudou=true;PQD.resp[r.cod]=r});
        (j.acompanhamentos||[]).forEach(x=>{const a=PQD.ac[x.id];if(!a||a.atualizadoEm!==x.atualizadoEm)PQD.mudou=true;PQD.ac[x.id]=x});
        PQD.desde=j.agora||null;
      }
      PQD.estado='ok';PQD.erro='';
    }catch(e){
      if(e.semSessao)throw e;
      /* o banco ainda não tem as funções da pesquisa (falta rodar o r05) */
      PQD.estado=/Could not find the function|PGRST202/i.test(e.message)?'sembanco':'erro';PQD.erro=e.message;PQD.mudou=true;
    }finally{PQD.lendo=null}
  })();
  return PQD.lendo;
}
function pqRecarrega(tudo){return carregaPesquisa(tudo).then(()=>{pintaLado();pintaMainSe('pesquisa')}).catch(e=>{if(e.semSessao)sessaoCaiu()})}

/* as frases que resumem o que os clientes disseram */
function pqDestaques(fal){
  const d=[],r=k=>pqConta(fal,k);
  const add=(tom,num,txt,base)=>d.push('<div class="pqd '+tom+'"><b>'+num+'</b><p>'+txt+'</p><small>'+base+'</small></div>');
  const topo=(c,q)=>{const k=Object.keys(c.n).filter(x=>x!=='outro').sort((a,b)=>c.n[b]-c.n[a])[0];return k?esc(pqRot(q,k).toLowerCase()):''};
  let c=r('vend_freq');
  if(c.base){const x=(c.n.quase_nunca||0)+(c.n.nao_conhece||0);
    add(x/c.base>=.25?'n':x?'w':'p',fpct(pct(x,c.base)),'dizem que o consultor de vendas quase nunca aparece, ou não sabem quem ele é',x+' de '+c.base+' respostas')}
  c=r('vend_cumpre');
  if(c.base){const base=c.base-(c.n.nunca_prometeu||0),x=(c.n.raramente||0)+(c.n.as_vezes||0);
    if(base)add(x/base>=.3?'n':x?'w':'p',fpct(pct(x,base)),'contam que o consultor promete voltar e nem sempre volta',x+' de '+base+' que ouviram a promessa')}
  const comPedido=fal.filter(x=>x.r&&pqTemV(x.r.pedido_como));
  if(comPedido.length){const usam=comPedido.filter(x=>x.r.pedido_como.includes('band_togo')||x.r.app_tem==='usa').length,m=r('app_motivo'),t=m.base?topo(m,'app_motivo'):'';
    add(usam/comPedido.length>=.6?'p':usam/comPedido.length>=.3?'w':'n',fpct(pct(usam,comPedido.length)),'usam o BAND TOGO'+(t?'. Entre os que não usam, o motivo mais citado: <strong>'+t+'</strong>':''),usam+' de '+comPedido.length+' respostas')}
  c=r('p24');
  if(c.base){const m=r('p24_motivo'),x=c.n.participa||0,t=m.base?topo(m,'p24_motivo'):'';
    add('',fpct(pct(x,c.base)),'já participam do Projeto 24 Horas'+(t?'. Quem conhece e não participa diz: <strong>'+t+'</strong>':''),x+' de '+c.base+' respostas')}
  c=r('p24_interesse');
  if(c.n.sim)add('p',fmt(c.n.sim),(c.n.sim===1?'cliente quis':'clientes quiseram')+' entrar no 24 Horas depois da explicação do desenvolvedor','de '+c.base+' que não conheciam o projeto');
  c=r('intencao');
  if(c.base){const x=(c.n.reduzir||0)+(c.n.cancelar||0);
    add(x?'n':'p',fmt(x),(x===1?'cliente pensa':'clientes pensam')+' em reduzir as compras ou cancelar o cadastro',(c.n.cancelar||0)+' querem cancelar · '+(c.n.mais||0)+' querem comprar mais')}
  c=r('entrega');
  if(c.base){const x=(c.n.as_vezes||0)+(c.n.raramente||0);
    add(x/c.base>=.2?'n':x?'w':'p',fpct(pct(x,c.base)),'dizem que a entrega nem sempre chega no dia combinado',x+' de '+c.base+' respostas')}
  c=r('falta');
  if(c.base){const x=(c.n.frequente||0)+(c.n.as_vezes||0);
    add(x/c.base>=.3?'n':x?'w':'p',fpct(pct(x,c.base)),'tiveram falta de produto no pedido nos últimos 30 dias',(c.n.frequente||0)+' dizem que falta com frequência')}
  return d.length?'<div class="pqds">'+d.join('')+'</div>':'';
}
function pqCartaoPerg(q,rs){
  const id=q[0],tipo=q[2];
  if(tipo==='texto'){
    const l=rs.filter(r=>r.r&&pqTemV(r.r[id]));if(!l.length)return '';
    return '<div class="cartao larga"><div class="tt"><h2>'+esc(q[1])+'</h2><span>'+l.length+(l.length>12?' · os 12 mais recentes':'')+'</span></div><div class="cc"><div class="pqobs">'+
      l.slice(-12).reverse().map(r=>'<p><b>'+esc((PQD.porCod[r.cod]||{}).nome||r.cod)+'</b>'+esc(r.r[id])+'</p>').join('')+'</div></div></div>';
  }
  if(tipo==='nota'){
    const v=pqNums(rs,id);if(!v.length)return '';
    const h=new Array(11).fill(0);v.forEach(x=>{if(x>=0&&x<=10)h[Math.round(x)]++});const mx=Math.max(1,...h);
    return '<div class="cartao"><div class="tt"><h2>'+esc(q[1])+'</h2><span>'+v.length+' notas · média '+fmt1(pqMedia(v))+'</span></div><div class="cc" style="padding:26px 18px 34px"><div class="hist" style="height:110px">'+
      h.map((n,i)=>'<div style="height:'+(n/mx*100)+'%;background:'+(i<=6?'#E4002B':i<=8?'#F5A524':'#16A34A')+'" title="Nota '+i+': '+n+'">'+(n?'<b>'+n+'</b>':'')+'<span>'+i+'</span></div>').join('')+'</div></div></div>';
  }
  const c=pqConta(rs,id);if(!c.base)return '';
  const ops=(q[3]||[]).slice();Object.keys(c.n).forEach(k=>{if(!ops.find(o=>o[0]===k))ops.push([k,k])});
  const mx=Math.max(1,...ops.map(o=>c.n[o[0]]||0));
  const outros=rs.map(r=>r.r&&r.r[id+'_outro']).filter(Boolean);
  return '<div class="cartao"><div class="tt"><h2>'+esc(q[1])+'</h2><span>'+c.base+(c.base===1?' resposta':' respostas')+(tipo==='varias'?' · podia marcar mais de uma':'')+'</span></div><div class="cc">'+
    ops.map(o=>{const n=c.n[o[0]]||0;return lbar(esc(o[1]),n,mx,PQ_COR[o[2]||''],n+' · '+fpct(pct(n,c.base)))}).join('')+
    (outros.length?'<details><summary>Ver o que escreveram em "outro" ('+outros.length+')</summary><ul>'+outros.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul></details>':'')+'</div></div>';
}

/* Resultados de uma pesquisa com formulário próprio: um quadro por pergunta, com a contagem de cada
   opção, a média das notas ou os últimos textos. Só entram as respostas de quem falou com o responsável. */
function pqResProprio(cl){
  const N=cl.length,cods=new Set(cl.map(c=>c.cod)),rs=cl.map(c=>PQD.resp[c.cod]).filter(Boolean);
  const voltar=rs.filter(r=>PQ_VOLTAR.includes(r.situacao)),feitas=rs.filter(r=>!PQ_VOLTAR.includes(r.situacao)),fal=rs.filter(r=>r.situacao==='falou');
  const ab=pqAcs().filter(a=>cods.has(a.cod)&&pqAberto(a)),venc=ab.filter(pqVencido);
  let h='<div class="kpgs">'+pqKpisBase(cl,N,feitas,voltar)+
    pqKpiG('Falaram com o responsável',fmt(fal.length),feitas.length?fpct(pct(fal.length,feitas.length))+' das respondidas':'ainda sem respostas','',feitas.length?pqBarrinha(pct(fal.length,feitas.length)):'')+
    pqKpiAcomp(ab,venc)+'</div>';
  if(!rs.length)h+='<div class="info">Ainda não chegou nenhuma resposta'+(N<PQD.cli.length?' neste filtro':'')+'. Os números aparecem sozinhos conforme os desenvolvedores enviam pelo app.</div>';
  const barra=(rot,n,base,ruim)=>'<div class="fmres"><span>'+esc(rot)+'</span><div class="frbar"><i style="width:'+(base?Math.round(n/base*100):0)+'%'+(ruim?';background:var(--verm)':'')+'"></i></div><b>'+fmt(n)+' · '+(base?fpct(pct(n,base)):'—')+'</b></div>';
  h+='<h3 class="pqh">Pergunta a pergunta</h3><div class="pqgr">'+PQ_Q.slice(3).map((q,i)=>{
    const id=q[0],tipo=q[2],ops=q[3]||[];let corpo='',base=0;
    if(tipo==='nota'){const v=pqNums(fal,id);base=v.length;

let pqMapa=null;
function desenhaPqMapa(){
  const el=$('pqmapa');if(!el)return;

  if(pqMapa){try{pqMapa.remove()}catch(e){}pqMapa=null}
  pqMapa=L.map(el,{preferCanvas:true,zoomControl:true,attributionControl:true});
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,attribution:'Esri, HERE, Garmin'}).addTo(pqMapa);
  const ab={},pts=[];pqAcs().filter(pqAberto).forEach(a=>ab[a.cod]=(ab[a.cod]||0)+1);
  pqCliF().forEach(c=>{
    if(c.lat==null||c.lon==null||!isFinite(c.lat)||!isFinite(c.lon))return;
    const r=PQD.resp[c.cod];
    const est=!r?['#9CA3AF','a fazer']:ab[c.cod]?['#E4002B',ab[c.cod]+(ab[c.cod]===1?' acompanhamento aberto':' acompanhamentos abertos')]:
      PQ_VOLTAR.includes(r.situacao)?['#F5A524','para voltar']:r.situacao==='falou'?['#16A34A','respondida']:['#52525B',pqRot('situacao',r.situacao)];
    pts.push([c.lat,c.lon]);
    L.circleMarker([c.lat,c.lon],{radius:r?6:4,color:'#fff',weight:r?1.5:1,fillColor:est[0],fillOpacity:r?1:.8})
      .bindTooltip('<b>'+esc(c.nome)+'</b><br>'+esc(c.cod)+' · rota '+esc(c.rota)+'<br>'+esc(est[1]))

}

  const cods=new Set(pqCliF().map(c=>c.cod)),q=FPQ.q.trim().toLowerCase();

    if(!cods.has(a.cod))return false;

async function pqSalvaAc(id,box){

}

/* planilha que o Excel abre direto: ponto e vírgula, com acento */
function pqCsv(nome,cabecalho,linhas){
  const cel=v=>{let t=v==null?'':String(v);if(/^[=+\-@]/.test(t)&&isNaN(+t.replace(',','.')))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'};
  const txt='﻿'+[cabecalho].concat(linhas).map(l=>l.map(cel).join(';')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
  a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);
}

/* ---------- Campanha: a pesquisa atual, montar outra e as anteriores ---------- */
/* os clientes BAND da base, agrupados por rota (lidos uma vez por versão da base) */
function cliBand(){
  const b=D.base;if(!b||!b.C||!b.D)return null;
  if(D._cli&&D._cli.v===b.versao)return D._cli;
  const porRota={};
  for(const l of b.C.split('\n')){if(!l)continue;const p=l.split('|'),rt=b.D.rotas[+p[3]];if(rt==null)continue;(porRota[rt]=porRota[rt]||[]).push(p)}
  return D._cli={v:b.versao,porRota};
}
function nbRotas(){
  const dd=D.base.D,cb=cliBand();
  return dd.rotas.filter(r=>{const m=dd.meta[r]||{};return m.gc===NB.gc&&(!NB.sv||m.sv===NB.sv)&&(cb.porRota[r]||[]).length})
    .map(r=>({rota:r,m:dd.meta[r]||{},n:cb.porRota[r].length}));
}
/* divide as rotas entre os desenvolvedores ativos, deixando a quantidade de clientes parecida */
function nbDistribui(){
  const devs=D.devs.filter(d=>d.ativo).map(d=>d.login),carga={};devs.forEach(l=>carga[l]=0);
  NB.rotas={};
  nbRotas().sort((a,b)=>b.n-a.n).forEach(x=>{
    if(!devs.length){NB.rotas[x.rota]='';return}
    const l=devs.slice().sort((a,b)=>carga[a]-carga[b])[0];NB.rotas[x.rota]=l;carga[l]+=x.n});
}
function nbClientes(){
  const dd=D.base.D,cb=cliBand(),out=[];
  Object.keys(NB.rotas||{}).forEach(r=>{const m=dd.meta[r]||{};
    (cb.porRota[r]||[]).forEach(p=>out.push({cod:p[0],nome:p[9],lat:+((+p[1])/100000-20).toFixed(5),lon:+((+p[2])/100000-55).toFixed(5),rota:r,
      bairro:dd.bair[+p[4]]||'',cidade:dd.cidr[+p[5]]||'',seg:dd.segs[+p[6]]||'',consultor:m.cons||'',sv:m.sv||'',gc:m.gc||'',dev:NB.rotas[r]||''}))});
  return out;
}

    nbCorpo(p,false)+'</div></div>';
  if(PQD.lista.length>1||(PQD.lista.length&&!p))h+='<div class="cartao"><div class="tt"><h2>Todas as pesquisas</h2></div><table class="tab"><thead><tr><th>Pesquisa</th><th>Publicada</th><th>Situação</th><th class="num">Clientes</th><th class="num">Respostas</th><th class="num">Acomp. abertos</th><th></th></tr></thead><tbody>'+
    PQD.lista.map(x=>'<tr><td><b>'+esc(x.nome)+'</b><small>'+esc(x.escopo)+'</small></td><td>'+new Date(x.criadaEm).toLocaleDateString('pt-BR')+'</td><td><span class="selo '+(x.status==='ativa'?'v':'c')+'">'+(x.status==='ativa'?'Ativa':'Encerrada')+'</span></td>'+
      '<td class="num">'+fmt(x.clientes)+'</td><td class="num">'+fmt(x.respostas)+'</td><td class="num">'+fmt(x.acompanhamentos)+'</td><td>'+(p&&p.id===x.id?'<span style="color:var(--ink2)">na tela</span>':'<button class="bt peq" data-ver="'+esc(x.id)+'">Ver</button>')+'</td></tr>').join('')+'</tbody></table></div>';
  return h;
}
/* O miolo de montar uma pesquisa: perguntas, clientes e quem visita. Serve à aba Campanha da Pesquisa
   e ao "Nova frente" das Frentes de trabalho, que acrescenta o prazo e publica tudo de uma vez. */
function nbCorpo(p,naFrente){
  let h='';
  if(D.baseEstado!=='ok')h+=(D.baseEstado==='carregando'||!D.baseEstado?'<div class="carregando">Abrindo a base de clientes… <span class="passobase">'+esc(D.basePasso||'')+'</span></div>'
    :'<div class="aviso">Para montar a pesquisa o painel precisa da base'+(D.baseEstado==='erro'?', e não consegui abrir: '+esc(D.baseErro||'')+'. Clique em Atualizar ou recarregue a página.':'. Envie a base em <b>Base de dados</b>.')+'</div>');
  else if(!cliBand())h+='<div class="aviso">A base em uso não tem a lista de clientes BAND.</div>';
  else{
    const dd=D.base.D,doRec=r=>dd.meta[r]||{};

    if(!NB.gc||!gcs.includes(NB.gc)){NB.gc=gcs.includes('GC. G3')?'GC. G3':(gcs[0]||'');NB.sv='';NB.rotas=null}
    const svs=[...new Set(dd.rotas.filter(r=>doRec(r).gc===NB.gc).map(r=>doRec(r).sv).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR',{numeric:true}));
    if(NB.rotas===null){if(!NB.sv&&svs.includes('SV.G3.1'))NB.sv='SV.G3.1';nbDistribui()}
    if(NB.nomeAuto)NB.nome='Pesquisa '+NB.gc.replace(/^GC\.\s*/,'')+(NB.sv?' · '+NB.sv:'');
    const rs=nbRotas(),marc=rs.filter(x=>NB.rotas[x.rota]!==undefined),tot=marc.reduce((s,x)=>s+x.n,0),porDev={};
    marc.forEach(x=>{const k=NB.rotas[x.rota]||'';porDev[k]=(porDev[k]||0)+x.n});
    if(naFrente)h+='<div class="frpasso" style="margin-top:0"><b>1</b> Perguntas, clientes e quem visita</div>';
    h+='<div class="ajustes"><label>Gerência<select id="nbgc">'+gcs.map(x=>'<option'+(x===NB.gc?' selected':'')+'>'+esc(x)+'</option>').join('')+'</select></label>'+
      '<label>Supervisão<select id="nbsv"><option value="">Todas da gerência</option>'+svs.map(x=>'<option'+(x===NB.sv?' selected':'')+'>'+esc(x)+'</option>').join('')+'</select></label>'+
      '<label style="flex:1;min-width:260px">Nome da pesquisa<input id="nbnome" maxlength="120" style="width:100%" value="'+esc(NB.nome)+'"></label>'+
      /* as perguntas: o questionário padrão do app ou um formulário montado no módulo Formulários */
      '<label>Formulário (perguntas)<select id="nbform"><option value="">Pesquisa BAND (padrão)</option>'+
        FMD.lista.map(f=>'<option value="'+esc(f.id)+'"'+(NB.form===f.id?' selected':'')+'>'+esc(f.nome)+'</option>').join('')+'</select></label>'+
      '<button class="bt" id="nbauto">Dividir por igual</button></div>'+
      '<table class="tab" style="margin-top:14px"><thead><tr><th style="width:36px"><input type="checkbox" id="nbtodas" aria-label="Marcar todas"'+(marc.length===rs.length&&rs.length?' checked':'')+'></th><th>Rota</th><th>Consultor de vendas</th><th>Supervisão</th><th>Tipo</th><th class="num">Clientes</th><th>Quem visita</th></tr></thead><tbody>'+
      rs.map(x=>{const on=NB.rotas[x.rota]!==undefined;
        return '<tr><td><input type="checkbox" data-nbr="'+esc(x.rota)+'"'+(on?' checked':'')+' aria-label="Rota '+esc(x.rota)+'"></td><td><b>'+esc(x.rota)+'</b></td><td>'+esc(x.m.cons||'—')+'</td><td>'+esc(x.m.sv||'—')+'</td><td>'+esc(x.m.tipo||'—')+
          '</td><td class="num">'+fmt(x.n)+'</td><td>'+(on?pqSelDev('data-nbd="'+esc(x.rota)+'"',NB.rotas[x.rota]):'<span style="color:var(--ink3)">fora da pesquisa</span>')+'</td></tr>'}).join('')+'</tbody></table>'+
      '<div class="info" style="margin-top:14px"><b>'+marc.length+(marc.length===1?' rota':' rotas')+', '+fmt(tot)+' clientes.</b> '+

        '<br>A lista sai da base '+esc(D.base.versao)+'. Cada desenvolvedor vê só os clientes dele, por distância.</div>'+
      /* na frente nova, o prazo entra junto e tudo é publicado de uma vez */
      (naFrente?'<div class="frpasso"><b>2</b> Prazo</div><div class="ajustes">'+
          '<label>Começa em<input type="date" id="nbini" style="width:158px" value="'+esc(NB.inicio||'')+'"></label>'+

async function nbPublica(acrescenta){
  const cl=nbClientes(),ativa=PQD.lista.find(x=>x.status==='ativa'),nome=($('nbnome').value||'').trim();
  if(!cl.length)return toast('Marque pelo menos uma rota');
  if(cl.length>8000)return toast('São '+fmt(cl.length)+' clientes. O limite é 8.000 por vez: escolha uma supervisão.');
  if(!acrescenta&&!nome)return toast('Dê um nome para a pesquisa');
  /* publicando pela tela de Frentes: o prazo vai junto */
  const naFrente=!acrescenta&&MOD==='frentes'&&FRD.nova;
  /* pela tela de Frentes dá para publicar sem encerrar as pesquisas que já estão em campo */
  const manter=naFrente&&NB.manter;
  if(naFrente&&NB.inicio&&NB.prazo&&NB.prazo<NB.inicio)return toast('O prazo final não pode ser antes do começo');
  const semDev=cl.filter(c=>!c.dev).length;
  const form=acrescenta?null:(FMD.lista.find(f=>f.id===NB.form)||null);
  const msg=(acrescenta?'Acrescentar '+fmt(cl.length)+' clientes à pesquisa "'+ativa.nome+'"?\n\nQuem já está nela continua, com as respostas guardadas.'
      :'Publicar a pesquisa "'+nome+'" com '+fmt(cl.length)+' clientes?\n\nPerguntas: '+(form?'formulário "'+form.nome+'" ('+form.perguntas.length+(form.perguntas.length===1?' pergunta)':' perguntas)'):'Pesquisa BAND (padrão)')+'.'+
        (naFrente?'\nPrazo: '+(NB.inicio?'começa em '+frBR(NB.inicio):'sem data de começo')+', '+(NB.prazo?'termina em '+frBR(NB.prazo):'sem prazo final')+(NB.foco?'. Vira o foco agora.':'.'):'')+
        (ativa?(manter?'\n\nA pesquisa "'+ativa.nome+'" continua ativa: o time fica com mais de uma frente de pesquisa.'
                      :'\n\nA pesquisa "'+ativa.nome+'" será encerrada. As respostas dela ficam guardadas.'):''))+
    '\n\nOs desenvolvedores recebem a lista na próxima sincronização do app.'+
    (semDev?'\n\nAtenção: '+fmt(semDev)+' clientes estão sem desenvolvedor e não aparecem em nenhum app.':'');
  if(!confirm(msg))return;
  const b=$(acrescenta?'nbadd':'nbpub');b.disabled=true;b.textContent='Enviando…';
  try{
    if(acrescenta)await rpc('pesquisa_ajustar',{p_id:ativa.id,p_mudanca:{clientes:cl}});
    else{
      /* a pesquisa leva uma cópia das perguntas do formulário escolhido; sem formulário, vale o questionário padrão do app */
      const pp={nome,escopo:NB.gc+(NB.sv?' / '+NB.sv:''),baseVersao:D.base.versao,clientes:cl};
      if(form){pp.formulario=form.id;pp.perguntas=form.perguntas}
      if(manter)pp.manter=true;
      const j=await rpc('pesquisa_publicar',{p_pesquisa:pp});
      if(naFrente){
        /* a frente nova entra na lista com as datas; marcada como foco, vai para o primeiro lugar */
        PQD.sel=null;await carregaPesquisa(true);
        const l=frLista(),nova=l.find(f=>f.id===(j&&j.id));
        if(nova){nova.inicio=NB.inicio||'';nova.prazo=NB.prazo||'';
          l.splice(l.indexOf(nova),1);if(NB.foco)l.unshift(nova);else l.push(nova)}
        FRD.nova=false;NB.nomeAuto=true;NB.prazo='';NB.foco=false;
        pintaLado();$('main').scrollTop=0;
        return frSalva(l,'Frente "'+nome+'" publicada');
      }
    }
    PQD.sel=null;FPQ.aba='camp';await pqRecarrega(true);$('main').scrollTop=0;
    toast(acrescenta?'Clientes acrescentados à pesquisa':'Pesquisa publicada');
  }catch(e){if(e.semSessao)return sessaoCaiu();toast('Não consegui publicar: '+e.message);pintaMainSe('pesquisa');pintaMainSe('frentes')}
}
async function pqAjusta(mudanca,feito){
  try{await rpc('pesquisa_ajustar',{p_id:PQD.p.id,p_mudanca:mudanca});await pqRecarrega(true);toast(feito)}
  catch(e){if(e.semSessao)return sessaoCaiu();toast('Não consegui salvar: '+e.message)}
}
