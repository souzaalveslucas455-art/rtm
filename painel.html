<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Band Desenvolvedores</title>
<meta name="theme-color" content="#1F2023">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --verm:#E4002B; --verm-esc:#B80022; --verm-bg:#FDE7EC;
  --ink:#1A1D21; --ink2:#5B6270; --ink3:#9CA3AF; --linha:#E5E7EB; --papel:#FFF; --fundo:#F1F2F4;
  --lado:#1F2023; --lado2:#2B2C30; --lado-txt:#C9CBD1;
  --verde:#0F7A52; --verde-bg:#E6F4EE; --amb:#96620F; --amb-bg:#FDF2DC; --azul:#1E6FD9; --azul-bg:#E9F1FC;
  --teal:#2F7F86; --teal-bg:#DCEEF0; --roxo:#6D4BC4; --roxo-bg:#F0EBFB;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--fundo);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.esc{display:none!important}

/* ---------- entrada ---------- */
#entrada{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(360px,.9fr);background:var(--lado)}
#entrada .lado{position:relative;overflow:hidden;padding:56px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;
  background:radial-gradient(120% 90% at 0% 100%,#5a0a19 0%,rgba(90,10,25,0) 60%),linear-gradient(160deg,#1F2023 0%,#141518 100%)}
#entrada .lado .lg{width:46px;height:46px;border-radius:12px;background:var(--verm);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:17px}
#entrada .lado h1{font-size:46px;line-height:1.04;margin:0;letter-spacing:-.02em;max-width:12ch}
#entrada .lado h1 span{color:#ff5a6e}
#entrada .lado p{color:#b9bcc4;max-width:46ch;line-height:1.55;margin:18px 0 0}
#entrada .lado small{color:#7d818b}
#entrada .form{background:var(--papel);display:flex;flex-direction:column;justify-content:center;padding:56px}
#entrada .form h2{margin:0 0 6px;font-size:22px} #entrada .form .sub{color:var(--ink2);margin:0 0 26px}
#entrada label{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}
#entrada input{width:100%;border:1px solid var(--linha);border-radius:10px;padding:12px 13px;background:#fff}
#entrada .bt{width:100%;margin-top:22px;padding:12px}
#entrada .erro{background:var(--verm-bg);color:var(--verm-esc);border-radius:10px;padding:10px 12px;margin-bottom:6px;font-size:13px}
@media(max-width:820px){#entrada{grid-template-columns:1fr}#entrada .lado{display:none}}

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);height:100%}
aside{background:var(--lado);color:var(--lado-txt);display:flex;flex-direction:column;overflow-y:auto}
.marca{display:flex;gap:10px;align-items:center;padding:18px 16px;border-bottom:1px solid #303136}
.marca .lg{width:34px;height:34px;border-radius:9px;background:var(--verm);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.marca b{color:#fff;display:block;font-size:15px} .marca small{font-size:12px}
nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px}
nav .grupo{font-size:11px;color:#80838c;padding:12px 12px 4px;font-weight:600}
nav button{position:relative;display:flex;gap:11px;align-items:center;text-align:left;border:none;background:none;color:var(--lado-txt);padding:9px 12px;border-radius:9px;cursor:pointer;font-size:14px;line-height:1.25}
nav button:hover{background:var(--lado2)}
nav button[aria-current="page"]{background:var(--lado2);color:#fff;font-weight:600}
nav button[aria-current="page"]::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--verm)}
nav button.breve{opacity:.55}
nav button .tag{margin-left:auto;font-size:10.5px;border:1px solid #45474d;border-radius:8px;padding:0 6px;color:#9a9da5}
nav svg{flex:none;opacity:.85}
nav .n{margin-left:auto;background:var(--verm);color:#fff;font-size:11.5px;font-weight:700;border-radius:10px;padding:1px 7px}
.hoje{margin:auto 10px 12px;background:var(--verm);color:#fff;border-radius:14px;padding:14px}
.hoje .top{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.hoje .pill{background:rgba(255,255,255,.22);border-radius:12px;padding:2px 9px;font-weight:700}
.hoje h3{margin:8px 0 2px;font-size:14px;font-weight:600}
.hoje .big{font-size:30px;font-weight:800;line-height:1.05}
.hoje .big small{font-size:14px;font-weight:600;opacity:.9}
.hoje .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.hoje .mini div{background:rgba(0,0,0,.18);border-radius:9px;text-align:center;padding:7px 2px}
.hoje .mini b{display:block;font-size:17px} .hoje .mini span{font-size:11px;opacity:.9}
.quem{padding:10px 16px 16px;font-size:12px;color:#8d9099;display:flex;justify-content:space-between;gap:8px}
.quem button{background:none;border:none;color:#cfd1d6;cursor:pointer;padding:0;text-decoration:underline}

main{overflow-y:auto;min-width:0}
.cab{background:var(--papel);border-bottom:1px solid var(--linha);padding:16px 26px;display:flex;gap:16px;align-items:flex-start;position:sticky;top:0;z-index:5}
.cab h1{margin:0;font-size:19px} .cab p{margin:3px 0 0;color:var(--ink2);font-size:13px}
.cab .acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.bt{border:1px solid var(--linha);background:var(--papel);border-radius:9px;padding:8px 13px;font-weight:600;cursor:pointer;white-space:nowrap}
.bt.escuro{background:var(--ink);color:#fff;border-color:var(--ink)}
.bt.verm{background:var(--verm);color:#fff;border-color:var(--verm)}
.bt.peq{padding:5px 10px;font-size:13px}
.bt:disabled{opacity:.5;cursor:default}
.corpo{padding:22px 26px 40px;display:flex;flex-direction:column;gap:18px}

/* filtros */
.filtros{background:var(--papel);border-bottom:1px solid var(--linha);padding:12px 26px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.filtros label{display:flex;flex-direction:column;gap:5px;font-size:11.5px;font-weight:700;color:var(--ink2)}
.filtros select,.filtros input{border:1px solid var(--linha);border-radius:9px;padding:7px 10px;background:#fff;font-weight:500;color:var(--ink);min-width:150px}
.filtros input[type=search]{min-width:240px}

/* cartoes e numeros */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--papel);border:1px solid var(--linha);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font-size:26px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi span{color:var(--ink2);font-size:12.5px}
.kpi.v b{color:var(--verm)} .kpi.g b{color:var(--verde)} .kpi.a b{color:var(--azul)}
.cartao{background:var(--papel);border:1px solid var(--linha);border-radius:14px}
.cartao>.tt{padding:14px 18px;border-bottom:1px solid var(--linha);display:flex;gap:10px;align-items:center}
.cartao>.tt h2{margin:0;font-size:15px} .cartao>.tt span{color:var(--ink2);font-size:12.5px}
.cartao>.tt .acoes{margin-left:auto;display:flex;gap:8px}
.cartao>.cc{padding:16px 18px}
.vazio{color:var(--ink2);text-align:center;padding:36px 16px}
.aviso{background:var(--amb-bg);color:var(--amb);border-radius:10px;padding:10px 12px;font-size:13px}
.info{background:var(--azul-bg);color:#174f99;border-radius:10px;padding:10px 12px;font-size:13px}
.ok{background:var(--verde-bg);color:var(--verde);border-radius:10px;padding:10px 12px;font-size:13px}

/* tabela */
.tab{width:100%;border-collapse:collapse;font-size:13.5px}
.tab th{text-align:left;font-size:11.5px;color:var(--ink2);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--linha);background:#FAFAFB;position:sticky;top:0}
.tab td{padding:10px 12px;border-bottom:1px solid #F0F1F3;vertical-align:middle}
.tab tr.clic{cursor:pointer} .tab tr.clic:hover td{background:#FAFAFB}
.tab .num{text-align:right;font-variant-numeric:tabular-nums}
.tab small{color:var(--ink2);display:block}
.rolagem{overflow:auto;max-height:calc(100vh - 330px)}
.selo{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.selo.v{background:var(--verde-bg);color:var(--verde)} .selo.a{background:var(--amb-bg);color:var(--amb)}
.selo.r{background:var(--verm-bg);color:var(--verm-esc)} .selo.c{background:#EEF0F3;color:var(--ink2)} .selo.b{background:var(--azul-bg);color:var(--azul)}

/* desenvolvedores */
.devs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.dev{background:var(--papel);border:1px solid var(--linha);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.dev .top{display:flex;gap:12px;align-items:center}
.dev .av{width:46px;height:46px;border-radius:12px;background:var(--lado);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.dev.off .av{background:#9CA3AF}
.dev input{border:1px solid transparent;border-radius:8px;padding:4px 6px;margin-left:-6px;font-weight:700;font-size:16px;width:100%;background:transparent}
.dev input:hover{border-color:var(--linha)} .dev input:focus{border-color:var(--azul);background:#fff}
.dev .lin{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);border-top:1px dashed var(--linha);padding-top:8px}
.dev .lin b{color:var(--ink);font-weight:600}
.dev .bts{display:flex;gap:8px;flex-wrap:wrap}

/* mensagens */
.msgs{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:18px;align-items:start}
.campo{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.campo label{font-size:12.5px;font-weight:700;color:var(--ink2)}
.campo input,.campo textarea,.campo select{border:1px solid var(--linha);border-radius:9px;padding:9px 11px;background:#fff}
.campo textarea{min-height:110px;resize:vertical}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{display:flex;gap:14px;padding:14px 18px;border-bottom:1px solid #F0F1F3}
.msg:last-child{border-bottom:none}
.msg img{width:84px;height:84px;object-fit:cover;border-radius:10px;background:#EEF0F3;flex:none}
.msg h3{margin:0 0 3px;font-size:14.5px} .msg p{margin:0;color:var(--ink2);white-space:pre-wrap}
.msg .meta{font-size:12px;color:var(--ink3);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}
.msg .rec{margin-left:auto;text-align:right;flex:none;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.barra{height:6px;border-radius:6px;background:#EEF0F3;overflow:hidden;width:120px}
.barra span{display:block;height:100%;background:var(--verde)}
@media(max-width:1100px){.msgs{grid-template-columns:1fr}}

/* ficha da visita */
#dlg{position:fixed;inset:0;background:rgba(15,16,19,.55);display:none;align-items:stretch;justify-content:flex-end;z-index:20}
#dlg.on{display:flex}
#dlg .folha{width:min(560px,100%);background:var(--papel);overflow-y:auto;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
#dlg .folha .tt{position:sticky;top:0;background:var(--papel);padding:16px 20px;border-bottom:1px solid var(--linha);display:flex;gap:12px;align-items:flex-start}
#dlg .folha .tt h2{margin:0;font-size:17px} #dlg .folha .tt p{margin:3px 0 0;color:var(--ink2);font-size:13px}
#dlg .folha .tt button{margin-left:auto}
#dlg .foto{width:100%;max-height:360px;object-fit:cover;background:#EEF0F3;display:block}
#dlg dl{display:grid;grid-template-columns:150px 1fr;margin:0;padding:8px 20px 24px}
#dlg dt{color:var(--ink2);font-size:13px;padding:8px 0;border-bottom:1px solid #F0F1F3}
#dlg dd{margin:0;padding:8px 0;border-bottom:1px solid #F0F1F3;font-weight:500}

/* modulo em construcao */
.breve-c{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.breve-c .cartao{padding:18px}
.breve-c h3{margin:0 0 6px;font-size:15px} .breve-c p{margin:0;color:var(--ink2);line-height:1.5}

#moldura{position:fixed;left:240px;right:0;top:0;bottom:0;background:#fff;z-index:4}
#moldura iframe{border:0;width:100%;height:100%;display:block}
/* ---------- Dashboards: visual escuro de apresentação ---------- */
.dk{background:#0B0B0C;color:#F4F4F5;border-radius:18px;padding:34px 38px 30px;position:relative;overflow:hidden}
.dk::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 70% at 100% 0%,rgba(228,0,43,.16),transparent 60%);pointer-events:none}
.dk>*{position:relative}
.dk .pill{display:inline-flex;align-items:baseline;gap:12px;background:#C8102E;border-radius:8px;padding:8px 16px}
.dk .pill b{font-weight:800;letter-spacing:.06em;font-size:17px}
.dk .pill span{font-size:14px;color:#FFE3E8}
.dk .topo{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin:16px 0 26px}
.dk h2{margin:0;font-size:46px;line-height:1.08;font-weight:800;letter-spacing:-.025em;max-width:20ch}
.dk h2 em{font-style:normal;color:#FF5A5F}
.dk .ks{display:flex;gap:12px}
.dk .k{background:#141416;border:1px solid #26262A;border-radius:14px;padding:14px 20px;text-align:right;min-width:150px}
.dk .k b{display:block;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.dk .k span{font-size:13px;color:#A1A1AA}
.dk .k.meta{border-color:#5B1220;background:#160A0D} .dk .k.meta b{color:#4ADE80}
.dk .tb{background:#111113;border:1px solid #232327;border-radius:16px;padding:6px 22px 10px}
.dk table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.dk th{font-size:12px;letter-spacing:.08em;color:#A1A1AA;text-align:left;font-weight:700;padding:16px 10px 12px;border-bottom:1px solid #27272A}
.dk th.n,.dk td.n{text-align:right}
.dk td{padding:13px 10px;border-bottom:1px solid #1F1F23;font-size:16px;color:#E4E4E7}
.dk td.cid{font-weight:800;font-size:17px;color:#fff}
.dk td.pm{font-weight:800;color:#fff}
.dk tr.lin{cursor:pointer} .dk tr.lin:hover td{background:#18181B}
.dk .gap{position:relative;height:26px;border-radius:7px;background:#2A2A2E;overflow:hidden;min-width:200px}
.dk .gap i{position:absolute;left:0;top:0;bottom:0;background:#C00000;border-radius:7px}
.dk .gap b{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:14px;font-weight:800;color:#fff}
.dk .st{display:block;text-align:center;border:1px solid;border-radius:7px;padding:5px 8px;font-size:13px;font-weight:700;white-space:nowrap}
.dk .st.baixo{color:#FF6B6B;border-color:#B42318} .dk .st.ab{color:#F5A524;border-color:#B45309}
.dk .st.ac{color:#7CB4FF;border-color:#1D4ED8} .dk .st.top{color:#4ADE80;border-color:#15803D}
.dk tfoot td{border-bottom:none;font-weight:800;font-size:17px;padding-top:16px}
.dk tfoot .tot{color:#FF5A5F;font-size:24px;text-align:right}
.dk .rod{margin-top:14px;font-size:12.5px;color:#71717A;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dk:fullscreen{border-radius:0;padding:5vh 6vw;overflow:auto;display:flex;flex-direction:column;justify-content:center}
.dk:fullscreen h2{font-size:clamp(46px,4.4vw,72px)}
.dk:fullscreen td{font-size:clamp(16px,1.25vw,22px)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.gal button{text-align:left;border:1px solid var(--linha);background:var(--papel);border-radius:14px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:92px}
.gal button:hover{border-color:#c9ccd3}
.gal button[aria-pressed="true"]{background:#0B0B0C;border-color:#0B0B0C;color:#fff}
.gal button[aria-pressed="true"] small{color:#A1A1AA}
.gal button span{font-size:12.5px;font-weight:700;color:var(--ink2)} .gal button[aria-pressed="true"] span{color:#FF8A95}
.gal button b{font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.gal button small{font-size:12px;color:var(--ink2);line-height:1.3}
.dk .nav{position:absolute;top:30px;right:34px;display:none;gap:8px;z-index:2}
.dk:fullscreen .nav{display:flex}
.dk .nav button{background:#1C1C20;border:1px solid #2E2E33;color:#E4E4E7;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer}
.dk .nav span{align-self:center;color:#71717A;font-size:13px;margin-right:6px}
.dk .grade2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.dk .bloco{background:#111113;border:1px solid #232327;border-radius:16px;padding:18px 22px}
.dk .bloco h3{margin:0 0 14px;font-size:13px;letter-spacing:.08em;color:#A1A1AA;font-weight:700}
.dk .hb{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 84px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid #1C1C20;font-size:15px}
.dk .hb:last-child{border-bottom:none}
.dk .hb .nm{font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk .hb .tr{height:22px;border-radius:6px;background:#26262A;overflow:hidden;display:flex}
.dk .hb .tr i{display:block;height:100%}
.dk .hb .vl{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.dk .hb small{display:block;font-weight:500;color:#8E8E96;font-size:12px}
.dk .rosca{width:190px;height:190px;border-radius:50%;margin:4px auto 16px;position:relative}
.dk .rosca::after{content:"";position:absolute;inset:34px;border-radius:50%;background:#111113}
.dk .rosca b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;font-size:28px;font-weight:800}
.dk .rosca b small{font-size:12px;color:#A1A1AA;font-weight:600}
.dk .leg{display:grid;gap:7px;font-size:14px}
.dk .leg div{display:flex;gap:9px;align-items:center} .dk .leg i{width:11px;height:11px;border-radius:3px;flex:none}
.dk .leg span{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
.dk .devs3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.dk .dv b.n{font-size:34px;font-weight:800;display:block;line-height:1.1}
.dk .dv .pr{height:10px;border-radius:6px;background:#26262A;overflow:hidden;margin:10px 0 6px}
.dk .dv .pr i{display:block;height:100%;background:#22C55E}
.dk .dv dl{display:grid;grid-template-columns:1fr auto;gap:5px 10px;margin:12px 0 0;font-size:14px}
.dk .dv dt{color:#A1A1AA} .dk .dv dd{margin:0;font-weight:700;text-align:right}
.dk .vazio2{border:1px dashed #33333A;border-radius:16px;padding:46px 30px;text-align:center;color:#A1A1AA;font-size:16px;line-height:1.6}
.dk .vazio2 b{display:block;color:#fff;font-size:20px;margin-bottom:6px}
.dk .sub2{color:#A1A1AA;font-size:15px;margin:-12px 0 22px;max-width:90ch}
.dk tr.sv td{font-size:14px;color:#C4C4CC} .dk tr.sv td.cid{font-weight:600;font-size:14px;padding-left:28px;color:#D4D4D8}
@media(max-width:1100px){.dk .grade2{grid-template-columns:1fr}}
.ajustes{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.ajustes label{display:flex;flex-direction:column;gap:5px;font-size:11.5px;font-weight:700;color:var(--ink2)}
.ajustes input,.ajustes select{border:1px solid var(--linha);border-radius:9px;padding:7px 10px;background:#fff;width:120px}
.ajustes select{width:auto}
.cidlista{columns:4 220px;margin-top:12px;max-height:340px;overflow:auto;border:1px solid var(--linha);border-radius:10px;padding:10px 12px;font-size:13px}
.cidlista label{display:flex;gap:7px;align-items:center;padding:3px 0;break-inside:avoid;font-weight:500;color:var(--ink)}
.cidlista small{color:var(--ink3);margin-left:auto}

<script>
/* ============================================================================
   Painel Band Desenvolvedores (RTM)
   Fala com o banco do RTM no Supabase do merch. A chave abaixo é a publicável:
   o que protege os dados é o login do coordenador e as regras do banco.
   Tudo o que este painel guarda no navegador usa chaves com o prefixo rtm_painel_.
   ============================================================================ */
const VERSAO='1.0.0';
const SUPA={url:'https://kqpdledhaghuzuwjkvrf.supabase.co',chave:'sb_publishable_dMdB5b_G5X5TnXemexGIXQ_GWXS6cid'};
const K_SESSAO='rtm_painel_sessao',K_EMAIL='rtm_painel_email';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(+n||0).toLocaleString('pt-BR');
const fmt1=n=>(+n||0).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),3200)}

/* ---------------- servidor ---------------- */
let SESSAO=null;try{SESSAO=JSON.parse(localStorage.getItem(K_SESSAO)||'null')}catch(e){}
function guardaSessao(j){
  SESSAO=j?{access_token:j.access_token,refresh_token:j.refresh_token,expira:Date.now()+((+j.expires_in||3600)*1000)}:null;
  try{SESSAO?localStorage.setItem(K_SESSAO,JSON.stringify(SESSAO)):localStorage.removeItem(K_SESSAO)}catch(e){}
}
function erroDe(j,status){
  const m=String((j&&(j.message||j.msg||j.error_description||j.error))||('erro '+status));
  if(/Invalid login credentials|invalid_credentials|invalid_grant/i.test(m))return 'E-mail ou senha incorretos.';
  return m;
}
async function pede(caminho,opc){
  let r;try{r=await fetch(SUPA.url+caminho,opc)}catch(e){throw new Error('Sem conexão com o servidor.')}
  const t=r.headers.get('content-type')||'';
  if(opc&&opc.binario&&r.ok)return {ok:true,status:r.status,buf:await r.arrayBuffer()};
  const x=await r.text();let j=null;try{j=x?JSON.parse(x):null}catch(e){}
  return {ok:r.ok,status:r.status,j,t:x};
}
function semSessao(){const e=new Error('Sua sessão expirou. Entre de novo.');e.semSessao=true;return e}
async function autentica(email,senha){
  const r=await pede('/auth/v1/token?grant_type=password',{method:'POST',
    headers:{apikey:SUPA.chave,'Content-Type':'application/json'},body:JSON.stringify({email,password:senha})});
  if(!r.ok)throw new Error(erroDe(r.j,r.status));
  guardaSessao(r.j);
}
let renovando=null;
function renova(){
  if(renovando)return renovando;
  if(!SESSAO||!SESSAO.refresh_token)return Promise.reject(semSessao());
  renovando=pede('/auth/v1/token?grant_type=refresh_token',{method:'POST',
      headers:{apikey:SUPA.chave,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:SESSAO.refresh_token})})
    .then(r=>{if(r.ok){guardaSessao(r.j);return}
      const g=sessaoGuardada();if(g&&g.expira>Date.now()+60000){SESSAO=g;return}
      if(r.status>=400&&r.status<500){guardaSessao(null);throw semSessao()}
      throw new Error(erroDe(r.j,r.status))})
    .finally(()=>{renovando=null});
  return renovando;
}
function sessaoGuardada(){try{return JSON.parse(localStorage.getItem(K_SESSAO)||'null')}catch(e){return null}}
async function token(){
  /* o mapa, aberto dentro do painel, usa a mesma sessão e pode tê-la renovado antes */
  const g=sessaoGuardada();if(g&&(!SESSAO||g.expira>SESSAO.expira))SESSAO=g;
  if(!SESSAO)throw semSessao();if(Date.now()>SESSAO.expira-60000)await renova();return SESSAO.access_token}
async function rpc(nome,args,tentou){
  const tk=await token();
  const r=await pede('/rest/v1/rpc/'+nome,{method:'POST',headers:{apikey:SUPA.chave,Authorization:'Bearer '+tk,
    'Content-Type':'application/json','Content-Profile':'rtm','Accept-Profile':'rtm'},body:JSON.stringify(args||{})});
  if(r.status===401&&!tentou){await renova();return rpc(nome,args,true)}
  if(r.status===401){guardaSessao(null);throw semSessao()}
  if(!r.ok)throw new Error(erroDe(r.j,r.status));
  return r.j;
}
const caminhoUrl=c=>String(c).split('/').map(encodeURIComponent).join('/');
async function sobe(balde,caminho,corpo,tipo,trocar,tentou){
  const tk=await token();
  const r=await pede('/storage/v1/object/'+balde+'/'+caminhoUrl(caminho),{method:'POST',
    headers:{apikey:SUPA.chave,Authorization:'Bearer '+tk,'Content-Type':tipo,'x-upsert':trocar?'true':'false'},body:corpo});
  if(r.ok)return true;
  if(!tentou&&r.status===401){await renova();return sobe(balde,caminho,corpo,tipo,trocar,true)}
  throw new Error(erroDe(r.j,r.status));
}
async function baixa(balde,caminho){
  const tk=await token();
  const r=await pede('/storage/v1/object/authenticated/'+balde+'/'+caminhoUrl(caminho),
    {headers:{apikey:SUPA.chave,Authorization:'Bearer '+tk},binario:true});
  if(!r.ok){const e=new Error(r.status===400||r.status===404?'arquivo não encontrado':erroDe(r.j,r.status));e.status=r.status;throw e}
  return r.buf;
}
/* fotos privadas: link que vale 1 hora */
const ASSIN={};
async function linkFoto(cam){
  const a=ASSIN[cam];if(a&&a.ate>Date.now())return a.url;
  const tk=await token();
  const r=await pede('/storage/v1/object/sign/rtm-fotos/'+caminhoUrl(cam),{method:'POST',
    headers:{apikey:SUPA.chave,Authorization:'Bearer '+tk,'Content-Type':'application/json'},body:JSON.stringify({expiresIn:3600})});
  const u=r.ok&&r.j&&(r.j.signedURL||r.j.signedUrl);
  if(!u)return '';
  const url=/^https?:/.test(u)?u:SUPA.url+'/storage/v1'+u;
  ASSIN[cam]={url,ate:Date.now()+50*60000};return url;
}
function fotoDaVisita(v){
  if(v.fotoCaminho)return linkFoto(v.fotoCaminho);
  const t=String(v.fotoUrl||''),m=t.match(/[-\w]{25,}/);
  if(/drive\.google\.com|googleusercontent/.test(t)&&m)return Promise.resolve('https://drive.google.com/thumbnail?id='+m[0]+'&sz=w1200');
  return Promise.resolve(t);
}

/* ---------------- entrada ---------------- */
function telaEntrada(erro){
  $('app').classList.add('esc');$('entrada').classList.remove('esc');
  $('entrada').innerHTML=
   '<div class="lado"><div class="lg">BD</div>'+
     '<div><h1>Cada PDV sem cadastro é um <span>cliente esperando</span>.</h1>'+
     '<p>Roteiros, visitas, fotos e mensagens dos desenvolvedores comerciais num lugar só, '+
     'ligados à base da Receita e aos clientes BAND de Goiás e Tocantins.</p></div>'+
     '<small>Painel Band Desenvolvedores · versão '+VERSAO+'</small></div>'+
   '<div class="form"><h2>Entrar no painel</h2><p class="sub">Use a conta de coordenador.</p>'+
     (erro?'<div class="erro">'+esc(erro)+'</div>':'')+
     '<label for="em">E-mail</label><input id="em" type="email" autocomplete="username" value="'+esc(EMAIL_DIGITADO||localStorage.getItem(K_EMAIL)||'')+'">'+
     '<label for="se">Senha</label><input id="se" type="password" autocomplete="current-password">'+
     '<button class="bt verm" id="bentra">Entrar</button></div>';
  $('bentra').onclick=entrar;$('se').onkeydown=e=>{if(e.key==='Enter')entrar()};
  ($('em').value?$('se'):$('em')).focus();
}
let EMAIL_DIGITADO='';
async function entrar(){
  const em=$('em').value.trim().toLowerCase(),se=$('se').value;
  EMAIL_DIGITADO=em;
  if(!em||!se)return telaEntrada('Preencha e-mail e senha.');
  const b=$('bentra');b.disabled=true;b.textContent='Entrando…';
  try{
    await autentica(em,se);
    const q=await rpc('quem_sou');
    if(q.papel!=='coordenador'){await sai();return telaEntrada('Esta conta não é de coordenador. Os desenvolvedores usam o app.')}
    try{localStorage.setItem(K_EMAIL,em)}catch(e){}
    EU=q;abreApp();
  }catch(e){if(SESSAO)await sai();telaEntrada(e.message)}
}
async function sai(){
  const tk=SESSAO&&SESSAO.access_token;guardaSessao(null);
  if(tk)pede('/auth/v1/logout',{method:'POST',headers:{apikey:SUPA.chave,Authorization:'Bearer '+tk}}).catch(()=>{});
}
function sessaoCaiu(){telaEntrada('Sua sessão expirou. Entre de novo.')}

/* ---------------- dados ---------------- */
let EU=null,MOD=location.hash.slice(1)||'visitas';
const D={devs:[],visitas:[],visDesde:null,visCnpj:null,msgs:[],roteiros:[],base:null,baseInfo:null,carregou:{}};
async function carregaDevs(){D.devs=(await rpc('desenvolvedores_lista')).desenvolvedores||[];D.carregou.devs=true}
async function carregaRoteiros(){D.roteiros=(await rpc('roteiros')).roteiros||[];D.carregou.roteiros=true}
async function carregaMsgs(){D.msgs=(await rpc('mensagens_painel')).mensagens||[];D.carregou.msgs=true}
/* visitas em paginas de 5.000; depois da primeira vez, so o que chegou de novo */
async function carregaVisitas(){
  const porCnpj={};D.visitas.forEach((v,i)=>porCnpj[v.cnpj]=i);
  for(let volta=0;volta<200;volta++){
    const j=await rpc('visitas_todas',{p_desde:D.visDesde,p_cnpj:D.visCnpj});
    (j.visitas||[]).forEach(v=>{if(porCnpj[v.cnpj]!=null)D.visitas[porCnpj[v.cnpj]]=v;else{porCnpj[v.cnpj]=D.visitas.length;D.visitas.push(v)}});
    if(j.proximoDesde){D.visDesde=j.proximoDesde;D.visCnpj=j.proximoCnpj}
    if(!j.temMais)break;
  }
  D.carregou.visitas=true;
}
async function atualizaTudo(silencioso){
  try{
    await Promise.all([carregaDevs(),carregaRoteiros(),carregaVisitas(),carregaMsgs()]);
    pintaLado();pintaMain();if(!silencioso)toast('Atualizado');
  }catch(e){if(e.semSessao)return sessaoCaiu();toast('Não consegui atualizar: '+e.message)}
}

/* ---------------- base (fica fora do arquivo, na pasta privada rtm-base) ---------------- */
const IDB_NOME='rtm_painel';
function idb(){return new Promise((ok,erro)=>{const r=indexedDB.open(IDB_NOME,1);
  r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>erro(r.error)})}
async function idbLe(k){const db=await idb();return new Promise(ok=>{const t=db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>ok(t.result);t.onerror=()=>ok(null)})}
async function idbGrava(k,v){const db=await idb();return new Promise(ok=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>ok(true);t.onerror=()=>ok(false)})}
async function abreGz(buf){
  const u8=new Uint8Array(buf);
  if(u8[0]===0x1f&&u8[1]===0x8b){
    const s=new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
    return JSON.parse(await new Response(s).text());
  }
  return JSON.parse(new TextDecoder().decode(u8));
}
function resumoBase(b){
  const est=b.R?b.R.split('\n').filter(Boolean).length:0,cli=b.C?b.C.split('\n').filter(Boolean).length:0;
  return {versao:b.versao,descricao:b.descricao||'',estabelecimentos:est,clientes:cli,
    rotas:(b.D&&b.D.rotas||[]).length,municipiosPop:(b.populacao&&b.populacao.municipios||[]).length};
}
/* confere a versao no servidor (arquivo pequeno) e so baixa a base se mudou */
async function carregaBase(forcar){
  D.baseEstado='carregando';pintaMainSe('base');
  try{
    let info=null;
    try{info=JSON.parse(new TextDecoder().decode(await baixa('rtm-base','versao.json')))}
    catch(e){if(e.semSessao)throw e;info=null}
    D.baseInfo=info;
    if(!info){D.base=null;D.baseEstado='sem';pintaLado();pintaMainSe('base');return}
    const guardada=await idbLe('base');
    if(!forcar&&guardada&&guardada.versao===info.versao&&guardada.buf){
      D.base=await abreGz(guardada.buf);D.baseOrigem='guardada no navegador';
    }else{
      const buf=await baixa('rtm-base',info.arquivo||'base.json.gz');
      D.base=await abreGz(buf);D.baseOrigem='baixada agora';
      await idbGrava('base',{versao:info.versao,buf});
    }
    D.baseResumo=resumoBase(D.base);D.baseEstado='ok';
  }catch(e){
    if(e.semSessao)return sessaoCaiu();
    D.baseEstado='erro';D.baseErro=e.message;
  }
  pintaLado();pintaMainSe('base');pintaMainSe('dash');
}
async function enviaBase(arq){
  if(!arq)return;
  const buf=await arq.arrayBuffer();
  let b;try{b=await abreGz(buf)}catch(e){return toast('Este arquivo não é uma base válida.')}
  if(!b||!b.versao||!b.R||!b.C||!b.D)return toast('Arquivo sem versão, estabelecimentos, clientes ou rotas.');
  const r=resumoBase(b);
  if(!confirm('Enviar a base '+r.versao+'?\n\n'+fmt(r.estabelecimentos)+' estabelecimentos, '+fmt(r.clientes)+
     ' clientes BAND, '+fmt(r.rotas)+' rotas.\n\nEla passa a ser a base do painel.'))return;
  toast('Enviando a base…');
  try{
    const gz=new Uint8Array(buf)[0]===0x1f;
    const nome='base.json'+(gz?'.gz':'');
    await sobe('rtm-base',nome,new Blob([buf]),gz?'application/gzip':'application/json',true);
    const info={versao:b.versao,arquivo:nome,enviadaEm:new Date().toISOString(),enviadaPor:EU&&EU.email,
      bytes:buf.byteLength,estabelecimentos:r.estabelecimentos,clientes:r.clientes};
    await sobe('rtm-base','versao.json',new Blob([JSON.stringify(info)]),'application/json',true);
    toast('Base '+b.versao+' enviada');
    carregaBase(true);
  }catch(e){if(e.semSessao)return sessaoCaiu();toast('Não consegui enviar: '+e.message)}
}

const MODULOS=[
  ['Operação',[['aovivo','Ao vivo',1],['mapa','Mapa de oportunidade',0],['planejar','Planejar campo',0],['visitas','Visitas',0],['msgs','Mensagens',0]]],

  aovivo:['Ao vivo','A trilha do dia: uma faixa por desenvolvedor, das 8h às 18h, com cada visita no horário em que aconteceu e os intervalos parados à vista. Ao lado, o mapa dos check-ins pulsando.'],

    '<div class="mini"><div><b>'+fmt(comInt)+'</b><span>querem cadastro</span></div>'+
    '<div><b>'+fmt(D.visitas.length)+'</b><span>no total</span></div>'+
    '<div><b>'+(emUso?fmt(emUso.clientes):'—')+'</b><span>no roteiro</span></div></div>';
  $('quem').innerHTML='<span>'+esc(EU?EU.email:'')+'</span><button id="bsair">Sair</button>';
  $('bsair').onclick=async()=>{await sai();telaEntrada()};

function ir(k){MOD=k;try{history.replaceState(null,'','#'+k)}catch(e){}pintaLado();pintaMain();$('main').scrollTop=0}
function cab(t,sub,acoes){return '<div class="cab"><div><h1>'+t+'</h1><p>'+sub+'</p></div><div class="acoes">'+(acoes||'')+

/* ---------------- datas ---------------- */
const hojeBR=()=>{const d=new Date();return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()};
function dataDe(v){const m=String(v.data||'').match(/^(\d{2})\/(\d{2})\/(\d{4})/);return m?new Date(+m[3],+m[2]-1,+m[1]):(v.iso?new Date(v.iso):null)}

const nomeDev=v=>{const d=D.devs.find(x=>x.login===v.devLogin);return d?d.nome:(v.dev||v.devLogin||'—')};

/* ---------------- módulo: Visitas ---------------- */
const FV={dev:'',per:'30',sit:'',q:''};
function situacao(v){
  const e=v.existe||'';
  if(/cancelad/i.test(e))return ['Cancelada','c'];
  if(/^Sim/i.test(e))return /agora/i.test(v.interesse||'')?['Quer cadastro','v']:['Funcionando','b'];
  if(/fechad|não existe|nao existe|mudou/i.test(e))return ['Não encontrado','r'];
  return [e||'Registrada','a'];
}
function visitasFiltradas(){
  const lim=FV.per==='tudo'?null:(()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(+FV.per-1));return d})();
  const q=FV.q.trim().toLowerCase();
  return D.visitas.filter(v=>{
    if(FV.dev&&v.devLogin!==FV.dev)return false;
    if(lim){const d=dataDe(v);if(!d||d<lim)return false}
    if(FV.sit&&situacao(v)[0]!==FV.sit)return false;
    if(q&&!((v.nome||'')+' '+v.cnpj+' '+(v.bairro||'')).toLowerCase().includes(q))return false;
    return true;
  }).sort((a,b)=>String(b.iso||'').localeCompare(String(a.iso||'')));
}

  const quer=l.filter(v=>situacao(v)[0]==='Quer cadastro').length;
  const prazo=l.filter(v=>v.noPrazo).length,dists=l.map(v=>+v.dist).filter(x=>x>=0&&isFinite(x)&&v0(x));

  const sits=['Quer cadastro','Funcionando','Não encontrado','Cancelada'];
  return cab('Visitas',fmt(D.visitas.length)+' visitas na base · fotos e localização de cada registro')+
   '<div class="filtros">'+
    '<label>Desenvolvedor<select id="fvdev">'+opDev+'</select></label>'+
    '<label>Período<select id="fvper">'+[['1','Hoje'],['7','Últimos 7 dias'],['30','Últimos 30 dias'],['tudo','Tudo']].map(([k,t])=>'<option value="'+k+'"'+(FV.per===k?' selected':'')+'>'+t+'</option>').join('')+'</select></label>'+
    '<label>Situação<select id="fvsit"><option value="">Todas</option>'+sits.map(s=>'<option'+(FV.sit===s?' selected':'')+'>'+s+'</option>').join('')+'</select></label>'+
    '<label>Busca<input id="fvq" type="search" placeholder="Nome, CNPJ ou bairro" value="'+esc(FV.q)+'"></label></div>'+
   '<div class="corpo"><div class="kpis">'+
    '<div class="kpi"><b>'+fmt(l.length)+'</b><span>visitas no filtro</span></div>'+
    '<div class="kpi v"><b>'+fmt(quer)+'</b><span>querem se cadastrar agora</span></div>'+
    '<div class="kpi g"><b>'+(l.length?Math.round(prazo*100/l.length):0)+'%</b><span>no dia do roteiro</span></div>'+
    '<div class="kpi a"><b>'+(dists.length?fmtKm(med(dists)):'—')+'</b><span>distância mediana do endereço</span></div>'+
    '<div class="kpi"><b>'+(durs.length?Math.round(med(durs))+' min':'—')+'</b><span>duração mediana</span></div>'+
    '<div class="kpi"><b>'+(l.length?Math.round(comFoto*100/l.length):0)+'%</b><span>com foto</span></div></div>'+
   '<div class="cartao"><div class="rolagem">'+(l.length?'<table class="tab"><thead><tr><th>Quando</th><th>Desenvolvedor</th><th>PDV</th><th>Situação</th><th>Canal</th><th class="num">Distância</th><th class="num">Duração</th><th>Foto</th></tr></thead><tbody>'+
    l.slice(0,600).map(v=>{const s=situacao(v);return '<tr class="clic" data-c="'+esc(v.cnpj)+'"><td>'+esc(v.data)+'<small>'+esc(v.hora)+'</small></td><td>'+esc(nomeDev(v))+
     '</td><td><b>'+esc(v.nome||'—')+'</b><small>'+esc(cnpjFmt(v.cnpj))+(v.bairro?' · '+esc(v.bairro):'')+'</small></td><td><span class="selo '+s[1]+'">'+esc(s[0])+'</span></td><td>'+esc(v.canal||'—')+
     '</td><td class="num">'+(v.dist!=null?fmtKm(v.dist):'—')+'</td><td class="num">'+(v.duracaoMin?v.duracaoMin+' min':'—')+'</td><td>'+(v.fotoCaminho||v.fotoUrl?'Sim':'—')+'</td></tr>'}).join('')+
    '</tbody></table>'+(l.length>600?'<div class="vazio">Mostrando as 600 mais recentes de '+fmt(l.length)+'. Use os filtros para achar as outras.</div>':''):
    '<div class="vazio">Nenhuma visita neste filtro.</div>')+'</div></div></div>';

const v0=x=>x<500;
const med=a=>{const s=a.slice().sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const fmtKm=k=>{k=+k;return k<1?Math.round(k*1000)+' m':fmt1(k)+' km'};
const cnpjFmt=c=>{const t=String(c||'');return t.length===14?t.replace(/^(.{2})(.{3})(.{3})(.{4})(.{2})$/,'$1.$2.$3/$4-$5'):t};

    linha('SAC',esc(v.sac)+(v.sacProt?' · protocolo '+esc(v.sacProt):''))+linha('Motivo',esc(v.motivo))+
    linha('Observação',esc(v.obs))+linha('Endereço',esc([v.endereco,v.bairro].filter(Boolean).join(' · ')))+
    linha('Rota',esc([v.rota,v.sv,v.consultor].filter(Boolean).join(' · ')))+
    linha('Roteiro','dia '+esc(v.diaRoteiro)+' ('+esc(v.dataPlan)+') · '+(v.noPrazo?'<span class="selo v">no prazo</span>':'<span class="selo a">fora do dia</span>'))+
    linha('Tempo da visita',v.duracaoMin?esc(v.inicioHora)+' às '+esc(v.hora)+' · '+v.duracaoMin+' min':'')+
    linha('Localização',g?'<a href="https://www.google.com/maps?q='+g.lat+','+g.lon+'" target="_blank" rel="noopener">'+g.lat.toFixed(5)+', '+g.lon.toFixed(5)+'</a> · precisão '+fmt(g.acc)+' m':'sem GPS')+

  $('dlg').classList.add('on');$('fecha').onclick=fechaFicha;
  if($('ffoto'))fotoDaVisita(v).then(u=>{if(u&&$('ffoto'))$('ffoto').src=u});

/* imagem da mensagem: reduzida para no máximo 1600 px antes de subir */
function reduzImagem(arq){return new Promise((ok,erro)=>{
  const img=new Image();img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):erro(new Error('imagem inválida')),'image/jpeg',.82)};
  img.onerror=()=>erro(new Error('imagem inválida'));img.src=URL.createObjectURL(arq)})}
async function enviaMsg(){
  const titulo=$('mt').value.trim(),texto=$('mx').value.trim();
  if(!titulo&&!texto)return toast('Escreva um título ou um texto');
  const iso=id=>$(id).value?new Date($(id).value).toISOString():null;
  const b=$('menvia');b.disabled=true;b.textContent='Enviando…';
  try{
    let cam=null;const arq=$('mimg').files[0];
    if(arq){const blob=await reduzImagem(arq);
      cam='mensagens/'+new Date().toISOString().replace(/[^0-9]/g,'').slice(0,14)+'_'+Math.random().toString(36).slice(2,7)+'.jpg';
      await sobe('rtm-fotos',cam,blob,'image/jpeg',false)}
    await rpc('mensagem_gravar',{p_msg:{titulo,texto,dev:$('md').value,imagemCaminho:cam,ativarEm:iso('mi'),expiraEm:iso('mf')}});
    await carregaMsgs();pintaLado();pintaMain();toast('Mensagem enviada');
  }catch(e){if(e.semSessao)return sessaoCaiu();toast('Não consegui enviar: '+e.message);b.disabled=false;b.textContent='Enviar mensagem'}
}

/* ---------------- módulo: Dashboards ---------------- */
/* "Prospecção de clientes": clientes BAND por mil habitantes contra a meta.
   Meta por mil = referência do Brasil × meta (%). Gap = população/1000 × meta por mil − clientes (mínimo 0).
   Status: clientes por mil ÷ referência, nas faixas (padrão 40%, 60% e 80%). */
const K_DASH='rtm_painel_dash';
const SLIDE=['Aparecida de Goiânia','Bela Vista de Goiás','Goiânia','Goianira','Hidrolândia','Inhumas','Senador Canedo','Trindade'];
let DS=null;
function dashCfg(){
  if(DS)return DS;
  let g=null;try{g=JSON.parse(localStorage.getItem(K_DASH)||'null')}catch(e){}
  DS=Object.assign({ref:6.4,meta:80,f1:40,f2:60,f3:80,ordem:'nome',cidades:SLIDE.slice(),
    titulo:'PROSPECÇÃO DE CLIENTES',subtitulo:'por que o novo RTM precisa de vocês',lista:false},g||{});
  return DS;
}
function salvaDash(){try{localStorage.setItem(K_DASH,JSON.stringify(DS))}catch(e){}}
const semAcento=t=>String(t||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/['-]/g,' ').trim();
function dadosCidades(){
  const b=D.base;if(!b||!b.D||!b.populacao)return null;
  const pop={};(b.populacao.municipios||[]).forEach(m=>pop[m.chave]=m);
  const antigos=b.populacao.nomes_antigos||{};
  const out=[],sem=[];
  (b.D.cities||[]).forEach(c=>{
    const k=semAcento(c[0]),m=pop[k]||pop[antigos[k]];
    if(m)out.push({nome:m.nome,uf:m.uf,pop:m.pop,cli:+c[3]||0,nomeMapa:c[0]});
    else sem.push({nome:c[0],cli:+c[3]||0});
  });

  const tem=new Set(out.map(x=>semAcento(x.nome)));
  (b.populacao.municipios||[]).forEach(m=>{if(!tem.has(m.chave))out.push({nome:m.nome,uf:m.uf,pop:m.pop,cli:0,nomeMapa:m.nome})});
  return {cidades:out,sem};
}
function calcula(l,cfg){
  const metaMil=cfg.ref*cfg.meta/100;

    const pm=c.pop?c.cli*1000/c.pop:0,pct=cfg.ref?pm/cfg.ref*100:0;

    const st=pct<cfg.f1?['baixo','Baixo']:pct<cfg.f2?['ab','Abaixo da meta '+cfg.f2+'%']:pct<cfg.f3?['ac','Acima da meta '+cfg.f2+'%']:['top','Acima da meta '+cfg.f3+'%'];
    return Object.assign({},c,{pm,pct,gap,st});
  });
}

function prep(){
  const b=D.base;if(!b)return null;
  if(D._prep&&D._prep.v===b.versao)return D._prep;

  const cad=new Uint8Array(L.length),ex=new Uint8Array(L.length),cn=new Int16Array(L.length),ci=new Int16Array(L.length),po=new Uint8Array(L.length),rt=new Int16Array(L.length),cnpj=new Array(L.length);
  for(const l of L){if(!l)continue;const p=l.split('|');cnpj[n]=p[0];cad[n]=+p[3];cn[n]=+p[4];ci[n]=+p[5];po[n]=+p[8];rt[n]=+p[11];ex[n]=+p[13];n++}
  const pop={};(b.populacao&&b.populacao.municipios||[]).forEach(m=>pop[m.chave]=m);

  const vis=new Set(D.visitas.map(v=>v.cnpj)),devs={};

  const tot=(pl.clientes||[]).length,feitos=Object.values(devs).reduce((s,d)=>s+d.feitos,0),dias=Math.max(0,...Object.values(devs).map(d=>d.dias.size));
  const br=x=>x?x.split('-').reverse().join('/'):'—';
  return {num:fmt(tot),sub:'clientes no roteiro em uso',
   html:'<div class="pill"><b>RAIO-X DO ROTEIRO</b><span>versão '+esc(pl.versao)+'</span></div>'+
    '<div class="topo"><h2><em>'+fmt(tot)+'</em> clientes em <em>'+fmt(dias)+'</em> dias de campo; <em>'+fpct(pct(feitos,tot))+'</em> já visitados</h2>'+
    '<div class="ks"><div class="k"><b>'+fmt(pl.porDia||0)+'</b><span>clientes por dia, cada um</span></div><div class="k meta"><b>'+br(pl.inicio)+'</b><span>início do roteiro</span></div></div></div>'+
    '<div class="devs3">'+Object.keys(devs).sort().map(k=>{const d=devs[k],ds=d.datas.slice().sort(),cids=Object.keys(d.cid).sort((a,b)=>d.cid[b]-d.cid[a]);
      return '<div class="bloco dv"><h3>'+esc(((pl.devs||[])[k]||('Parte '+(+k+1))).toUpperCase())+' · '+esc((pl.logins||[])[k]||'')+'</h3><b class="n">'+fmt(d.n)+'</b><span style="color:#A1A1AA">clientes na carteira</span>'+
        '<div class="pr"><i style="width:'+pct(d.feitos,d.n)+'%"></i></div><span style="color:#A1A1AA;font-size:13px">'+fmt(d.feitos)+' visitados · '+fpct(pct(d.feitos,d.n))+'</span>'+
        '<dl><dt>Dias de trabalho</dt><dd>'+d.dias.size+'</dd><dt>Primeiro dia</dt><dd>'+br(ds[0])+'</dd><dt>Último dia</dt><dd>'+br(ds[ds.length-1])+'</dd>'+
        '<dt>Cidade principal</dt><dd>'+esc(cids[0]||'—')+'</dd></dl></div>'}).join('')+'</div>'+
    '<div class="rod"><span>Escopo: '+esc(pl.escopo||'—')+'. Visitado = o CNPJ do roteiro já tem visita registrada no app.</span></div>'};
}
async function carregaRotCompleto(){
  if(D._lendoRot)return;D._lendoRot=true;
  try{const j=await rpc('roteiro_completo',{});D.rotCompleto=j}catch(e){if(e.semSessao)return sessaoCaiu();D.rotCompleto=null}
  finally{D._lendoRot=false}
  if(MOD==='dash')trocaDash(dashCfg().atual||'prosp',true);
}
function fornecDe(v){const f=v.fornec;if(!f)return [];if(Array.isArray(f))return f;
  const t=String(f);if(t[0]==='['){try{return JSON.parse(t)}catch(e){}}return t.split(/[,;]/).map(x=>x.trim()).filter(Boolean)}
function dCampo(){
  const l=D.visitas;
  if(!l.length)return {num:'0',sub:'visitas: começa no dia da troca',html:'<div class="pill"><b>RESULTADO DO CAMPO</b><span>o que os desenvolvedores encontraram</span></div>'+
    '<div style="margin-top:24px">'+vazioDk('Ainda sem visitas no app novo','Este painel se monta sozinho a partir da primeira visita registrada no Band Desenvolvedores: '+
      'visitas por semana, quem quer cadastro, quem não existe mais, por desenvolvedor.')+'</div>'};
  const st={},porDev={},sem={};
  l.forEach(v=>{const s=situacao(v)[0];st[s]=(st[s]||0)+1;const d=nomeDev(v);const o=porDev[d]||(porDev[d]={n:0,q:0,f:0});o.n++;if(s==='Quer cadastro')o.q++;if(s==='Funcionando'||s==='Quer cadastro')o.f++;
    const dt=dataDe(v);if(dt){const w=new Date(dt);w.setDate(w.getDate()-((w.getDay()+6)%7));const k=w.toISOString().slice(0,10);sem[k]=(sem[k]||0)+1}});
  const q=st['Quer cadastro']||0,sems=Object.keys(sem).sort().slice(-8);
  return {num:fmt(q),sub:'querem se cadastrar agora',
   html:'<div class="pill"><b>RESULTADO DO CAMPO</b><span>o que os desenvolvedores encontraram</span></div>'+
    '<div class="topo"><h2><em>'+fmt(l.length)+'</em> visitas e <em>'+fmt(q)+'</em> PDVs querendo se cadastrar agora</h2>'+
    '<div class="ks"><div class="k"><b>'+fpct(pct(q,l.length))+'</b><span>das visitas viram interesse</span></div><div class="k meta"><b>'+fmt(st['Não encontrado']||0)+'</b><span>não existem mais</span></div></div></div>'+
    '<div class="grade2"><div class="bloco"><h3>POR DESENVOLVEDOR</h3>'+barras(Object.keys(porDev).sort((a,b)=>porDev[b].n-porDev[a].n).map(d=>({nm:d,sub:porDev[d].q+' querem cadastro',partes:[[porDev[d].q,VERDE],[porDev[d].n-porDev[d].q,'#3F3F46']],vl:fmt(porDev[d].n)})))+
      '<h3 style="margin-top:22px">VISITAS POR SEMANA</h3>'+barras(sems.map(k=>({nm:'Semana de '+k.split('-').reverse().slice(0,2).join('/'),partes:[[sem[k],AZUL]],vl:fmt(sem[k])})))+'</div>'+
    '<div class="bloco"><h3>O QUE FOI ENCONTRADO</h3>'+rosca([['Quer cadastro',st['Quer cadastro']||0,VERDE],['Funcionando',st['Funcionando']||0,AZUL],['Não encontrado',st['Não encontrado']||0,CINZA],['Cancelada',st['Cancelada']||0,AMB]],fmt(l.length),'visitas')+'</div></div>'};
}
function dConc(){
  const l=D.visitas.filter(v=>fornecDe(v).length||v.canal);
  if(!l.length)return {num:'—',sub:'fornecedores: começa no dia da troca',html:'<div class="pill"><b>CONCORRÊNCIA E CANAIS</b><span>de quem os PDVs compram hoje</span></div>'+
    '<div style="margin-top:24px">'+vazioDk('Ainda sem respostas de campo','Cada visita registra de quem o PDV compra e qual o canal. Com as primeiras visitas, aparece aqui o mapa da concorrência.')+'</div>'};
  const fo={},ca={};l.forEach(v=>{fornecDe(v).forEach(f=>fo[f]=(fo[f]||0)+1);if(v.canal)ca[v.canal]=(ca[v.canal]||0)+1});
  const fs=Object.keys(fo).sort((a,b)=>fo[b]-fo[a]),cs=Object.keys(ca).sort((a,b)=>ca[b]-ca[a]),cores=[VERM,AMB,ROXO,AZUL,VERDE,'#EC4899',CINZA];
  return {num:fs[0]?esc(fs[0]):'—',sub:'fornecedor mais citado nas visitas',
   html:'<div class="pill"><b>CONCORRÊNCIA E CANAIS</b><span>de quem os PDVs compram hoje</span></div>'+
    '<div class="topo"><h2><em>'+esc(fs[0]||'—')+'</em> é o fornecedor mais citado, em <em>'+fpct(pct(fo[fs[0]]||0,l.length))+'</em> das visitas</h2></div>'+
    '<div class="grade2"><div class="bloco"><h3>FORNECEDORES CITADOS</h3>'+barras(fs.slice(0,12).map(f=>({nm:f,partes:[[fo[f],VERM]],vl:fmt(fo[f])})))+'</div>'+
    '<div class="bloco"><h3>CANAL DOS PDVS VISITADOS</h3>'+rosca(cs.slice(0,6).map((c,i)=>[c,ca[c],cores[i]]),fmt(l.length),'visitas')+'</div></div>'};
}
const DASHES=[['prosp','Prospecção',dProsp],['mun','Por município',dMun],['estr','Por estrutura',dEstr],['ativ','Atividade e porte',dAtiv],
  ['ex','Ex-clientes',dEx],['rot','Raio-X do roteiro',dRot],['campo','Resultado do campo',dCampo],['conc','Concorrência',dConc]];
function montaDash(id){const d=DASHES.find(x=>x[0]===id)||DASHES[0];try{return Object.assign({id:d[0],t:d[1]},d[2]())}catch(e){console.error(e);return {id:d[0],t:d[1],num:'!',sub:'erro',html:vazioDk('Não consegui montar este painel',esc(e.message))}}}
function navDk(id){const i=DASHES.findIndex(x=>x[0]===id);
  return '<div class="nav"><span>'+(i+1)+' de '+DASHES.length+'</span><button data-ir="-1" aria-label="Painel anterior">←</button><button data-ir="1" aria-label="Próximo painel">→</button></div>'}
function mDash(){
  const cfg=dashCfg();
  if(D.baseEstado!=='ok')return cab('Dashboards','Painéis de apresentação')+'<div class="corpo">'+
    (D.baseEstado==='carregando'||!D.baseEstado?'<div class="carregando">Abrindo a base…</div>':
     '<div class="aviso">Os dashboards usam a base. Envie a base em <b>Base de dados</b>.</div>')+'</div>';
  const atual=cfg.atual||'prosp',todos=DASHES.map(d=>montaDash(d[0])),dd=todos.find(x=>x.id===atual);
  return cab('Dashboards','Base '+esc(D.baseResumo.versao)+' · população IBGE 2025 · visitas do app',
      '<button class="bt escuro" id="dapres">Modo apresentação</button>')+
   '<div class="corpo"><div class="gal" role="tablist">'+todos.map(d=>'<button role="tab" data-dash="'+d.id+'" aria-pressed="'+(d.id===atual)+'"><span>'+esc(d.t)+'</span><b>'+d.num+'</b><small>'+esc(d.sub)+'</small></button>').join('')+'</div>'+
   (dd.ajustes?'<div class="cartao"><div class="cc">'+dd.ajustes+'</div></div>':'')+
   '<div class="dk" id="dkart">'+navDk(atual)+dd.html+'</div>'+(dd.depois||'')+'</div>';
}
/* trocar de painel: dentro do modo apresentação só o cartão muda (senão a tela cheia fecha) */
function trocaDash(id,forcar){
  const cfg=dashCfg();cfg.atual=id;salvaDash();
  if(document.fullscreenElement&&$('dkart')){const dd=montaDash(id);$('dkart').innerHTML=navDk(id)+dd.html;ligaDk();return}
  if(MOD==='dash'||forcar)pintaMain();
}
function ligaDk(){
  document.querySelectorAll('#dkart [data-mapa]').forEach(tr=>tr.onclick=()=>abreNoMapa(tr.dataset.mapa));
  document.querySelectorAll('#dkart [data-gc]').forEach(tr=>tr.onclick=()=>{const c=dashCfg();c.estrAberto=c.estrAberto===tr.dataset.gc?'':tr.dataset.gc;salvaDash();trocaDash('estr')});
  document.querySelectorAll('#dkart [data-ir]').forEach(b=>b.onclick=()=>passaDash(+b.dataset.ir));
  const txt=(id,k)=>{const el=$(id);if(!el)return;el.onblur=()=>{const c=dashCfg();c[k]=el.textContent.trim()||c[k];salvaDash()};el.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();el.blur()}}};
  txt('dtit','titulo');txt('dsub','subtitulo');
}
function passaDash(d){const i=DASHES.findIndex(x=>x[0]===(dashCfg().atual||'prosp'));trocaDash(DASHES[(i+d+DASHES.length)%DASHES.length][0])}
document.addEventListener('keydown',e=>{if(document.fullscreenElement&&document.fullscreenElement.id==='dkart'){if(e.key==='ArrowRight')passaDash(1);if(e.key==='ArrowLeft')passaDash(-1)}});
liga.dash=()=>{
  document.querySelectorAll('[data-dash]').forEach(b=>b.onclick=()=>trocaDash(b.dataset.dash));
  if($('dapres'))$('dapres').onclick=()=>{const el=$('dkart');(el.requestFullscreen?el.requestFullscreen():Promise.reject()).catch(()=>toast('O navegador não deixou abrir em tela cheia'))};
  ligaDk();
  const cfg=dashCfg();
  if($('dref')){
    const num=(id,k)=>{$(id).onchange=e=>{const v=parseFloat(String(e.target.value).replace(',','.'));if(isFinite(v)&&v>0){cfg[k]=v;salvaDash();pintaMain()}}};
    num('dref','ref');num('dmeta','meta');num('df1','f1');num('df2','f2');num('df3','f3');
    $('dord').onchange=e=>{cfg.ordem=e.target.value;salvaDash();pintaMain()};
    $('dlista').onclick=()=>{cfg.lista=!cfg.lista;salvaDash();pintaMain()};
    $('dpre').onchange=e=>{const v=e.target.value;if(!v)return;const todas=calcula(dadosCidades().cidades,cfg);
      if(v==='slide')cfg.cidades=SLIDE.slice();else if(v==='gr')cfg.cidades=todas.filter(c=>c.pop>=100000).map(c=>c.nome);
      else cfg.cidades=todas.slice().sort((a,b)=>b.gap-a.gap).slice(0,v==='gap10'?10:20).map(c=>c.nome);salvaDash();pintaMain()};
    document.querySelectorAll('[data-cid]').forEach(x=>x.onchange=()=>{const n=x.dataset.cid;cfg.cidades=x.checked?cfg.cidades.concat(n):cfg.cidades.filter(c=>c!==n);salvaDash();pintaMain()});
  }
  if($('dmuf')){$('dmuf').onchange=e=>{cfg.munUf=e.target.value;salvaDash();pintaMain()};$('dmtop').onchange=e=>{cfg.munTop=+e.target.value;salvaDash();pintaMain()}}
};
/* abre o mapa já filtrado na cidade */
function abreNoMapa(nome){
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
  ir('mapa');
  const alvo=semAcento(nome);
  let tent=0;
  const tenta=()=>{
    let w=null;try{w=$('mapaif').contentWindow}catch(e){}
    const pronto=w&&w.document&&w.document.getElementById('fcid')&&!w.document.getElementById('busy')&&w.RTM&&w.eval("typeof E!=='undefined'&&E.length>0");
    if(!pronto){if(++tent<240)setTimeout(tenta,250);return}
    const s=w.document.getElementById('fcid');
    const o=[...s.options].find(o=>semAcento(o.textContent).startsWith(alvo)||semAcento(o.value)===alvo);
    if(!o)return toast('Não achei '+nome+' no filtro do mapa');
    s.value=o.value;s.dispatchEvent(new Event('change',{bubbles:true}));
  };
  tenta();
}

/* ---------------- módulo: Base de dados ---------------- */
function mBase(){
  const i=D.baseInfo,r=D.baseResumo;
  let estado='';
  if(D.baseEstado==='carregando')estado='<div class="carregando">Conferindo a base no servidor…</div>';
  else if(D.baseEstado==='sem')estado='<div class="aviso"><b>Nenhuma base enviada ainda.</b> Envie o arquivo da base (base-rtm-….json.gz) '+
    'com o botão "Enviar base". Ela fica na pasta privada do Supabase e só o coordenador consegue baixar.</div>';
  else if(D.baseEstado==='erro')estado='<div class="aviso">Não consegui abrir a base: '+esc(D.baseErro)+'</div>';
  else if(D.baseEstado==='ok')estado='<div class="ok">Base <b>'+esc(r.versao)+'</b> pronta ('+esc(D.baseOrigem)+').</div>';
  const pop=D.base&&D.base.populacao;
  return cab('Base de dados','Receita Federal × clientes BAND, guardada na pasta privada do Supabase',
     '<button class="bt escuro" id="benvia">Enviar base</button>')+
   '<div class="corpo">'+estado+
   (r?'<div class="kpis"><div class="kpi"><b>'+fmt(r.estabelecimentos)+'</b><span>estabelecimentos da Receita</span></div>'+
     '<div class="kpi v"><b>'+fmt(r.clientes)+'</b><span>clientes BAND</span></div>'+
     '<div class="kpi"><b>'+fmt(r.rotas)+'</b><span>rotas com território</span></div>'+
     '<div class="kpi a"><b>'+fmt(r.municipiosPop)+'</b><span>municípios com população IBGE 2025</span></div></div>':'')+
   '<div class="cartao"><div class="tt"><h2>Sobre a base em uso</h2></div><div class="cc">'+
    (i?'<table class="tab"><tbody>'+
      '<tr><td style="width:240px">Versão</td><td><b>'+esc(i.versao)+'</b></td></tr>'+
      (r?'<tr><td>Descrição</td><td>'+esc(r.descricao)+'</td></tr>':'')+
      '<tr><td>Enviada em</td><td>'+(i.enviadaEm?new Date(i.enviadaEm).toLocaleString('pt-BR'):'—')+(i.enviadaPor?' por '+esc(i.enviadaPor):'')+'</td></tr>'+
      '<tr><td>Tamanho do arquivo</td><td>'+(i.bytes?fmt1(i.bytes/1048576)+' MB':'—')+'</td></tr>'+
      (pop?'<tr><td>População</td><td>'+esc(pop.fonte||'')+'</td></tr>':'')+
      '<tr><td>Neste computador</td><td>Guardada no navegador. O painel só baixa de novo quando a versão muda.</td></tr>'+
     '</tbody></table>':'<div class="vazio">Sem base no servidor.</div>')+
   '</div></div>'+
   '<div class="info">A base não fica dentro do painel: o painel é público no GitHub e a base tem nome, telefone e endereço dos PDVs. '+
   'Ela fica na pasta privada <b>rtm-base</b>, que só a conta de coordenador lê.</div></div>';
}
liga.base=()=>{$('benvia').onclick=()=>$('arqBase').click()};
$('arqBase').onchange=e=>{const f=e.target.files[0];e.target.value='';enviaBase(f)};

/* ---------------- início ---------------- */
async function abreApp(){
  $('entrada').classList.add('esc');$('app').classList.remove('esc');
  pintaLado();pintaMain();
  await atualizaTudo(true);
  carregaBase();
}
window.addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(k&&k!==MOD)ir(k)});
setInterval(()=>{if(SESSAO&&!document.hidden&&EU)carregaVisitas().then(()=>{pintaLado();if(MOD==='visitas'&&!$('dlg').classList.contains('on')&&document.activeElement.tagName!=='INPUT')pintaMain()}).catch(()=>{})},60000);
(async function(){
  if(!SESSAO)return telaEntrada();
  try{const q=await rpc('quem_sou');if(q.papel!=='coordenador')throw new Error('Esta conta não é de coordenador.');EU=q;abreApp()}
  catch(e){if(SESSAO&&!e.semSessao&&!/conex/i.test(e.message))await sai();telaEntrada(e.semSessao?'Sua sessão expirou. Entre de novo.':e.message)}
})();
