  if($('pqq')){let t;$('pqq').oninput=e=>{FPQ.q=e.target.value;clearTimeout(t);t=setTimeout(()=>{pintaMain();const i=$('pqq');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},250)}}
  m.querySelectorAll('[data-cod]').forEach(e=>e.onclick=()=>abrePq(e.dataset.cod,e.dataset.ac||null));
  pqLigaFotos(m);   /* as fotos das perguntas de foto: o link de cada uma é pedido agora */
  m.querySelectorAll('tr[data-cons]').forEach(tr=>tr.onclick=()=>{FPQ.cons=FPQ.cons===tr.dataset.cons?'':tr.dataset.cons;pintaMain();m.scrollTop=0});
  if($('pqcsvresp'))$('pqcsvresp').onclick=pqBaixaRespostas;
  if($('pqcsvac'))$('pqcsvac').onclick=pqBaixaAcomp;
  if($('pqvolta'))$('pqvolta').onclick=()=>{PQD.sel=null;FPQ.aba='res';pqRecarrega(true)};
  m.querySelectorAll('[data-ver]').forEach(b=>b.onclick=()=>{const at=PQD.lista.find(x=>x.status==='ativa');
    PQD.sel=at&&at.id===b.dataset.ver?null:b.dataset.ver;FPQ.aba='res';FPQ.rota=FPQ.cons=FPQ.seg=FPQ.dev='';pqRecarrega(true);m.scrollTop=0});
  /* a pesquisa atual */
  if($('pqenc'))$('pqenc').onclick=()=>{if(confirm('Encerrar a pesquisa "'+PQD.p.nome+'"?\n\nEla some do app dos desenvolvedores. As respostas e os acompanhamentos ficam guardados aqui.')){PQD.sel=PQD.p.id;   /* continua na tela a que acabou de ser encerrada */
    pqAjusta({status:'encerrada'},'Pesquisa encerrada')}};
  if($('pqreat'))$('pqreat').onclick=()=>{const at=PQD.lista.find(x=>x.status==='ativa');
    if(confirm('Reativar a pesquisa "'+PQD.p.nome+'"?'+(at?'\n\nA pesquisa "'+at.nome+'" será encerrada.':''))){PQD.sel=null;pqAjusta({status:'ativa'},'Pesquisa reativada')}};
  if($('pqdist'))$('pqdist').onclick=()=>{const rotas={};m.querySelectorAll('select[data-rdev]').forEach(s=>{if(s.value!==s.dataset.era)rotas[s.dataset.rdev]=s.value});
    const n=Object.keys(rotas).length;if(!n)return toast('Nenhuma rota mudou de desenvolvedor');
    if(confirm('Trocar o desenvolvedor de '+n+(n===1?' rota':' rotas')+'?'))pqAjusta({rotas},'Distribuição salva')};
  nbLiga();
  if($('pqqual'))$('pqqual').onchange=e=>{PQD.sel=e.target.value||null;pqRecarrega(true)};
  if(FPQ.aba==='res')desenhaPqMapa();
};
/* liga os campos de montar a pesquisa (na aba Campanha e no "Nova frente") */
function nbLiga(){
  const m=$('main'),y=()=>{const t=m.scrollTop;pintaMain();m.scrollTop=t};
  if(!$('nbgc'))return;
  $('nbgc').onchange=e=>{NB.gc=e.target.value;NB.sv='';nbDistribui();y()};
  $('nbsv').onchange=e=>{NB.sv=e.target.value;nbDistribui();y()};
  $('nbnome').oninput=e=>{NB.nome=e.target.value;NB.nomeAuto=!e.target.value.trim()};
  if($('nbform'))$('nbform').onchange=e=>{NB.form=e.target.value};
  $('nbauto').onclick=()=>{nbDistribui();y()};
  $('nbtodas').onchange=e=>{if(e.target.checked)nbDistribui();else NB.rotas={};y()};
  m.querySelectorAll('[data-nbr]').forEach(c=>c.onchange=()=>{if(c.checked)NB.rotas[c.dataset.nbr]='';else delete NB.rotas[c.dataset.nbr];y()});
  m.querySelectorAll('[data-nbd]').forEach(s=>s.onchange=()=>{NB.rotas[s.dataset.nbd]=s.value;y()});
  $('nbpub').onclick=()=>nbPublica(false);
  if($('nbadd'))$('nbadd').onclick=()=>nbPublica(true);
  if($('nbini'))$('nbini').onchange=e=>{NB.inicio=e.target.value};
  if($('nbfim'))$('nbfim').onchange=e=>{NB.prazo=e.target.value};
  if($('nbfoco'))$('nbfoco').onchange=e=>{NB.foco=e.target.checked};
  if($('nbmanter'))$('nbmanter').onchange=e=>{NB.manter=e.target.checked};
  if($('nbcancela'))$('nbcancela').onclick=()=>{FRD.nova=false;pintaMain();m.scrollTop=0};
}

/* ---------------- módulo: Base de dados ---------------- */
function mBase(){
  const i=D.baseInfo,r=D.baseResumo;
  let estado='';
  if(D.baseEstado==='carregando')estado='<div class="carregando">Abrindo a base… <span class="passobase">'+esc(D.basePasso||'')+'</span></div>';
  else if(D.baseEstado==='sem')estado='<div class="aviso"><b>Nenhuma base enviada ainda.</b> Envie o arquivo da base (base-rtm-….json.gz) '+
    'com o botão "Enviar base". Ela fica na pasta privada do Supabase e só o coordenador consegue baixar.</div>';
  else if(D.baseEstado==='erro')estado='<div class="aviso">Não consegui abrir a base: '+esc(D.baseErro)+'</div>';
  else if(D.baseEstado==='ok')estado='<div class="ok">Base <b>'+esc(r.versao)+'</b> pronta ('+esc(D.baseOrigem)+').'+
    (D.baseGuardou===false?' Este navegador não deixou guardar a cópia da base, então ela é baixada de novo a cada abertura do painel (funciona, só demora alguns segundos a mais).':'')+'</div>';
  const pop=D.base&&D.base.populacao;
  return cab('Base de dados','Receita Federal × clientes BAND, guardada na pasta privada do Supabase',
     TESTE?'':'<button class="bt escuro" id="benvia">Enviar base</button>')+
   '<div class="corpo">'+(TESTE?'<div class="info">O portal de teste usa a mesma base da produção, só para leitura. Para trocar a base, use o portal de produção.</div>':'')+estado+
   (r?'<div class="kpis"><div class="kpi"><b>'+fmt(r.estabelecimentos)+'</b><span>estabelecimentos da Receita</span></div>'+
     '<div class="kpi v"><b>'+fmt(r.clientes)+'</b><span>clientes BAND</span></div>'+
     '<div class="kpi"><b>'+fmt(r.rotas)+'</b><span>rotas com território</span></div>'+
     '<div class="kpi a"><b>'+fmt(r.municipiosPop)+'</b><span>municípios com população IBGE 2025</span></div></div>':'')+
   '<div class="cartao"><div class="tt"><h2>Sobre a base em uso</h2></div><div class="cc">'+
    (i?'<table class="tab"><tbody>'+
      '<tr><td style="width:240px">Versão</td><td><b>'+esc(i.versao)+'</b></td></tr>'+
      (r?'<tr><td>Descrição</td><td>'+esc(r.descricao)+'</td></tr>':'')+
      '<tr><td>Enviada em</td><td>'+(i.enviadaEm?new Date(i.enviadaEm).toLocaleString('pt-BR'):'—')+(i.enviadaPor?' por '+esc(i.enviadaPor):'')+'</td></tr>'+
      '<tr><td>Tamanho do arquivo</td><td>'+(i.bytes?fmt1(i.bytes/1048576)+' MB':'—')+'</td></tr>'+
      (pop?'<tr><td>População</td><td>'+esc(pop.fonte||'')+'</td></tr>':'')+
      '<tr><td>Neste computador</td><td>Guardada no navegador. O painel só baixa de novo quando a versão muda.</td></tr>'+
     '</tbody></table>':'<div class="vazio">Sem base no servidor.</div>')+
   '</div></div>'+
   '<div class="info">A base não fica dentro do painel: o painel é público no GitHub e a base tem nome, telefone e endereço dos PDVs. '+
   'Ela fica na pasta privada <b>rtm-base</b>, que só a conta de coordenador lê.</div></div>';
}
liga.base=()=>{if($('benvia'))$('benvia').onclick=()=>$('arqBase').click()};
/* ---------------- portal de teste ---------------- */
if(TESTE){
  document.body.classList.add('teste');
  try{document.title='TESTE · '+document.title}catch(e){}
  /* zera roteiros, visitas, pesquisas, frentes, formulários e mensagens do ambiente de teste; os
     usuários de teste ficam */
  $('blimpa').onclick=async()=>{
    if(!EU)return toast('Entre no portal de teste primeiro');
    if(!confirm('Limpar os dados de teste?\n\nApaga roteiros, visitas, pesquisas, frentes (ordem e prazos), FORMULÁRIOS e mensagens do ambiente de teste. Os usuários de teste continuam.\n\nA produção não é tocada.'))return;
    try{
      const j=await rpc('limpar_teste');
      /* o que estava na tela era do que foi apagado: zera e lê tudo de novo */
      D.visitas=[];D.visDesde=null;D.visCnpj=null;D.rotCompleto=undefined;
      PQD.p=null;PQD.cli=[];PQD.porCod={};PQD.resp={};PQD.ac={};PQD.desde=null;PQD.versao=null;PQD.sel=null;
      /* o formulário que estava aberto e a frente que estava sendo montada também foram apagados:
         sem isto, "Salvar formulário" tentava regravar um formulário que não existe mais */
      FMD.sel=null;FMD.rasc=null;FMD.sujo=false;FRD.nova=false;FRD.cfg={};NB.form='';
      AVD.resp=[];AVD.dia='';AVD.pedido='';AVD.quando=0;if(AVD.estado==='ok')AVD.estado='';
      await atualizaTudo(true);
      toast('Dados de teste limpos: '+fmt(j.visitas)+' visitas, '+fmt(j.respostas)+' pesquisas, '+fmt(j.roteiros)+' roteiros');
    }catch(e){if(e.semSessao)return sessaoCaiu();toast('Não consegui limpar: '+e.message)}
  };
}
$('arqBase').onchange=e=>{const f=e.target.files[0];e.target.value='';enviaBase(f)};

/* ---------------- início ---------------- */
async function abreApp(){
  $('entrada').classList.add('esc');$('app').classList.remove('esc');
  pintaLado();pintaMain();
  await atualizaTudo(true);
  carregaBase();
}
window.addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(k&&k!==MOD)ir(k)});
setInterval(()=>{if(SESSAO&&!document.hidden&&EU)carregaVisitas().then(()=>{pintaLado();if(['visitas','aovivo','desemp','funil','conc'].includes(MOD)&&!$('dlg').classList.contains('on')&&!['INPUT','SELECT'].includes(document.activeElement.tagName))pintaMain()}).catch(()=>{})},60000);
/* a pesquisa também se atualiza sozinha; a tela só é refeita se chegou coisa nova e ninguém está mexendo nela */
setInterval(()=>{if(SESSAO&&!document.hidden&&EU&&PQD.estado==='ok')carregaPesquisa().then(()=>{if(!PQD.mudou)return;pintaLado();
  if(MOD==='pesquisa'&&FPQ.aba!=='camp'&&!$('dlg').classList.contains('on')&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))pintaMain()}).catch(()=>{})},60000);
(async function(){
  if(!SESSAO)return telaEntrada();
  try{const q=await rpc('quem_sou');if(q.papel!=='coordenador')throw new Error('Esta conta não é de coordenador.');EU=q;abreApp()}
  catch(e){if(SESSAO&&!e.semSessao&&!/conex/i.test(e.message))await sai();telaEntrada(e.semSessao?'Sua sessão expirou. Entre de novo.':e.message)}
})();
