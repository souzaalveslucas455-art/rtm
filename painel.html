<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Band Desenvolvedores</title>
<meta name="theme-color" content="#1F2023">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --verm:#E4002B; --verm-esc:#B80022; --verm-bg:#FDE7EC;
  --ink:#1A1D21; --ink2:#5B6270; --ink3:#9CA3AF; --linha:#E5E7EB; --papel:#FFF; --fundo:#F1F2F4;
  --lado:#1F2023; --lado2:#2B2C30; --lado-txt:#C9CBD1;
  --verde:#0F7A52; --verde-bg:#E6F4EE; --amb:#96620F; --amb-bg:#FDF2DC; --azul:#1E6FD9; --azul-bg:#E9F1FC;
  --teal:#2F7F86; --teal-bg:#DCEEF0; --roxo:#6D4BC4; --roxo-bg:#F0EBFB;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--fundo);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.esc{display:none!important}

/* ---------- entrada ---------- */
#entrada{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(360px,.9fr);background:var(--lado)}
#entrada .lado{position:relative;overflow:hidden;padding:56px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;
  background:radial-gradient(120% 90% at 0% 100%,#5a0a19 0%,rgba(90,10,25,0) 60%),linear-gradient(160deg,#1F2023 0%,#141518 100%)}
#entrada .lado .lg{width:46px;height:46px;border-radius:12px;background:var(--verm);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:17px}
#entrada .lado h1{font-size:46px;line-height:1.04;margin:0;letter-spacing:-.02em;max-width:12ch}
#entrada .lado h1 span{color:#ff5a6e}
#entrada .lado p{color:#b9bcc4;max-width:46ch;line-height:1.55;margin:18px 0 0}
#entrada .lado small{color:#7d818b}
#entrada .form{background:var(--papel);display:flex;flex-direction:column;justify-content:center;padding:56px}
#entrada .form h2{margin:0 0 6px;font-size:22px} #entrada .form .sub{color:var(--ink2);margin:0 0 26px}
#entrada label{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}
#entrada input{width:100%;border:1px solid var(--linha);border-radius:10px;padding:12px 13px;background:#fff}
#entrada .bt{width:100%;margin-top:22px;padding:12px}
#entrada .erro{background:var(--verm-bg);color:var(--verm-esc);border-radius:10px;padding:10px 12px;margin-bottom:6px;font-size:13px}
@media(max-width:820px){#entrada{grid-template-columns:1fr}#entrada .lado{display:none}}

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);height:100%}
aside{background:var(--lado);color:var(--lado-txt);display:flex;flex-direction:column;overflow-y:auto}
.marca{display:flex;gap:10px;align-items:center;padding:18px 16px;border-bottom:1px solid #303136}
.marca .lg{width:34px;height:34px;border-radius:9px;background:var(--verm);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.marca b{color:#fff;display:block;font-size:15px} .marca small{font-size:12px}
nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px}
nav .grupo{font-size:11px;color:#80838c;padding:12px 12px 4px;font-weight:600}
nav button{position:relative;display:flex;gap:11px;align-items:center;text-align:left;border:none;background:none;color:var(--lado-txt);padding:9px 12px;border-radius:9px;cursor:pointer;font-size:14px;line-height:1.25}
nav button:hover{background:var(--lado2)}
nav button[aria-current="page"]{background:var(--lado2);color:#fff;font-weight:600}
nav button[aria-current="page"]::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--verm)}
nav button.breve{opacity:.55}
nav button .tag{margin-left:auto;font-size:10.5px;border:1px solid #45474d;border-radius:8px;padding:0 6px;color:#9a9da5}
nav svg{flex:none;opacity:.85}
nav .n{margin-left:auto;background:var(--verm);color:#fff;font-size:11.5px;font-weight:700;border-radius:10px;padding:1px 7px}
.hoje{margin:auto 10px 12px;background:var(--verm);color:#fff;border-radius:14px;padding:14px}
.hoje .top{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.hoje .pill{background:rgba(255,255,255,.22);border-radius:12px;padding:2px 9px;font-weight:700}
.hoje h3{margin:8px 0 2px;font-size:14px;font-weight:600}
.hoje .big{font-size:30px;font-weight:800;line-height:1.05}
.hoje .big small{font-size:14px;font-weight:600;opacity:.9}
.hoje .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.hoje .mini div{background:rgba(0,0,0,.18);border-radius:9px;text-align:center;padding:7px 2px}
.hoje .mini b{display:block;font-size:17px} .hoje .mini span{font-size:11px;opacity:.9}
.quem{padding:10px 16px 16px;font-size:12px;color:#8d9099;display:flex;justify-content:space-between;gap:8px}
.quem button{background:none;border:none;color:#cfd1d6;cursor:pointer;padding:0;text-decoration:underline}

main{overflow-y:auto;min-width:0}
.cab{background:var(--papel);border-bottom:1px solid var(--linha);padding:16px 26px;display:flex;gap:16px;align-items:flex-start;position:sticky;top:0;z-index:5}
.cab h1{margin:0;font-size:19px} .cab p{margin:3px 0 0;color:var(--ink2);font-size:13px}
.cab .acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.bt{border:1px solid var(--linha);background:var(--papel);border-radius:9px;padding:8px 13px;font-weight:600;cursor:pointer;white-space:nowrap}
.bt.escuro{background:var(--ink);color:#fff;border-color:var(--ink)}
.bt.verm{background:var(--verm);color:#fff;border-color:var(--verm)}
.bt.peq{padding:5px 10px;font-size:13px}
.bt:disabled{opacity:.5;cursor:default}
.corpo{padding:22px 26px 40px;display:flex;flex-direction:column;gap:18px}

/* filtros */
.filtros{background:var(--papel);border-bottom:1px solid var(--linha);padding:12px 26px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.filtros label{display:flex;flex-direction:column;gap:5px;font-size:11.5px;font-weight:700;color:var(--ink2)}
.filtros select,.filtros input{border:1px solid var(--linha);border-radius:9px;padding:7px 10px;background:#fff;font-weight:500;color:var(--ink);min-width:150px}
.filtros input[type=search]{min-width:240px}

/* cartoes e numeros */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--papel);border:1px solid var(--linha);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font-size:26px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi span{color:var(--ink2);font-size:12.5px}
.kpi.v b{color:var(--verm)} .kpi.g b{color:var(--verde)} .kpi.a b{color:var(--azul)}
.cartao{background:var(--papel);border:1px solid var(--linha);border-radius:14px}
.cartao>.tt{padding:14px 18px;border-bottom:1px solid var(--linha);display:flex;gap:10px;align-items:center}
.cartao>.tt h2{margin:0;font-size:15px} .cartao>.tt span{color:var(--ink2);font-size:12.5px}
.cartao>.tt .acoes{margin-left:auto;display:flex;gap:8px}
.cartao>.cc{padding:16px 18px}
.vazio{color:var(--ink2);text-align:center;padding:36px 16px}
.aviso{background:var(--amb-bg);color:var(--amb);border-radius:10px;padding:10px 12px;font-size:13px}
.info{background:var(--azul-bg);color:#174f99;border-radius:10px;padding:10px 12px;font-size:13px}
.ok{background:var(--verde-bg);color:var(--verde);border-radius:10px;padding:10px 12px;font-size:13px}

/* tabela */
.tab{width:100%;border-collapse:collapse;font-size:13.5px}
.tab th{text-align:left;font-size:11.5px;color:var(--ink2);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--linha);background:#FAFAFB;position:sticky;top:0}
.tab td{padding:10px 12px;border-bottom:1px solid #F0F1F3;vertical-align:middle}
.tab tr.clic{cursor:pointer} .tab tr.clic:hover td{background:#FAFAFB}
.tab .num{text-align:right;font-variant-numeric:tabular-nums}
.tab small{color:var(--ink2);display:block}
.rolagem{overflow:auto;max-height:calc(100vh - 330px)}
.selo{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.selo.v{background:var(--verde-bg);color:var(--verde)} .selo.a{background:var(--amb-bg);color:var(--amb)}
.selo.r{background:var(--verm-bg);color:var(--verm-esc)} .selo.c{background:#EEF0F3;color:var(--ink2)} .selo.b{background:var(--azul-bg);color:var(--azul)}

/* desenvolvedores */
.devs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.dev{background:var(--papel);border:1px solid var(--linha);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.dev .top{display:flex;gap:12px;align-items:center}
.dev .av{width:46px;height:46px;border-radius:12px;background:var(--lado);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.dev.off .av{background:#9CA3AF}
.dev input{border:1px solid transparent;border-radius:8px;padding:4px 6px;margin-left:-6px;font-weight:700;font-size:16px;width:100%;background:transparent}
.dev input:hover{border-color:var(--linha)} .dev input:focus{border-color:var(--azul);background:#fff}
.dev .lin{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);border-top:1px dashed var(--linha);padding-top:8px}
.dev .lin b{color:var(--ink);font-weight:600}
.dev .bts{display:flex;gap:8px;flex-wrap:wrap}

/* mensagens */
.msgs{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:18px;align-items:start}
.campo{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.campo label{font-size:12.5px;font-weight:700;color:var(--ink2)}
.campo input,.campo textarea,.campo select{border:1px solid var(--linha);border-radius:9px;padding:9px 11px;background:#fff}
.campo textarea{min-height:110px;resize:vertical}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{display:flex;gap:14px;padding:14px 18px;border-bottom:1px solid #F0F1F3}
.msg:last-child{border-bottom:none}
.msg img{width:84px;height:84px;object-fit:cover;border-radius:10px;background:#EEF0F3;flex:none}
.msg h3{margin:0 0 3px;font-size:14.5px} .msg p{margin:0;color:var(--ink2);white-space:pre-wrap}
.msg .meta{font-size:12px;color:var(--ink3);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}
.msg .rec{margin-left:auto;text-align:right;flex:none;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.barra{height:6px;border-radius:6px;background:#EEF0F3;overflow:hidden;width:120px}
.barra span{display:block;height:100%;background:var(--verde)}
@media(max-width:1100px){.msgs{grid-template-columns:1fr}}

/* ficha da visita */
#dlg{position:fixed;inset:0;background:rgba(15,16,19,.55);display:none;align-items:stretch;justify-content:flex-end;z-index:20}
#dlg.on{display:flex}
#dlg .folha{width:min(560px,100%);background:var(--papel);overflow-y:auto;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
#dlg .folha .tt{position:sticky;top:0;background:var(--papel);padding:16px 20px;border-bottom:1px solid var(--linha);display:flex;gap:12px;align-items:flex-start}
#dlg .folha .tt h2{margin:0;font-size:17px} #dlg .folha .tt p{margin:3px 0 0;color:var(--ink2);font-size:13px}
#dlg .folha .tt button{margin-left:auto}
#dlg .foto{width:100%;max-height:360px;object-fit:cover;background:#EEF0F3;display:block}
#dlg dl{display:grid;grid-template-columns:150px 1fr;margin:0;padding:8px 20px 24px}
#dlg dt{color:var(--ink2);font-size:13px;padding:8px 0;border-bottom:1px solid #F0F1F3}
#dlg dd{margin:0;padding:8px 0;border-bottom:1px solid #F0F1F3;font-weight:500}

/* modulo em construcao */
.breve-c{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.breve-c .cartao{padding:18px}
.breve-c h3{margin:0 0 6px;font-size:15px} .breve-c p{margin:0;color:var(--ink2);line-height:1.5}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;z-index:30;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
.carregando{display:flex;gap:10px;align-items:center;color:var(--ink2)}
.carregando::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--linha);border-top-color:var(--verm);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="entrada" class="esc"></div>
<div class="app esc" id="app">
  <aside>
    <div class="marca"><div class="lg">BD</div><div><b>Band Desenvolvedores</b><small>Painel do coordenador</small></div></div>
    <nav id="nav"></nav>
    <div class="hoje" id="hoje"></div>
    <div class="quem" id="quem"></div>
  </aside>
  <main id="main"></main>
</div>
<div id="dlg" role="dialog" aria-modal="true"><div class="folha" id="folha"></div></div>
<div id="toast" role="status"></div>
<input type="file" id="arqBase" accept=".gz,.json,application/gzip,application/json" class="esc">

<script>
/* ============================================================================
   Painel Band Desenvolvedores (RTM)
   Fala com o banco do RTM no Supabase do merch. A chave abaixo é a publicável:
   o que protege os dados é o login do coordenador e as regras do banco.
   Tudo o que este painel guarda no navegador usa chaves com o prefixo rtm_painel_.
   ============================================================================ */
const VERSAO='1.0.0';
const SUPA={url:'https://kqpdledhaghuzuwjkvrf.supabase.co',chave:'sb_publishable_dMdB5b_G5X5TnXemexGIXQ_GWXS6cid'};
const K_SESSAO='rtm_painel_sessao',K_EMAIL='rtm_painel_email';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(+n||0).toLocaleString('pt-BR');
const fmt1=n=>(+n||0).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),3200)}

/* ---------------- servidor ---------------- */
let SESSAO=null;try{SESSAO=JSON.parse(localStorage.getItem(K_SESSAO)||'null')}catch(e){}
function guardaSessao(j){
  SESSAO=j?{access_token:j.access_token,refresh_token:j.refresh_token,expira:Date.now()+((+j.expires_in||3600)*1000)}:null;
  try{SESSAO?localStorage.setItem(K_SESSAO,JSON.stringify(SESSAO)):localStorage.removeItem(K_SESSAO)}catch(e){}
}
function erroDe(j,status){
  const m=String((j&&(j.message||j.msg||j.error_description||j.error))||('erro '+status));
  if(/Invalid login credentials|invalid_credentials|invalid_grant/i.test(m))return 'E-mail ou senha incorretos.';
  return m;
}
async function pede(caminho,opc){
  let r;try{r=await fetch(SUPA.url+caminho,opc)}catch(e){throw new Error('Sem conexão com o servidor.')}
  const t=r.headers.get('content-type')||'';
  if(opc&&opc.binario&&r.ok)return {ok:true,status:r.status,buf:await r.arrayBuffer()};
  const x=await r.text();let j=null;try{j=x?JSON.parse(x):null}catch(e){}
  return {ok:r.ok,status:r.status,j,t:x};
}
function semSessao(){const e=new Error('Sua sessão expirou. Entre de novo.');e.semSessao=true;return e}
async function autentica(email,senha){
  const r=await pede('/auth/v1/token?grant_type=password',{method:'POST',
    headers:{apikey:SUPA.chave,'Content-Type':'application/json'},body:JSON.stringify({email,password:senha})});
  if(!r.ok)throw new Error(erroDe(r.j,r.status));
  guardaSessao(r.j);
}
let renovando=null;
function renova(){
  if(renovando)return renovando;
  if(!SESSAO||!SESSAO.refresh_token)return Promise.reject(semSessao());
  renovando=pede('/auth/v1/token?grant_type=refresh_token',{method:'POST',
      headers:{apikey:SUPA.chave,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:SESSAO.refresh_token})})
    .then(r=>{if(r.ok){guardaSessao(r.j);return}
      if(r.status>=400&&r.status<500){guardaSessao(null);throw semSessao()}
      throw new Error(erroDe(r.j,r.status))})
    .finally(()=>{renovando=null});
  return renovando;
}
async function token(){if(!SESSAO)throw semSessao();if(Date.now()>SESSAO.expira-60000)await renova();return SESSAO.access_token}
async function rpc(nome,args,tentou){
  const tk=await token();
  const r=await pede('/rest/v1/rpc/'+nome,{method:'POST',headers:{apikey:SUPA.chave,Authorization:'Bearer '+tk,
    'Content-Type':'application/json','Content-Profile':'rtm','Accept-Profile':'rtm'},body:JSON.stringify(args||{})});
  if(r.status===401&&!tentou){await renova();return rpc(nome,args,true)}
  if(r.status===401){guardaSessao(null);throw semSessao()}
  if(!r.ok)throw new Error(erroDe(r.j,r.status));
  return r.j;
}
const caminhoUrl=c=>String(c).split('/').map(encodeURIComponent).join('/');
async function sobe(balde,caminho,corpo,tipo,trocar,tentou){
  const tk=await token();
  const r=await pede('/storage/v1/object/'+balde+'/'+caminhoUrl(caminho),{method:'POST',
    headers:{apikey:SUPA.chave,Authorization:'Bearer '+tk,'Content-Type':tipo,'x-upsert':trocar?'true':'false'},body:corpo});
  if(r.ok)return true;
  if(!tentou&&r.status===401){await renova();return sobe(balde,caminho,corpo,tipo,trocar,true)}
  throw new Error(erroDe(r.j,r.status));
}
async function baixa(balde,caminho){
  const tk=await token();
  const r=await pede('/storage/v1/object/authenticated/'+balde+'/'+caminhoUrl(caminho),
    {headers:{apikey:SUPA.chave,Authorization:'Bearer '+tk},binario:true});
  if(!r.ok){const e=new Error(r.status===400||r.status===404?'arquivo não encontrado':erroDe(r.j,r.status));e.status=r.status;throw e}
  return r.buf;
}
/* fotos privadas: link que vale 1 hora */
const ASSIN={};
async function linkFoto(cam){
  const a=ASSIN[cam];if(a&&a.ate>Date.now())return a.url;
  const tk=await token();
  const r=await pede('/storage/v1/object/sign/rtm-fotos/'+caminhoUrl(cam),{method:'POST',
    headers:{apikey:SUPA.chave,Authorization:'Bearer '+tk,'Content-Type':'application/json'},body:JSON.stringify({expiresIn:3600})});
  const u=r.ok&&r.j&&(r.j.signedURL||r.j.signedUrl);
  if(!u)return '';
  const url=/^https?:/.test(u)?u:SUPA.url+'/storage/v1'+u;
  ASSIN[cam]={url,ate:Date.now()+50*60000};return url;
}
function fotoDaVisita(v){
  if(v.fotoCaminho)return linkFoto(v.fotoCaminho);
  const t=String(v.fotoUrl||''),m=t.match(/[-\w]{25,}/);
  if(/drive\.google\.com|googleusercontent/.test(t)&&m)return Promise.resolve('https://drive.google.com/thumbnail?id='+m[0]+'&sz=w1200');
  return Promise.resolve(t);
}

/* ---------------- entrada ---------------- */
function telaEntrada(erro){
  $('app').classList.add('esc');$('entrada').classList.remove('esc');
  $('entrada').innerHTML=
   '<div class="lado"><div class="lg">BD</div>'+
     '<div><h1>Cada PDV sem cadastro é um <span>cliente esperando</span>.</h1>'+
     '<p>Roteiros, visitas, fotos e mensagens dos desenvolvedores comerciais num lugar só, '+
     'ligados à base da Receita e aos clientes BAND de Goiás e Tocantins.</p></div>'+
     '<small>Painel Band Desenvolvedores · versão '+VERSAO+'</small></div>'+
   '<div class="form"><h2>Entrar no painel</h2><p class="sub">Use a conta de coordenador.</p>'+
     (erro?'<div class="erro">'+esc(erro)+'</div>':'')+
     '<label for="em">E-mail</label><input id="em" type="email" autocomplete="username" value="'+esc(EMAIL_DIGITADO||localStorage.getItem(K_EMAIL)||'')+'">'+
     '<label for="se">Senha</label><input id="se" type="password" autocomplete="current-password">'+

const IDB_NOME='rtm_painel';
function idb(){return new Promise((ok,erro)=>{const r=indexedDB.open(IDB_NOME,1);
  r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>erro(r.error)})}
async function idbLe(k){const db=await idb();return new Promise(ok=>{const t=db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>ok(t.result);t.onerror=()=>ok(null)})}
async function idbGrava(k,v){const db=await idb();return new Promise(ok=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>ok(true);t.onerror=()=>ok(false)})}
async function abreGz(buf){
  const u8=new Uint8Array(buf);
  if(u8[0]===0x1f&&u8[1]===0x8b){
    const s=new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
    return JSON.parse(await new Response(s).text());
  }
  return JSON.parse(new TextDecoder().decode(u8));
}
function resumoBase(b){
  const est=b.R?b.R.split('\n').filter(Boolean).length:0,cli=b.C?b.C.split('\n').filter(Boolean).length:0;
  return {versao:b.versao,descricao:b.descricao||'',estabelecimentos:est,clientes:cli,
    rotas:(b.D&&b.D.rotas||[]).length,municipiosPop:(b.populacao&&b.populacao.municipios||[]).length};
}
/* confere a versao no servidor (arquivo pequeno) e so baixa a base se mudou */
async function carregaBase(forcar){
  D.baseEstado='carregando';pintaMainSe('base');
  try{
    let info=null;
    try{info=JSON.parse(new TextDecoder().decode(await baixa('rtm-base','versao.json')))}
    catch(e){if(e.semSessao)throw e;info=null}
    D.baseInfo=info;
    if(!info){D.base=null;D.baseEstado='sem';pintaLado();pintaMainSe('base');return}
    const guardada=await idbLe('base');
    if(!forcar&&guardada&&guardada.versao===info.versao&&guardada.buf){
      D.base=await abreGz(guardada.buf);D.baseOrigem='guardada no navegador';
    }else{
      const buf=await baixa('rtm-base',info.arquivo||'base.json.gz');
      D.base=await abreGz(buf);D.baseOrigem='baixada agora';
      await idbGrava('base',{versao:info.versao,buf});
    }
    D.baseResumo=resumoBase(D.base);D.baseEstado='ok';
  }catch(e){
    if(e.semSessao)return sessaoCaiu();
    D.baseEstado='erro';D.baseErro=e.message;
  }
  pintaLado();pintaMainSe('base');
}
async function enviaBase(arq){
  if(!arq)return;
  const buf=await arq.arrayBuffer();
  let b;try{b=await abreGz(buf)}catch(e){return toast('Este arquivo não é uma base válida.')}
  if(!b||!b.versao||!b.R||!b.C||!b.D)return toast('Arquivo sem versão, estabelecimentos, clientes ou rotas.');
  const r=resumoBase(b);
  if(!confirm('Enviar a base '+r.versao+'?\n\n'+fmt(r.estabelecimentos)+' estabelecimentos, '+fmt(r.clientes)+
     ' clientes BAND, '+fmt(r.rotas)+' rotas.\n\nEla passa a ser a base do painel.'))return;
  toast('Enviando a base…');
  try{
    const gz=new Uint8Array(buf)[0]===0x1f;
    const nome='base.json'+(gz?'.gz':'');
    await sobe('rtm-base',nome,new Blob([buf]),gz?'application/gzip':'application/json',true);
    const info={versao:b.versao,arquivo:nome,enviadaEm:new Date().toISOString(),enviadaPor:EU&&EU.email,
      bytes:buf.byteLength,estabelecimentos:r.estabelecimentos,clientes:r.clientes};
    await sobe('rtm-base','versao.json',new Blob([JSON.stringify(info)]),'application/json',true);
    toast('Base '+b.versao+' enviada');
    carregaBase(true);
  }catch(e){if(e.semSessao)return sessaoCaiu();toast('Não consegui enviar: '+e.message)}
}

    linha('Observação',esc(v.obs))+linha('Endereço',esc([v.endereco,v.bairro].filter(Boolean).join(' · ')))+
    linha('Rota',esc([v.rota,v.sv,v.consultor].filter(Boolean).join(' · ')))+
    linha('Roteiro','dia '+esc(v.diaRoteiro)+' ('+esc(v.dataPlan)+') · '+(v.noPrazo?'<span class="selo v">no prazo</span>':'<span class="selo a">fora do dia</span>'))+
    linha('Tempo da visita',v.duracaoMin?esc(v.inicioHora)+' às '+esc(v.hora)+' · '+v.duracaoMin+' min':'')+
    linha('Localização',g?'<a href="https://www.google.com/maps?q='+g.lat+','+g.lon+'" target="_blank" rel="noopener">'+g.lat.toFixed(5)+', '+g.lon.toFixed(5)+'</a> · precisão '+fmt(g.acc)+' m':'sem GPS')+
    linha('Distância do endereço',v.dist!=null?fmtKm(v.dist):'')+'</dl>';
  $('dlg').classList.add('on');$('fecha').onclick=fechaFicha;
  if($('ffoto'))fotoDaVisita(v).then(u=>{if(u&&$('ffoto'))$('ffoto').src=u});
}
function fechaFicha(){$('dlg').classList.remove('on')}
$('dlg').onclick=e=>{if(e.target===$('dlg'))fechaFicha()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')fechaFicha()});

/* ---------------- módulo: Mensagens ---------------- */
function mMsgs(){
  const ativos=D.devs.filter(d=>d.ativo);
  const opDest='<option value="todos">Todos os desenvolvedores</option>'+ativos.map(d=>'<option value="'+esc(d.login)+'">'+esc(d.nome)+'</option>').join('');
  const lista=D.msgs.map(m=>{
    const total=m.dev==='todos'?ativos.length:1,leu=+m.leu||0,rec=+m.recebeu||0;
    const agendada=m.ativarEm&&new Date(m.ativarEm)>new Date(),venc=m.expiraEm&&new Date(m.expiraEm)<new Date();
    return '<div class="msg">'+((m.imagemCaminho||m.imagem)?'<img data-cam="'+esc(m.imagemCaminho||'')+'" data-url="'+esc(m.imagem||'')+'" alt="">':'')+
      '<div style="min-width:0"><h3>'+esc(m.titulo||'(sem título)')+'</h3><p>'+esc(m.texto)+'</p>'+
      '<div class="meta"><span>'+esc(m.data)+'</span><span>Para: '+esc(m.dev==='todos'?'todos':((D.devs.find(d=>d.login===m.dev)||{}).nome||m.dev))+'</span>'+
      (agendada?'<span class="selo a">aparece em '+new Date(m.ativarEm).toLocaleString('pt-BR')+'</span>':'')+(venc?'<span class="selo c">expirada</span>':'')+'</div></div>'+
      '<div class="rec"><span style="font-size:12.5px;color:var(--ink2)">Leram <b style="color:var(--ink)">'+leu+'</b> de '+total+' · receberam '+rec+'</span>'+
      '<div class="barra"><span style="width:'+Math.min(100,Math.round(leu*100/Math.max(1,total)))+'%"></span></div>'+
      '<button class="bt peq" data-apaga="'+esc(m.id)+'">Apagar</button></div></div>';
  }).join('');
  return cab('Mensagens','Recados para o app dos desenvolvedores, com aviso no celular')+
   '<div class="corpo"><div class="msgs">'+
    '<div class="cartao"><div class="tt"><h2>Nova mensagem</h2></div><div class="cc">'+
     '<div class="campo"><label for="mt">Título</label><input id="mt" maxlength="120"></div>'+
     '<div class="campo"><label for="mx">Texto</label><textarea id="mx"></textarea></div>'+
     '<div class="campo"><label for="md">Para</label><select id="md">'+opDest+'</select></div>'+
     '<div class="duas"><div class="campo"><label for="mi">Aparece a partir de</label><input id="mi" type="datetime-local"></div>'+
     '<div class="campo"><label for="mf">Some depois de</label><input id="mf" type="datetime-local"></div></div>'+
     '<div class="campo"><label for="mimg">Imagem (opcional)</label><input id="mimg" type="file" accept="image/jpeg,image/png,image/webp"></div>'+
     '<button class="bt verm" id="menvia" style="width:100%">Enviar mensagem</button></div></div>'+
    '<div class="cartao"><div class="tt"><h2>Enviadas</h2><span>'+fmt(D.msgs.length)+'</span></div>'+
     (lista||'<div class="vazio">Nenhuma mensagem ainda.</div>')+'</div></div></div>';
}
liga.msgs=()=>{
  $('menvia').onclick=enviaMsg;
  document.querySelectorAll('[data-apaga]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Apagar esta mensagem? Ela some do app; o histórico fica guardado.'))return;
    try{await rpc('mensagem_apagar',{p_id:b.dataset.apaga});await carregaMsgs();pintaLado();pintaMain();toast('Mensagem apagada')}
    catch(e){if(e.semSessao)return sessaoCaiu();toast(e.message)}
  });
  document.querySelectorAll('.msg img').forEach(i=>{
    const p=i.dataset.cam?linkFoto(i.dataset.cam):Promise.resolve(/^https?:/.test(i.dataset.url)?i.dataset.url:'');
    p.then(u=>{if(u)i.src=u})});
};
/* imagem da mensagem: reduzida para no máximo 1600 px antes de subir */
function reduzImagem(arq){return new Promise((ok,erro)=>{
  const img=new Image();img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):erro(new Error('imagem inválida')),'image/jpeg',.82)};
  img.onerror=()=>erro(new Error('imagem inválida'));img.src=URL.createObjectURL(arq)})}
async function enviaMsg(){
  const titulo=$('mt').value.trim(),texto=$('mx').value.trim();
  if(!titulo&&!texto)return toast('Escreva um título ou um texto');
  const iso=id=>$(id).value?new Date($(id).value).toISOString():null;
  const b=$('menvia');b.disabled=true;b.textContent='Enviando…';
  try{
    let cam=null;const arq=$('mimg').files[0];
    if(arq){const blob=await reduzImagem(arq);
      cam='mensagens/'+new Date().toISOString().replace(/[^0-9]/g,'').slice(0,14)+'_'+Math.random().toString(36).slice(2,7)+'.jpg';
      await sobe('rtm-fotos',cam,blob,'image/jpeg',false)}
    await rpc('mensagem_gravar',{p_msg:{titulo,texto,dev:$('md').value,imagemCaminho:cam,ativarEm:iso('mi'),expiraEm:iso('mf')}});
    await carregaMsgs();pintaLado();pintaMain();toast('Mensagem enviada');
  }catch(e){if(e.semSessao)return sessaoCaiu();toast('Não consegui enviar: '+e.message);b.disabled=false;b.textContent='Enviar mensagem'}
}

/* ---------------- módulo: Desenvolvedores ---------------- */
function mDevs(){
  const quando=t=>t?new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'nunca';
  const cards=D.devs.map(d=>{
    const vis=D.visitas.filter(v=>v.devLogin===d.login),hoje=vis.filter(v=>v.data===hojeBR()).length;
    return '<div class="dev'+(d.ativo?'':' off')+'"><div class="top"><div class="av">'+esc(d.login.toUpperCase())+'</div>'+
      '<div style="flex:1;min-width:0"><input value="'+esc(d.nome)+'" data-nome="'+esc(d.login)+'" aria-label="Nome do desenvolvedor">'+
      '<div style="font-size:12.5px;color:var(--ink2)">'+esc(d.email)+'</div></div>'+
      '<span class="selo '+(d.ativo?'v':'c')+'">'+(d.ativo?'Ativo':'Desativado')+'</span></div>'+
      '<div class="lin"><span>Conta no Supabase</span><b>'+(d.contaCriada?'criada':'<span style="color:var(--verm)">não criada</span>')+'</b></div>'+
      '<div class="lin"><span>Primeiro acesso</span><b>'+(d.jaEntrou?(d.senhaPropria?'feito, com senha própria':'entrou, falta criar a senha'):'ainda não')+'</b></div>'+
      '<div class="lin"><span>Último acesso</span><b>'+quando(d.ultimoAcesso)+'</b></div>'+
      '<div class="lin"><span>Visitas</span><b>'+fmt(hoje)+' hoje · '+fmt(vis.length)+' no total</b></div>'+
      '<div class="bts"><button class="bt peq" data-ativo="'+esc(d.login)+'">'+(d.ativo?'Desativar':'Reativar')+'</button>'+
      '<button class="bt peq" data-senha="'+esc(d.login)+'">Voltar senha para a padrão</button></div></div>';
  }).join('');
  return cab('Desenvolvedores','Quem usa o app, o nome que aparece no roteiro e o acesso de cada um')+
    '<div class="corpo"><div class="info">Para mudar o nome, clique nele, digite e saia do campo. '+
    '"Voltar senha para a padrão" é para quem esqueceu a senha: no próximo acesso ele cria uma nova.</div>'+
    '<div class="devs">'+(cards||'<div class="vazio">Nenhum desenvolvedor cadastrado.</div>')+'</div></div>';
}
liga.devs=()=>{
  document.querySelectorAll('[data-nome]').forEach(i=>{
    i.onkeydown=e=>{if(e.key==='Enter')i.blur()};
    i.onchange=async()=>{const nome=i.value.trim();if(!nome)return pintaMain();
      try{await rpc('desenvolvedor_salvar',{p_login:i.dataset.nome,p_nome:nome});await carregaDevs();pintaMain();toast('Nome salvo: '+nome)}
      catch(e){if(e.semSessao)return sessaoCaiu();toast(e.message)}}});
  document.querySelectorAll('[data-ativo]').forEach(b=>b.onclick=async()=>{
    const d=D.devs.find(x=>x.login===b.dataset.ativo);
    if(d.ativo&&!confirm('Desativar '+d.nome+'? Ele deixa de entrar no app e de receber roteiro e mensagens. As visitas dele continuam guardadas.'))return;
    try{await rpc('desenvolvedor_salvar',{p_login:d.login,p_ativo:!d.ativo});await carregaDevs();pintaLado();pintaMain();toast(d.nome+(d.ativo?' desativado':' reativado'))}
    catch(e){if(e.semSessao)return sessaoCaiu();toast(e.message)}});
  document.querySelectorAll('[data-senha]').forEach(b=>b.onclick=async()=>{
    const d=D.devs.find(x=>x.login===b.dataset.senha);
    const s=prompt('Digite a senha padrão para '+d.nome+' (pelo menos 6 caracteres).\nEla não fica guardada no painel.');
    if(s==null)return;
    try{await rpc('voltar_senha_padrao',{p_login:d.login,p_senha:s});await carregaDevs();pintaMain();
      toast('Senha de '+d.nome+' voltou para a padrão')}
    catch(e){if(e.semSessao)return sessaoCaiu();toast(e.message)}});
};

/* ---------------- módulo: Base de dados ---------------- */
function mBase(){
  const i=D.baseInfo,r=D.baseResumo;
  let estado='';
  if(D.baseEstado==='carregando')estado='<div class="carregando">Conferindo a base no servidor…</div>';
  else if(D.baseEstado==='sem')estado='<div class="aviso"><b>Nenhuma base enviada ainda.</b> Envie o arquivo da base (base-rtm-….json.gz) '+
    'com o botão "Enviar base". Ela fica na pasta privada do Supabase e só o coordenador consegue baixar.</div>';
  else if(D.baseEstado==='erro')estado='<div class="aviso">Não consegui abrir a base: '+esc(D.baseErro)+'</div>';
  else if(D.baseEstado==='ok')estado='<div class="ok">Base <b>'+esc(r.versao)+'</b> pronta ('+esc(D.baseOrigem)+').</div>';
  const pop=D.base&&D.base.populacao;
  return cab('Base de dados','Receita Federal × clientes BAND, guardada na pasta privada do Supabase',
     '<button class="bt escuro" id="benvia">Enviar base</button>')+
   '<div class="corpo">'+estado+
   (r?'<div class="kpis"><div class="kpi"><b>'+fmt(r.estabelecimentos)+'</b><span>estabelecimentos da Receita</span></div>'+
     '<div class="kpi v"><b>'+fmt(r.clientes)+'</b><span>clientes BAND</span></div>'+
     '<div class="kpi"><b>'+fmt(r.rotas)+'</b><span>rotas com território</span></div>'+
     '<div class="kpi a"><b>'+fmt(r.municipiosPop)+'</b><span>municípios com população IBGE 2025</span></div></div>':'')+
   '<div class="cartao"><div class="tt"><h2>Sobre a base em uso</h2></div><div class="cc">'+
    (i?'<table class="tab"><tbody>'+
      '<tr><td style="width:240px">Versão</td><td><b>'+esc(i.versao)+'</b></td></tr>'+
      (r?'<tr><td>Descrição</td><td>'+esc(r.descricao)+'</td></tr>':'')+
      '<tr><td>Enviada em</td><td>'+(i.enviadaEm?new Date(i.enviadaEm).toLocaleString('pt-BR'):'—')+(i.enviadaPor?' por '+esc(i.enviadaPor):'')+'</td></tr>'+
      '<tr><td>Tamanho do arquivo</td><td>'+(i.bytes?fmt1(i.bytes/1048576)+' MB':'—')+'</td></tr>'+
      (pop?'<tr><td>População</td><td>'+esc(pop.fonte||'')+'</td></tr>':'')+
      '<tr><td>Neste computador</td><td>Guardada no navegador. O painel só baixa de novo quando a versão muda.</td></tr>'+
     '</tbody></table>':'<div class="vazio">Sem base no servidor.</div>')+
   '</div></div>'+
   '<div class="info">A base não fica dentro do painel: o painel é público no GitHub e a base tem nome, telefone e endereço dos PDVs. '+
   'Ela fica na pasta privada <b>rtm-base</b>, que só a conta de coordenador lê.</div></div>';
}
liga.base=()=>{$('benvia').onclick=()=>$('arqBase').click()};
$('arqBase').onchange=e=>{const f=e.target.files[0];e.target.value='';enviaBase(f)};

/* ---------------- início ---------------- */
async function abreApp(){
  $('entrada').classList.add('esc');$('app').classList.remove('esc');
  pintaLado();pintaMain();
  await atualizaTudo(true);
  carregaBase();
}
window.addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(k&&k!==MOD)ir(k)});
setInterval(()=>{if(SESSAO&&!document.hidden&&EU)carregaVisitas().then(()=>{pintaLado();if(MOD==='visitas'&&!$('dlg').classList.contains('on')&&document.activeElement.tagName!=='INPUT')pintaMain()}).catch(()=>{})},60000);
(async function(){
  if(!SESSAO)return telaEntrada();
  try{const q=await rpc('quem_sou');if(q.papel!=='coordenador')throw new Error('Esta conta não é de coordenador.');EU=q;abreApp()}
  catch(e){if(SESSAO&&!e.semSessao&&!/conex/i.test(e.message))await sai();telaEntrada(e.semSessao?'Sua sessão expirou. Entre de novo.':e.message)}
})();
